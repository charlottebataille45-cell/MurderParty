<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAUA4xdHZyh17ZkmDHe0gXqIrNZgEovcrw',
  authDomain: 'roubatvot-murder-party.firebaseapp.com',
  databaseURL: 'https://roubatvot-murder-party-default-rtdb.firebaseio.com',
  projectId: 'roubatvot-murder-party',
  storageBucket: 'roubatvot-murder-party.firebasestorage.app',
  messagingSenderId: '225363228130',
  appId: '1:225363228130:web:94c1839cbe0d542f86b5bb',
  measurementId: 'G-0C0DLB8E6C'
};
const configured = ['apiKey','authDomain','databaseURL','projectId','appId'].every(k =>
  typeof firebaseConfig[k] === 'string' && firebaseConfig[k].length > 5 && !firebaseConfig[k].startsWith('REMPLACER_')
);
let app, auth, db, bootPromise, unsubscribers = [], offsetMs = 0;
const players = ['james','nino','andreas','matys','mathieu'];
function stopListening() { unsubscribers.forEach(unsub => unsub()); unsubscribers = []; }
function pathFor(code, name) { return ref(db, `rooms/${code}/${name}`); }
async function boot() {
  if (!configured) throw new Error('Complète firebaseConfig dans le HTML avant la connexion.');
  if (!bootPromise) bootPromise = (async () => {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
    const user = await new Promise((resolve, reject) => {
      let unsub = () => {};
      unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); }, reject);
    });
    if (!user) await signInAnonymously(auth);
    if (!auth.currentUser) throw new Error('Authentification anonyme indisponible. Active-la dans Firebase Authentication.');
    return auth.currentUser.uid;
  })();
  return bootPromise;
}
function randomRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}
async function createRoom() {
  const uid = await boot();
  for (let i=0; i<6; i++) {
    const code = randomRoomCode();
    try {
      await set(pathFor(code,''), {
        hostUid: uid,
        createdAt: serverTimestamp(),
        players: { charlotte: { uid } },
        progress: {
          confession: false,
          hintAll: false,
          round: 1,
          clock: { running: false, elapsedMs: 0, startedAt: 0 }
        }
      });
      return {code, playerId:'charlotte', isHost:true};
    } catch (error) {
      // Collision (extrêmement improbable) : on réessaie seulement si la salle existe.
      try { if (!(await get(pathFor(code,'hostUid'))).exists()) throw error; }
      catch (checkError) { throw error; }
    }
  }
  throw new Error('Impossible de générer un code de salle libre.');
}
async function joinRoom(roomCode, playerId) {
  const uid = await boot();
  const code = String(roomCode || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) throw new Error('Le code de salle doit contenir huit caractères.');
  if (!players.includes(playerId) && playerId !== 'charlotte') throw new Error('Choisis un personnage valide.');
  const hostSnap = await get(pathFor(code,'hostUid'));
  if (!hostSnap.exists()) throw new Error('Salle introuvable. Vérifie les huit caractères.');
  const isHost = hostSnap.val() === uid;
  if (playerId === 'charlotte' && !isHost) throw new Error('Seul l’appareil créateur peut rejoindre le rôle MJ.');
  if (playerId !== 'charlotte' && isHost) throw new Error('Le téléphone MJ doit conserver son propre profil.');
  const playerRef = pathFor(code, `players/${playerId}`);
  const prior = await get(playerRef);
  if (prior.exists() && prior.child('uid').val() !== uid) throw new Error('Ce personnage est déjà pris sur un autre téléphone.');
  if (!prior.exists()) await set(playerRef, {uid});
  return {code, playerId, isHost};
}
function listenRoom(session, callbacks) {
  stopListening();
  const { code, playerId, isHost } = session;
  unsubscribers.push(onValue(pathFor(code,'progress'), snap => callbacks.progress(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'players'), snap => callbacks.players(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,isHost?'votes':`votes/${playerId}`), snap => callbacks.votes(snap.val() || null), callbacks.error));
  unsubscribers.push(onValue(ref(db,'.info/serverTimeOffset'), snap => {
    offsetMs = Number(snap.val()) || 0;
    callbacks.offset(offsetMs);
  }, callbacks.error));
}
async function publishSolved(code, level, playerId) {
  if (!players.includes(playerId) || players[level-1] !== playerId) throw new Error('Cette énigme ne correspond pas au joueur.');
  await set(pathFor(code,`progress/solved/${level}`),true);
}
async function forceSolve(code, id) {
  for (let i=1; i<=id; i++) await set(pathFor(code,`progress/solved/${i}`),true);
}
async function hostFlag(code,name,value) {
  if (!['confession','hintAll'].includes(name)) throw new Error('Commande MJ inconnue.');
  await set(pathFor(code,`progress/${name}`),Boolean(value));
}
async function hostClock(code, running, currentClock) {
  const now = Date.now()+offsetMs;
  const elapsed = Number(currentClock?.elapsedMs || 0);
  const started = Number(currentClock?.startedAt || 0);
  await set(pathFor(code,'progress/clock'),running
    ? {running:true,elapsedMs:elapsed,startedAt:serverTimestamp()}
    : {running:false,elapsedMs:elapsed+(currentClock?.running ? Math.max(0,now-started):0),startedAt:0});
}
async function castVote(code, playerId, vote) {
  await set(pathFor(code,`votes/${playerId}`), {
    coupable:vote.coupable,
    motif:vote.motif,
    submittedAt:serverTimestamp()
  });
}
async function resetRoom(code) {
  const roundSnap = await get(pathFor(code,'progress/round'));
  const nextRound = (Number(roundSnap.val()) || 1) + 1;
  await update(pathFor(code,'progress'), {
    solved:null,
    confession:false,
    hintAll:false,
    round:nextRound,
    clock:{running:false,elapsedMs:0,startedAt:0}
  });
  await set(pathFor(code,'votes'),null);
}
window.RoubatvotFirebase = {configured, boot, createRoom, joinRoom, listenRoom, stopListening,
  publishSolved, forceSolve, hostFlag, hostClock, castVote, resetRoom};
window.dispatchEvent(new Event('roubatvot-firebase-ready'));
</script>

                                  <p>On ne garde pas un héritage pour sa valeur.</p>
                                  <p>Un serment traverse les générations.</p>
                                  <p>Rien ne protège mieux ceux qu'on aime.</p>
                                </div>
                                <p className="font-semibold">À la lecture de ce registre, Émile cherchait surtout à :</p>
                                <div className="space-y-2">
                                  <button className={optionStyle(matysReading==='fortune')} onClick={()=>setMatysReading('fortune')}>Protéger une fortune cachée.</button>
                                  <button className={optionStyle(matysReading==='souvenir')} onClick={()=>setMatysReading('souvenir')}>Préserver un lien familial, sans désigner de coupable.</button>
                                  <button className={optionStyle(matysReading==='accuser')} onClick={()=>setMatysReading('accuser')}>Accuser définitivement Marguerite.</button>
                                </div>
                                <label htmlFor="answer-puzzle" className="block text-slate-300">Trouve également le mot caché de cinq lettres.</label>
                              </div>
                            )}
                            {myPuzzle.id === 5 && (
                              <div className="space-y-3 text-xs">
                                <p>🧙‍♂️ <strong>Mission Mathieu :</strong> sépare les faits des conclusions. Ce n'est pas une preuve de piratage.</p>
                                <pre className="bg-slate-950 p-3 rounded-lg border border-slate-700 text-emerald-300 whitespace-pre-wrap leading-relaxed text-[11px]">[20:20] ACCES     : passage sur le réseau local{'\n'}[20:27] N0CT-7   : session ouverte / module assemblé{'\n'}[20:31] AFFICHAGE : lettre visible sur l'écran{'\n'}[--:--] LIAISON   : identifiant de corrélation absent</pre>
                                <p className="font-semibold">1. Quelle chronologie est établie ?</p>
                                <div className="space-y-2">
                                  <button className={optionStyle(mathieuChronology==='apres')} onClick={()=>setMathieuChronology('apres')}>La session commence quatre minutes après la lettre.</button>
                                  <button className={optionStyle(mathieuChronology==='avant')} onClick={()=>setMathieuChronology('avant')}>La session précède la lettre de quatre minutes.</button>
                                  <button className={optionStyle(mathieuChronology==='ensemble')} onClick={()=>setMathieuChronology('ensemble')}>Les deux événements sont simultanés.</button>
                                </div>
                                <p className="font-semibold">2. Que permettent de conclure ces logs ?</p>
                                <div className="space-y-2">
                                  <button className={optionStyle(mathieuDiagnosis==='piratage')} onClick={()=>setMathieuDiagnosis('piratage')}>Ils prouvent qu'un joueur a falsifié la lettre.</button>
                                  <button className={optionStyle(mathieuDiagnosis==='incertain')} onClick={()=>setMathieuDiagnosis('incertain')}>Ils prouvent l'ordre des événements, pas qui a causé l'affichage.</button>
                                  <button className={optionStyle(mathieuDiagnosis==='identique')} onClick={()=>setMathieuDiagnosis('identique')}>Ils prouvent qu'il ne s'est rien passé entre 20 h 27 et 20 h 31.</button>
                                </div>
                                <button onClick={() => {
                                  if (!navigator.clipboard?.writeText) { setPuzzleError('Copie indisponible sur ce navigateur.'); return; }
                                  navigator.clipboard.writeText(promptCyber).then(()=>setPuzzleError('Prompt copié : tu peux demander une seconde analyse à une IA.')).catch(()=>setPuzzleError('Copie indisponible : sélectionne les journaux manuellement.'));
                                }} className="bg-slate-800 border border-slate-700 rounded-lg p-2 w-full">📋 Copier le prompt d'analyse IA (facultatif)</button>
                              </div>
                            )}

                            <div className="space-y-2 text-[11px] pt-2 border-t border-slate-800">
                              <div className="flex justify-between items-center text-slate-300">
                                <span>💡 Indices progressifs · {Math.floor(elapsed/60)} min sur l'épreuve</span>
                                {hintLevel < 2 && <button onClick={()=>requestHint(myPuzzle.id)} className="text-amber-400 underline">Demander un indice</button>}
                              </div>
                              <div className={`p-2.5 rounded border ${hintLevel>=1 ? 'bg-amber-950/30 border-amber-800 text-amber-100':'bg-slate-950 border-slate-800 text-slate-500'}`}>
                                {hintLevel>=1 ? myPuzzle.hint3min : '🔒 Premier indice : après 3 min (ou sur demande)'}
                              </div>
                              <div className={`p-2.5 rounded border ${hintLevel>=2 ? 'bg-amber-950/30 border-amber-800 text-amber-100':'bg-slate-950 border-slate-800 text-slate-500'}`}>
                                {hintLevel>=2 ? myPuzzle.hint5min : '🔒 Second indice : après 5 min (ou sur demande)'}
                              </div>
                            </div>
                            {(myPuzzle.id === 2 || myPuzzle.id === 4) && (
                              <input id="answer-puzzle" type="text" autoComplete="off" placeholder={myPuzzle.id === 2 ? 'Message déchiffré…' : 'Mot de cinq lettres…'} value={puzzleInput} onChange={e=>setPuzzleInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleSolveMyPuzzle(myPuzzle);}} className="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm uppercase font-mono tracking-wide" />
                            )}
                            <button onClick={() => handleSolveMyPuzzle(myPuzzle)} className="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-lg text-sm">{myPuzzle.id===1?'✂️ Couper le fil':myPuzzle.id===3?'🔓 Ouvrir le cadenas':myPuzzle.id===5?'📑 Valider le diagnostic':'Valider ma déduction'}</button>
                            {puzzleError && <p role="alert" className={`text-xs font-semibold ${puzzleError.startsWith('Prompt copié')?'text-emerald-300':'text-rose-400'}`}>{puzzleError}</p>}
                          </>
                        )}
                      </div>
                    );

                  })()
                )}
              </div>
            )}

            {/* ONGLET 3 : ÉCRAN COMMUN */}
            {activeTab === 'common' && (
              <div className="space-y-3 animate-fade-in">
                <div className="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs">
                  <span className="text-slate-300 font-semibold">Progression Globale</span>
                  <span className="text-amber-400 font-bold bg-slate-950 px-2 py-1 rounded">{solvedLevels.length} / 5 Résolues</span>
                </div>
                {!sharedMode && relayForm}
                <div className="space-y-2.5">
                  {PUZZLES.map(puzzle => {
                    const isSolved = solvedLevels.includes(puzzle.id);
                    const owner = PLAYERS[puzzle.assignedTo];
                    return (
                      <div key={puzzle.id} className={`p-3 rounded-xl border text-xs ${isSolved ? 'bg-emerald-950/20 border-emerald-800/50' : 'bg-slate-900/60 border-slate-800'}`}>
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-cinzel font-bold text-slate-100">{puzzle.title}</span>
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${isSolved ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}`}>
                            {isSolved ? 'Résolu ✅' : 'En attente 🔒'}
                          </span>
                        </div>
                        <p className="text-[11px] text-slate-400">
                          {isSolved ? '✅ Preuve archivée au dossier.' : `🔒 En attente de l'action du ${owner.pseudonym} (${owner.name}).`}
                        </p>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ONGLET 4 : DOSSIER DES PREUVES */}
            {activeTab === 'dossier' && (
              <div className="space-y-3 animate-fade-in">
                <h2 className="font-cinzel font-bold text-amber-400 text-sm">Dossier des Preuves</h2>
                <div className="space-y-2">
                  {evidenceList.map((ev, i) => (
                    <div key={i} className="bg-slate-900 border border-amber-900/30 p-2.5 rounded-lg text-xs flex items-start space-x-2">
                      <span className="text-amber-400">🔍</span>
                      <span className="text-slate-200">{ev}</span>
                    </div>
                  ))}
                  {evidenceList.length === 0 && <p className="text-xs text-slate-500 italic text-center py-4">Aucune preuve pour l'instant.</p>}

                  {margueriteUnlocked && (
                    <div className="bg-purple-950/40 border border-purple-500/50 p-3 rounded-lg text-xs space-y-1">
                      <span className="font-bold text-purple-300">📜 Pièce H-02 : Confession de Marguerite (1897)</span>
                      <p className="text-purple-200 italic">"J'ai pris l'Œil des Roubatvot avant que mon oncle ne découvre sa disparition..."</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ONGLET 5 : VOTE FINAL */}
            {activeTab === 'vote' && (
              <div className="space-y-3 animate-fade-in">
                <h2 className="font-cinzel font-bold text-amber-400 text-sm">Tribunal Final</h2>
                {!voteSubmitted ? (
                  <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">1. Qui a volé le médaillon en 1897 ?</label>
                      <select value={votes.coupable} onChange={e=>setVotes({...votes, coupable: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-2 rounded text-slate-200">
                        <option value="">-- Sélectionnez --</option>
                        <option value="Marguerite">Marguerite</option>
                        <option value="Émile">Émile</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">2. Qui a déclenché le protocole à 20h27 ?</label>
                      <select value={votes.motif} onChange={e=>setVotes({...votes, motif: e.target.value})} className="w-full bg-slate-950 border border-slate-700 p-2 rounded text-slate-200">
                        <option value="">-- Sélectionnez --</option>
                        <option value="Mathieu">Mathieu</option>
                        <option value="Nino">Nino</option>
                        <option value="Indéterminé">Impossible à établir avec les seuls journaux</option>
                      </select>
                    </div>
                    <button disabled={!votes.coupable || !votes.motif} onClick={()=>setVoteSubmitted(true)} className="w-full bg-amber-500 disabled:opacity-50 text-slate-950 font-bold py-2 rounded text-xs">
                      Sceller mon Vote
                    </button>
                  </div>
                ) : (
                  <div className="bg-emerald-950/30 border border-emerald-800 p-4 rounded-xl text-center text-xs text-emerald-400">
                    ✅ Vote scellé avec succès ! Attends la proclamation.
                  </div>
                )}
              </div>
            )}

            {/* ONGLET 6 : PANNEAU MJ */}
            {activeTab === 'mj' && currentUser.isMJ && (
              <div className="space-y-3 animate-fade-in">
                <h2 className="font-cinzel font-bold text-rose-400 text-sm">Panneau Charlotte (MJ)</h2>
                <p className="text-xs text-slate-400">{sharedMode ? 'Commandes protégées par l’identité du créateur de la salle. Les actions et les preuves sont synchronisées.' : 'Mode secours : le tableau reflète ce téléphone uniquement. Reçois les codes des joueurs dans « Écran commun ».'}</p>
                {sharedMode && <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                  <p className="font-bold text-amber-400">Participants connectés à la salle</p>
                  {Object.keys(PLAYERS).map(id=><p key={id} className="flex justify-between"><span>{PLAYERS[id].avatar} {PLAYERS[id].name}</span><span>{roomPlayers[id]?'Profil réservé':'En attente'}</span></p>)}
                  <p className="font-bold text-amber-400 pt-2">Votes enregistrés : {Object.keys(remoteVotes || {}).length} / 5</p>
                  {Object.entries(remoteVotes || {}).map(([id,v])=><p key={id}>{PLAYERS[id]?.name || id} : {v.coupable} · {v.motif}</p>)}
                </div>}
                <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                  <button onClick={() => setIsTimerActive(!isTimerActive)} className="w-full bg-slate-800 text-amber-400 py-2 rounded font-semibold">
                    {isTimerActive ? '⏸ Pause Chrono' : '▶ Lancer Chrono'}
                  </button>
                  <button onClick={() => sharedMode ? window.RoubatvotFirebase.hostFlag(roomSession.code,'hintAll',!remoteProgress?.hintAll).catch(e=>setFirebaseError(e.message)) : setMjForceHints(!mjForceHints)} className="w-full bg-amber-900/60 text-amber-200 py-2 rounded font-semibold">
                    {(sharedMode ? remoteProgress?.hintAll : mjForceHints) ? 'Verrouiller Indices' : '💡 Forcer Indices pour Tous'}
                  </button>
                  <button onClick={() => setMargueriteUnlocked(!margueriteUnlocked)} className="w-full bg-rose-900/60 text-rose-200 py-2 rounded font-semibold">
                    {margueriteUnlocked ? 'Masquer Confession H-02' : '🔓 Libérer Confession H-02'}
                  </button>
                  <div className="pt-2 border-t border-slate-800 font-bold text-slate-300">{sharedMode ? 'Déblocage forcé pour tous :' : 'Déblocage forcé (sur cet appareil) :'}</div>
                  {PUZZLES.map(p => (
                    <div key={p.id} className="flex justify-between items-center bg-slate-950 p-2 rounded">
                      <span>Épreuve {p.id}</span>
                      <button disabled={solvedLevels.includes(p.id)} onClick={()=>handleMJUnlock(p.id)} className="bg-amber-500 disabled:bg-slate-800 text-slate-950 text-[10px] px-2 py-1 rounded font-bold">
                        {solvedLevels.includes(p.id) ? 'Validé' : 'Forcer'}
                      </button>
                    </div>
                  ))}
                  <button className="w-full bg-rose-950 border border-rose-700 text-rose-200 rounded py-2" onClick={()=>{
                    if(confirm(sharedMode ? 'Réinitialiser la partie POUR TOUS les joueurs ? Cette action efface les votes et les preuves partagés.' : 'Réinitialiser le jeu sur CE téléphone ? Cette action efface aussi les votes et preuves locaux.')) {
                      if (sharedMode) {window.RoubatvotFirebase.resetRoom(roomSession.code).catch(e=>setFirebaseError(e.message));} else setGame({...defaultProgress, votes: {...defaultProgress.votes}, puzzleStarts:{}, hintsAsked:{}});
                      setPuzzleInput(''); setRelayInput(''); setRelayMessage(''); setMjForceHints(false); setPuzzleError('');
                    }
                  }}>↺ {sharedMode ? 'Réinitialiser la salle entière' : 'Réinitialiser sur cet appareil'}</button>
                </div>
              </div>
            )}
          </>
        )}

      </main>

      <footer className="bg-slate-950 border-t border-slate-900 p-2 text-center text-[10px] text-slate-500">
        La Malédiction des Roubatvot &copy; 2026 - Ingré · {sharedMode ? "synchronisation Firebase" : "mode local avec codes-relais"}
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
