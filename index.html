<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAUA4xdHZyh17ZkmDHe0gXqIrNZgEovcrw',
  authDomain: 'roubatvot-murder-party.firebaseapp.com',
  databaseURL: 'https://roubatvot-murder-party-default-rtdb.firebaseio.com',
  projectId: 'roubatvot-murder-party',
  storageBucket: 'roubatvot-murder-party.firebasestorage.app',
  messagingSenderId: '225363228130',
  appId: '1:225363228130:web:94c1839cbe0d542f86b5bb',
  measurementId: 'G-0C0DLB8E6C'
};
const configured = ['apiKey','authDomain','databaseURL','projectId','appId'].every(k =>
  typeof firebaseConfig[k] === 'string' && firebaseConfig[k].length > 5 && !firebaseConfig[k].startsWith('REMPLACER_')
);
let app, auth, db, bootPromise, unsubscribers = [], offsetMs = 0;
const players = ['james','nino','andreas','matys','mathieu'];
function stopListening() { unsubscribers.forEach(unsub => unsub()); unsubscribers = []; }
function pathFor(code, name) { return ref(db, `rooms/${code}/${name}`); }
async function boot() {
  if (!configured) throw new Error('Complète firebaseConfig dans le HTML avant la connexion.');
  if (!bootPromise) bootPromise = (async () => {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
    const user = await new Promise((resolve, reject) => {
      let unsub = () => {};
      unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); }, reject);
    });
    if (!user) await signInAnonymously(auth);
    if (!auth.currentUser) throw new Error('Authentification anonyme indisponible. Active-la dans Firebase Authentication.');
    return auth.currentUser.uid;
  })();
  await bootPromise;
  return auth.currentUser?.uid;
}
function currentHostAccount() {
  const user = auth?.currentUser;
  return user?.providerData?.some(p => p.providerId === 'google.com') ? {uid:user.uid,email:user.email,verified:user.emailVerified} : null;
}
async function signInHost() {
  if (!auth) throw new Error('Firebase n’est pas prêt.');
  const result = await signInWithPopup(auth,new GoogleAuthProvider());
  if (!result.user.emailVerified) throw new Error('Le compte Google doit avoir une adresse e-mail vérifiée.');
  return currentHostAccount();
}
async function switchToAnonymous() {
  await boot();
  await signOut(auth);
  await signInAnonymously(auth);
}
function randomRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}
async function createRoom() {
  const uid = await boot();
  if (!currentHostAccount()?.verified) throw new Error('Connecte-toi avec ton compte Google pour créer une salle MJ.');
  for (let i=0; i<6; i++) {
    const code = randomRoomCode();
    try {
      await set(pathFor(code,''), {
        hostUid: uid,
        createdAt: serverTimestamp(),
        players: { charlotte: { uid } },
        progress: {
          confession: false,
          hintAll: false,
          round: 1,
          clock: { running: false, elapsedMs: 0, startedAt: 0 }
        }
      });
      return {code, playerId:'charlotte', isHost:true};
    } catch (error) {
      // Collision (extrêmement improbable) : on réessaie seulement si la salle existe.
      try { if (!(await get(pathFor(code,'hostUid'))).exists()) throw error; }
      catch (checkError) { throw error; }
    }
  }
  throw new Error('Impossible de générer un code de salle libre.');
}
async function joinRoom(roomCode, playerId) {
  const uid = await boot();
  const code = String(roomCode || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) throw new Error('Le code de salle doit contenir huit caractères.');
  if (!players.includes(playerId) && playerId !== 'charlotte') throw new Error('Choisis un personnage valide.');
  const hostSnap = await get(pathFor(code,'hostUid'));
  if (!hostSnap.exists()) throw new Error('Salle introuvable. Vérifie les huit caractères.');
  const isHost = hostSnap.val() === uid;
  if (playerId === 'charlotte' && !currentHostAccount()?.verified) throw new Error('La connexion Google est obligatoire pour reprendre le rôle MJ.');
  if (playerId === 'charlotte' && !isHost) throw new Error('Seul le compte Google créateur peut rejoindre le rôle MJ.');
  if (playerId !== 'charlotte' && isHost) throw new Error('Le téléphone MJ doit conserver son propre profil.');
  const playerRef = pathFor(code, `players/${playerId}`);
  const prior = await get(playerRef);
  if (prior.exists() && prior.child('uid').val() !== uid) throw new Error('Ce personnage est déjà pris sur un autre téléphone.');
  if (!prior.exists()) await set(playerRef, {uid});
  return {code, playerId, isHost};
}
function listenRoom(session, callbacks) {
  stopListening();
  const { code, playerId, isHost } = session;
  unsubscribers.push(onValue(pathFor(code,'progress'), snap => callbacks.progress(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'players'), snap => callbacks.players(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,isHost?'votes':`votes/${playerId}`), snap => callbacks.votes(snap.val() || null), callbacks.error));
  unsubscribers.push(onValue(ref(db,'.info/serverTimeOffset'), snap => {
    offsetMs = Number(snap.val()) || 0;
    callbacks.offset(offsetMs);
  }, callbacks.error));
}
async function publishSolved(code, level, playerId) {
  if (!players.includes(playerId) || players[level-1] !== playerId) throw new Error('Cette énigme ne correspond pas au joueur.');
  await set(pathFor(code,`progress/solved/${level}`),true);
}
async function forceSolve(code, id) {
  for (let i=1; i<=id; i++) await set(pathFor(code,`progress/solved/${i}`),true);
}
async function hostFlag(code,name,value) {
  if (!['confession','hintAll'].includes(name)) throw new Error('Commande MJ inconnue.');
  await set(pathFor(code,`progress/${name}`),Boolean(value));
}
async function hostClock(code, running, currentClock) {
  const now = Date.now()+offsetMs;
  const elapsed = Number(currentClock?.elapsedMs || 0);
  const started = Number(currentClock?.startedAt || 0);
  await set(pathFor(code,'progress/clock'),running
    ? {running:true,elapsedMs:elapsed,startedAt:serverTimestamp()}
    : {running:false,elapsedMs:elapsed+(currentClock?.running ? Math.max(0,now-started):0),startedAt:0});
}
async function castVote(code, playerId, vote) {
  await set(pathFor(code,`votes/${playerId}`), {
    historique:vote.historique,
    protocole:vote.protocole,
    intention:vote.intention,
    tresor:vote.tresor,
    submittedAt:serverTimestamp()
  });
}
async function resetRoom(code) {
  const roundSnap = await get(pathFor(code,'progress/round'));
  const nextRound = (Number(roundSnap.val()) || 1) + 1;
  await update(pathFor(code,'progress'), {
    solved:null,
    confession:false,
    hintAll:false,
    round:nextRound,
    clock:{running:false,elapsedMs:0,startedAt:0}
  });
  await set(pathFor(code,'votes'),null);
}
window.RoubatvotFirebase = {configured, boot, createRoom, joinRoom, listenRoom, stopListening,
  publishSolved, forceSolve, hostFlag, hostClock, castVote, resetRoom, currentHostAccount, signInHost, switchToAnonymous};
window.dispatchEvent(new Event('roubatvot-firebase-ready'));
</script>

                  <p className="uppercase tracking-widest text-[10px] text-amber-300">Tribunal · Phase finale</p>
                  <h2 className="font-cinzel font-bold text-amber-300 text-lg">Votre verdict, pas un simple suspect</h2>
                  <p className="text-xs text-slate-300">L’enquête comporte <strong>trois affaires liées</strong>. Vote pour tes hypothèses sur le vol historique, le protocole et le coffret d’Halloween. Le choix « Impossible à déterminer » est toujours acceptable : ne confonds pas soupçon et preuve.</p>
                </div>
                {currentUser.isMJ ? (
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl text-xs text-slate-300 space-y-2">
                    <p>👑 Charlotte ne vote pas. Tu peux consulter les bulletins dans <strong>MJ</strong> et lancer la révélation après les enquêteurs.</p>
                    <button className="bg-rose-900 text-rose-100 rounded-lg p-3 w-full font-bold" onClick={()=>setActiveTab('mj')}>Ouvrir les commandes MJ</button>
                  </div>
                ) : solvedLevels.length < PUZZLES.length && !margueriteUnlocked ? (
                  <div className="rounded-xl bg-slate-900 border border-slate-700 p-4 space-y-3 text-xs text-slate-300">
                    <p className="text-amber-300 font-semibold">🔒 Débat final encore verrouillé</p>
                    <p>Il reste {PUZZLES.length-solvedLevels.length} épreuve(s) à résoudre. Le tribunal commencera quand les cinq preuves seront réunies.</p>
                    <button className="w-full bg-slate-800 rounded-lg p-3 font-semibold" onClick={()=>setActiveTab('common')}>Voir les étapes restantes</button>
                  </div>
                ) : voteSubmitted ? (
                  <div className="rounded-xl border border-emerald-700 bg-emerald-950/30 p-4 space-y-3 text-xs">
                    <p className="text-emerald-300 font-bold">✅ Verdict scellé et enregistré</p>
                    <p className="text-slate-300">Tu ne peux voter qu’une fois par manche. Les réponses seront confrontées à la vérité après la révélation de Charlotte.</p>
                    {(sharedMode && remoteVotes?.historique === undefined) ? <p className="text-amber-200">Ce bulletin vient de l’ancienne version ({remoteVotes?.coupable} · {remoteVotes?.motif}). Pour tester le nouveau tribunal, demande à Charlotte de lancer une nouvelle manche.</p> : VOTE_QUESTIONS.map(q=><p key={q.key} className="text-slate-200"><strong>{q.title}</strong> {voteLabel(q,sharedMode ? remoteVotes?.[q.key] : votes[q.key])}</p>)}
                    {margueriteUnlocked && <button className="bg-purple-900 rounded-lg py-2.5 w-full font-bold" onClick={()=>setActiveTab('reveal')}>Voir le dénouement</button>}
                  </div>
                ) : (
                  <div className="space-y-3">
                    {VOTE_QUESTIONS.map((q,i) => (
                      <fieldset key={q.key} className="bg-slate-900 border border-slate-700 rounded-xl p-4 space-y-2">
                        <legend className="sr-only">{q.title}</legend>
                        <p className="font-cinzel font-bold text-amber-300 text-sm">{i+1}. {q.title}</p>
                        <p className="text-xs text-slate-400">{q.help}</p>
                        {q.options.map(([value,label]) => (
                          <button key={value} type="button" aria-pressed={votes[q.key]===value} onClick={()=>setVotes({...votes,[q.key]:value})} className={`w-full text-left rounded-lg border p-3 text-xs transition ${votes[q.key]===value ? 'bg-amber-500/20 border-amber-400 text-amber-100 font-bold' : 'bg-slate-950 border-slate-700 text-slate-200'}`}>
                            <span aria-hidden="true">{votes[q.key]===value ? '◉' : '○'} </span>{label}
                          </button>
                        ))}
                      </fieldset>
                    ))}
                    <div className="bg-slate-900 border border-amber-800/40 p-3 rounded-xl space-y-2">
                      <p className="text-xs text-slate-300">Réponses renseignées : <strong>{VOTE_QUESTIONS.filter(q=>!!votes[q.key]).length}/4</strong>. Une fois enregistré, le bulletin est définitif.</p>
                      <button disabled={!voteComplete || voteBusy} onClick={submitVote} className="w-full bg-amber-500 disabled:bg-slate-700 disabled:text-slate-400 text-slate-950 font-bold py-3 rounded-lg text-sm">{voteBusy?'Enregistrement…':'🗳️ Sceller mes quatre réponses'}</button>
                      {voteError && <p role="alert" className="text-rose-300 text-xs">{voteError}</p>}
                    </div>
                  </div>
                )}
              </section>
            )}

            {/* DÉNOUEMENT : trois réponses distinctes et lien vers les votes, diffusé via confession */}
            {activeTab === 'reveal' && margueriteUnlocked && (
              <section aria-label="Révélation finale de la Murder Party" aria-live="polite" className="space-y-4">
                <div className="rounded-2xl border-2 border-purple-500/70 bg-gradient-to-b from-purple-950/80 to-slate-900 p-5 text-center space-y-2">
                  <div className="text-5xl">🕯️</div>
                  <p className="uppercase tracking-widest text-[10px] font-bold text-purple-300">Dossier H-02 · Déclassification autorisée</p>
                  <h2 className="font-cinzel text-xl font-bold text-amber-300">La vérité des Roubatvot</h2>
                  <p className="text-xs text-slate-200">Vous cherchiez un seul responsable. Pourtant trois histoires s’étaient superposées.</p>
                </div>
                <div className="rounded-xl border border-amber-700/60 bg-slate-900 p-4 space-y-2 text-xs leading-relaxed">
                  <h3 className="font-cinzel font-bold text-amber-300 text-sm">📜 Acte I · La trahison de 1897</h3>
                  <p>Augustin avait caché l’Œil des Roubatvot, un médaillon de famille. <strong>Marguerite l’a retrouvé et pris.</strong> Pour détourner les soupçons, elle a accusé Émile. La famille a transmis cette fausse histoire comme une malédiction.</p>
                  <p className="italic text-amber-100">« J’ai pris l’Œil des Roubatvot. Émile n’y était pour rien. » — aveu de Marguerite, pièce H-02.</p>
                  <p>Le mot <strong>AMOUR</strong> dans le registre d’Émile rappelait que l’héritage familial ne se juge pas sur une accusation sans preuve.</p>
                </div>
                <div className="rounded-xl border border-cyan-700/60 bg-slate-900 p-4 space-y-2 text-xs leading-relaxed">
                  <h3 className="font-cinzel font-bold text-cyan-300 text-sm">🖥️ Acte II · Le protocole réveillé</h3>
                  <p>La carte découverte par James portait <strong>N0CT-7</strong> et la séquence <strong>3 → 1 → 2</strong>. Nino a identifié NODE-7. Andreas a établi les horaires.</p>
                  <p><strong>À 20 h 27, Mathieu a activé le protocole sans le vouloir</strong> en manipulant le module. À <strong>20 h 31</strong>, la lettre s’est affichée. Il n’avait pas prévu ce résultat.</p>
                  <p className="text-slate-300">Attention : les horaires seuls ne suffisaient pas à l’accuser. C’est le croisement des objets, des témoignages et des éléments techniques qui permet de comprendre son intervention ; le diagnostic de Mathieu avait raison de distinguer chronologie et responsabilité.</p>
                </div>
                <div className="rounded-xl border-2 border-pink-500/60 bg-pink-950/25 p-5 space-y-3 text-center">
                  <div className="text-5xl">🍒</div>
                  <h3 className="font-cinzel text-lg font-bold text-pink-200">Acte III · Le Trésor de la Chouquette</h3>
                  <p className="text-sm text-slate-100 leading-relaxed">Le médaillon volé en 1897 n’était pas le coffret disparu ce soir. Le protocole informatique non plus n’avait pas emporté le Trésor. Pendant que tout le monde cherchait un suspect parmi les grands, <strong>Enola a déplacé le coffret pour jouer</strong>, sans imaginer l’enquête qu’elle allait déclencher.</p>
                  <p className="text-xs text-pink-100">La petite empreinte et la trace chocolatée prenaient enfin leur sens. Il ne s’agissait ni d’un cambriolage ni d’une vengeance.</p>
                </div>
                <div className="rounded-xl bg-slate-900 border border-slate-700 p-4 space-y-2 text-xs">
                  <p className="font-semibold text-amber-300">🎬 Charlotte · Dernière scène à jouer</p>
                  <p className="italic text-slate-200">« Vous avez retrouvé la vérité sur Émile, découvert ce qui a réveillé la lettre et suivi la piste du coffret. Mais vous aviez oublié notre plus petite exploratrice… Enola ! Le Trésor de la Chouquette peut revenir parmi nous ! »</p>
                  <p className="text-slate-400">Charlotte sort le coffret préparé hors écran : le téléphone ne peut pas le retrouver physiquement.</p>
                </div>
                <div className="bg-slate-900 border border-emerald-800/40 p-4 rounded-xl space-y-2 text-xs">
                  <p className="text-emerald-300 font-bold">📋 Les quatre réponses du tribunal</p>
                  {VOTE_QUESTIONS.map(q => <p key={q.key} className="text-slate-200"><strong>{q.title}</strong> <span className="text-emerald-300">{voteLabel(q,FINAL_VERDICT[q.key])}</span></p>)}
                </div>
                <button onClick={()=>setActiveTab('dossier')} className="w-full rounded-lg border border-purple-700 bg-slate-800 py-3 text-xs font-semibold text-purple-100">Fermer · Retour aux preuves</button>
                <p className="text-center text-[11px] text-slate-400">Tu peux rouvrir cette scène depuis l’onglet Révélation.</p>
              </section>
            )}

            {/* ONGLET 6 : PANNEAU MJ */}
            {activeTab === 'mj' && currentUser.isMJ && (
              <div className="space-y-3 animate-fade-in">
                <h2 className="font-cinzel font-bold text-rose-400 text-sm">Panneau Charlotte (MJ)</h2>
                <p className="text-xs text-slate-400">{sharedMode ? 'Commandes protégées par ton compte Google. Les preuves et votes sont synchronisés.' : 'Mode secours : le tableau reflète ce téléphone uniquement. Reçois les codes des joueurs dans « Écran commun ».'}</p>
                <div className="rounded-lg border border-amber-800/40 bg-slate-900 p-3 text-xs space-y-2">
                  <p className="font-bold text-amber-300">🎬 Conduite de la soirée</p>
                  <p>1. Lire l’introduction dans <strong>Histoire</strong> ; 2. laisser les cinq enquêteurs résoudre les épreuves ; 3. réunir leurs preuves et leurs témoignages ; 4. faire remplir les quatre réponses du <strong>Tribunal</strong> ; 5. révéler les trois actes et sortir le coffret.</p>
                  <button className="bg-slate-800 p-2 rounded-lg w-full text-amber-200" onClick={()=>setActiveTab('histoire')}>Relire le discours d’ouverture</button>
                </div>
                {sharedMode && <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                  <p className="font-bold text-amber-400">Participants connectés à la salle</p>
                  {Object.keys(PLAYERS).map(id=><p key={id} className="flex justify-between"><span>{PLAYERS[id].avatar} {PLAYERS[id].name}</span><span>{roomPlayers[id]?'Profil réservé':'En attente'}</span></p>)}
                  <p className="font-bold text-amber-400 pt-2">Votes enregistrés : {Object.keys(remoteVotes || {}).length} / 5</p>
                  {Object.entries(remoteVotes || {}).map(([id,v])=>(
                    <div key={id} className="bg-slate-950 border border-slate-700 rounded-lg p-2 space-y-1">
                      <p className="font-bold text-amber-200">{PLAYERS[id]?.name || id}</p>
                      {v.historique !== undefined ? VOTE_QUESTIONS.map(q=><p key={q.key}>{q.title} <strong>{voteLabel(q,v[q.key])}</strong></p>) : <p className="text-amber-200">Bulletin de l’ancienne version : {v.coupable} · {v.motif} (nouvelle manche conseillée)</p>}
                    </div>
                  ))}
                </div>}
                <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                  <button onClick={() => setIsTimerActive(!isTimerActive)} className="w-full bg-slate-800 text-amber-400 py-2 rounded font-semibold">
                    {isTimerActive ? '⏸ Pause Chrono' : '▶ Lancer Chrono'}
                  </button>
                  <button onClick={() => sharedMode ? window.RoubatvotFirebase.hostFlag(roomSession.code,'hintAll',!remoteProgress?.hintAll).catch(e=>setFirebaseError(e.message)) : setMjForceHints(!mjForceHints)} className="w-full bg-amber-900/60 text-amber-200 py-2 rounded font-semibold">
                    {(sharedMode ? remoteProgress?.hintAll : mjForceHints) ? 'Verrouiller Indices' : '💡 Forcer Indices pour Tous'}
                  </button>
                  <div className="rounded-lg border border-purple-800/70 bg-purple-950/25 p-3 space-y-2">
                    <p className="font-semibold text-purple-200">🎭 Révélation finale sur tous les téléphones</p>
                    <p className="text-[11px] text-slate-300">À lancer de préférence après les cinq énigmes et les cinq votes. L'écran final s'ouvre automatiquement chez les joueurs, et reste consultable ensuite.</p>
                    {sharedMode && <p className="text-[11px] text-slate-400">Énigmes : {solvedLevels.length}/5 · Votes : {Object.keys(remoteVotes || {}).length}/5</p>}
                    <button onClick={() => {
                      if (!margueriteUnlocked && sharedMode && (solvedLevels.length < 5 || Object.keys(remoteVotes || {}).length < 5)) {
                        if (!confirm('Toutes les énigmes ou tous les votes ne sont pas terminés. Déclencher quand même la révélation finale ?')) return;
                      }
                      setMargueriteUnlocked(!margueriteUnlocked);
                    }} className="w-full bg-rose-900/70 text-rose-100 py-3 rounded-lg font-bold">
                      {margueriteUnlocked ? 'Masquer la révélation pour tous' : '🎬 Déclencher la révélation finale'}
                    </button>
                  </div>
                  <div className="pt-2 border-t border-slate-800 font-bold text-slate-300">{sharedMode ? 'Déblocage forcé pour tous :' : 'Déblocage forcé (sur cet appareil) :'}</div>
                  {PUZZLES.map(p => (
                    <div key={p.id} className="flex justify-between items-center bg-slate-950 p-2 rounded">
                      <span>Épreuve {p.id}</span>
                      <button disabled={solvedLevels.includes(p.id)} onClick={()=>handleMJUnlock(p.id)} className="bg-amber-500 disabled:bg-slate-800 text-slate-950 text-[10px] px-2 py-1 rounded font-bold">
                        {solvedLevels.includes(p.id) ? 'Validé' : 'Forcer'}
                      </button>
                    </div>
                  ))}
                  <button className="w-full bg-rose-950 border border-rose-700 text-rose-200 rounded py-2" onClick={()=>{
                    if(confirm(sharedMode ? 'Réinitialiser la partie POUR TOUS les joueurs ? Cette action efface les votes et les preuves partagés.' : 'Réinitialiser le jeu sur CE téléphone ? Cette action efface aussi les votes et preuves locaux.')) {
                      if (sharedMode) {window.RoubatvotFirebase.resetRoom(roomSession.code).catch(e=>setFirebaseError(e.message));} else setGame({...defaultProgress, votes: {...defaultProgress.votes}, puzzleStarts:{}, hintsAsked:{}});
                      setPuzzleInput(''); setRelayInput(''); setRelayMessage(''); setMjForceHints(false); setPuzzleError('');
                    }
                  }}>↺ {sharedMode ? 'Réinitialiser la salle entière' : 'Réinitialiser sur cet appareil'}</button>
                </div>
              </div>
            )}
          </>
        )}

      </main>

      <footer className="bg-slate-950 border-t border-slate-900 p-2 text-center text-[10px] text-slate-500">
        La Malédiction des Roubatvot &copy; 2026 - Ingré · {sharedMode ? "synchronisation Firebase" : "mode local avec codes-relais"}
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
