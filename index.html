async function syncNote(who){
 if(!session||!notesReady||!dirty.has(who)||noteInFlight.has(who))return;

 const payload={status:n.status,text:String(n.text||'').slice(0,600)};

 try{
  await set(path(writingSession.code,`notebooks/${writingSession.role}/${who}`),{...payload,updatedAt:serverTimestamp()});

  if(session!==writingSession)return;
  if(JSON.stringify(notes[who])===serialized)dirty.delete(who);else queueNote(who);

 }catch(e){if(session===writingSession){noteStatus='Connexion indisponible : copie locale conservée';cacheNotes();updateNoteUI()}return}

}

 const wasHost=session.role==='charlotte';
 session=null;room=null;lastAnswerStep=null;selectedAnswer=-1;
 notes={};dirty=new Set();notesReady=false;noteStatus='Connexion au carnet…';
 tab='enquete';error='';chosenSuspect='';voteArgument='';
 localStorage.removeItem(sessionKey);
 // Ne supprime ni la salle ni les carnets enregistrés dans Firebase.
 history.replaceState(null,'',location.pathname+(wasHost?'?mj=1':''));
 if(renderNow)render();
}
async function createRoom(){if(!me||me.isAnonymous||!me.emailVerified)throw Error('Connecte ton compte Google MJ.');const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let j=0;j<5;j++){const nums=crypto.getRandomValues(new Uint8Array(8));const code=[...nums].map(i=>chars[i%chars.length]).join('');try{await set(path(code),{edition:'4.5',hostUid:me.uid,createdAt:serverTimestamp(),players:{charlotte:{uid:me.uid}},progress:{step:0}});if(session)leaveRoom(false);await openRoom(code,'charlotte');return}catch(e){if(e.code!=='PERMISSION_DENIED')throw e;throw e}}}
async function openRoom(code,role){code=String(code).trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{8}$/.test(code))throw Error('Code de salle invalide (8 caractères).');const edition=await get(path(code,'edition'));if(edition.val()!=='4.5')throw Error('Cette salle appartient à une ancienne édition. Crée une nouvelle salle.');const host=(await get(path(code,'hostUid'))).val();if(role==='charlotte' && (host!==me.uid||me.isAnonymous))throw Error('Seule Charlotte peut reprendre le poste MJ.');if(role!=='charlotte' && host===me.uid)throw Error('Ouvre le personnage dans un navigateur privé, sans la session Google MJ.');const old=await get(path(code,`players/${role}`));if(old.exists()&&old.child('uid').val()!==me.uid)throw Error('Ce rôle est déjà réservé par un autre téléphone.');if(!old.exists())await set(path(code,`players/${role}`),{uid:me.uid});session={code,role};localStorage.setItem(sessionKey,JSON.stringify(session));selectedAnswer=-1;tab='enquete';startListening()}
function startListening(){
 if(unsub)unsub();
 if(answerUnsub){answerUnsub();answerUnsub=null;}
 if(noteUnsub){noteUnsub();noteUnsub=null;}
 for(const t of noteTimers.values())clearTimeout(t);noteTimers.clear();lastAnswerStep=null;
 const subs=[];room={players:{},progress:{step:0},answers:{},votes:{}};
 subs.push(onValue(path(session.code,'players'),s=>{room.players=s.val()||{};render()},e=>{error=e.message;render()}));
 subs.push(onValue(path(session.code,'progress'),s=>{const previous=Number(room.progress?.step||0);room.progress=s.val()||{};const current=Number(room.progress?.step||0);if((current===15||current===16)&&(current!==previous||current===16))tab='enquete';listenCurrentAnswer();render()},e=>{error=e.message;render()}));
 if(session.role==='charlotte')subs.push(onValue(path(session.code,'votes'),s=>{room.votes=s.val()||{};render()},e=>{error=e.message;render()}));
 else subs.push(onValue(path(session.code,'votes/'+session.role),s=>{room.votes={[session.role]:s.val()};render()},e=>{error=e.message;render()}));
 listenNotebook();
 subs.push(onValue(ref(db,'.info/serverTimeOffset'),s=>{serverOffset=Number(s.val())||0}));
 if(autoTimer)clearInterval(autoTimer);
 autoTimer=setInterval(()=>{updateCountdowns();void tryAutoProgress()},4000);
 unsub=()=>{subs.forEach(fn=>fn());if(answerUnsub)answerUnsub();if(noteUnsub)noteUnsub();if(autoTimer){clearInterval(autoTimer);autoTimer=null;}for(const t of noteTimers.values())clearTimeout(t);noteTimers.clear()};
 render();
}

// Progression totalement autonome : chaque appareil peut prendre le relais.
// Une transaction garantit qu'aucune confrontation n'est sautée, même si six téléphones tentent ensemble.
async function tryAutoProgress(){
 if(!session||!room||autoBusy||!me)return;
 const step=ctx().phase;
 if(step>=16||serverNow()-autoLastAttempt<4500)return;
 if(step<15){
  const q=Q[step];
  if(![q.asker,q.target].includes(session.role))return;
  const a=room.answers?.[q.id];
  if(!a||!Number.isFinite(a.submittedAt)||serverNow()<a.submittedAt+DISCUSSION_MS)return;
 } else if(session.role!=='charlotte'){
  // Chaque joueur connaît son vote ; le dernier vote envoyé déclenche également une tentative.
  if(!room.votes?.[session.role])return;
 }
 autoBusy=true;autoLastAttempt=serverNow();
 try{
  await runTransaction(path(session.code,'progress/step'),current=>current===step?step+1:undefined,{applyLocally:false});
 }catch(e){/* Tous les votes ne sont pas encore présents, ou une autre transaction a avancé. Réessai discret. */}
 finally{autoBusy=false}
}

async function submitAnswer(qIndex,answer){const q=Q[qIndex];if(!Number.isInteger(answer)||answer<0||answer>2)throw Error("Choisis une réponse.");if(session.role!==q.target||ctx().phase!==qIndex)throw Error('Ce n’est pas ton tour de répondre.');if(!ctx().members[q.asker])throw Error('Attends que l’enquêteur rejoigne la salle.');await set(path(session.code,`answers/${q.id}`),{value:answer,by:me.uid,submittedAt:serverTimestamp()});selectedAnswer=-1}
async function vote(){if(!investigators.includes(session.role)||ctx().phase!==15)throw Error('Vote indisponible.');if(![...Object.keys(P),'indetermine'].includes(chosenSuspect))throw Error('Choisis un suspect.');await set(path(session.code,`votes/${session.role}`),{suspect:chosenSuspect,argument:voteArgument.trim(),by:me.uid,submittedAt:serverTimestamp()});
 // La confirmation finale est vérifiée par les règles Firebase, sans intervention de Charlotte.
 void tryAutoProgress();render()}
function updateCountdowns(){
 for(const el of root.querySelectorAll('[data-autocount]')){
  const start=Number(el.dataset.autocount||0),left=Math.ceil((start+DISCUSSION_MS-serverNow())/1000);
  el.textContent=left>0?`🎤 Encore ${left} s pour échanger et noter vos hypothèses ; la suite est automatique.`:'⌛ La prochaine question se prépare automatiquement…';
 }
}
function showStatus(){if(!session){stat.innerHTML='';return;}const c=ctx();stat.innerHTML=`<div class="card flex between"><div><strong>🟢 Salle ${h(session.code)}</strong><br><span class="muted small">${Object.keys(c.members).length}/6 profils · ${c.phase<15?'Manche '+(Math.floor(c.phase/5)+1)+'/3':c.phase===15?'Verdict':'Révélation'}</span></div><button class="btn secondary" data-action="copy">Copier le lien</button></div>`}
function loginUI(){const mj=new URLSearchParams(location.search).get('mj')==='1';return `<div class="card"><h2>Entrer dans l’enquête</h2>${mj?`<p>Accès réservé à Charlotte.</p>${me&&!me.isAnonymous?'<p class="ok">Compte Google MJ connecté.</p>':'<button class="btn" data-action="google">Se connecter avec Google</button>'}${me&&!me.isAnonymous?`<button class="btn secondary" data-action="create">Créer une salle</button>`:''}`:`<label>Code de salle<input id="code" maxlength="8" value="${h(joinCode)}" placeholder="ABCDEFGH"></label><label>Mon personnage<select id="player">${investigators.map(p=>`<option value="${p}" ${selectedPlayer===p?'selected':''}>${P[p]}</option>`).join('')}</select></label><button class="btn" data-action="join">Rejoindre la salle</button><p class="small muted">Chaque joueur utilise son propre navigateur / téléphone, sans le compte Google MJ.</p><button class="btn secondary" data-action="host">Je suis Charlotte (MJ)</button>`}</div>`}
function menu(){return `<div class="tabs">${[['enquete','🎭 Mon tour'],['carnet','📋 Mon Cluedo'],['mj','👑 Mon dossier']].filter(([k])=>k!=='mj'||session.role==='charlotte').map(([k,label])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${label}</button>`).join('')}</div><details class="card small"><summary>Paramètres de la salle</summary><button class="btn secondary" data-action="leave">Quitter cette salle</button></details>`}
function interrogation(){
 const c=ctx(),step=c.phase;
 if(step>=16)return `<div class="card"><h2>🎁 Le Trésor de la Chouquette</h2><p>Enola a innocemment déplacé le coffret près des doudous pour jouer. Les petits secrets de la famille ne prouvaient pas un vol.</p><p><strong>Charlotte peut autoriser une seule recherche du Trésor près des jouets.</strong></p><h3>Les verdicts</h3>${session.role==='charlotte'?investigators.map(p=>`<p>${P[p]} : ${h(P[c.votes[p]?.suspect]||'Indéterminé')} — ${h(c.votes[p]?.argument||'')}</p>`).join(''):`<p>Charlotte lit les verdicts à voix haute. Ton choix : ${h(P[c.votes[session.role]?.suspect]||'Indéterminé')}.</p>`}</div>`;
 if(step===15){
  const mine=c.votes[session.role];
  return `<div class="card"><div class="round">VERDICT FINAL</div><h2>Qui a déplacé le Trésor ?</h2><p>Base ton avis sur ce que tu as entendu.</p>${session.role==='charlotte'?'<p>Les verdicts restent confidentiels jusqu’à leur clôture automatique. Aucun bouton de révélation à déclencher.</p>':mine?'<div class="ok">Verdict enregistré. Il est privé jusqu’à la révélation.</div>':`<label>Mon suspect<select id="suspect"><option value="">Choisir…</option>${Object.keys(P).map(p=>`<option value="${p}" ${chosenSuspect===p?'selected':''}>${P[p]}</option>`).join('')}<option value="indetermine">Je ne sais pas</option></select></label><label>Ma raison (facultatif)<textarea id="voteReason" maxlength="220" placeholder="J’ai remarqué que…">${h(voteArgument)}</textarea></label><button class="btn" data-action="vote">Déposer mon verdict</button>`}</div>`;
 }
 const q=Q[step],answer=c.answers[q.id];
 const asker=session.role===q.asker,target=session.role===q.target,host=session.role==='charlotte';
 if(!asker&&!target)return `<div class="card"><div class="round">MANCHE ${q.round}/3 · Tour ${q.id}/15</div><h2>👂 Écoute et enquête</h2><p>La question et la réponse se donnent <strong>uniquement à voix haute</strong>. Rien à lire sur ton écran pendant cet interrogatoire.</p><p>Note tes soupçons, tes doutes et les contradictions que tu entends.</p><p class="muted small">${Object.keys(c.members).length<6?"Les autres personnages peuvent rejoindre la salle pendant le test.":"La progression est automatique."}</p><button class="btn secondary" data-tab="carnet">Ouvrir mon carnet Cluedo</button></div>`;
 let html=`<div class="card"><div class="round">MANCHE ${q.round}/3 · Tour ${q.id}/15</div><h2>${asker?'🎤 À toi de poser la question':target?'🎭 À toi de répondre':'👑 Charlotte — interrogation'}</h2><p>${P[q.asker]} interroge ${P[q.target]}</p><p class="quote">« ${h(q.question)} »</p>`;
 if(asker&&!target)html+='<p>Lis cette question à voix haute. Écoute la réponse sans la chercher sur ton écran.</p>'; 
 if(target&&!answer&&!c.members[q.asker])html+=`<p class="muted">En attente de ${P[q.asker]} pour poser la question à voix haute.</p>`;
 if(target&&!answer&&c.members[q.asker])html+=`<h3>Choisis ta réponse</h3><p><strong>Lis le texte sélectionné à voix haute.</strong> Les autres téléphones ne le montrent pas. Une minute de discussion suivra automatiquement.</p><div class="options">${q.answers.map((text,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${selectedAnswer===i?'checked':''}>${h(text)}</label>`).join('')}</div><button class="btn" data-action="answer" ${selectedAnswer<0?'disabled':''}>Enregistrer ma réponse</button>`;
 if(target&&answer)html+=`<div class="private"><strong>Ta réponse :</strong><p>« ${h(q.answers[answer.value])} »</p><p>Dis-la à voix haute si tu ne l’as pas encore fait.</p><p class="muted small" data-autocount="${answer.submittedAt||0}">La prochaine question arrivera automatiquement.</p></div>`;
 if(asker&&!target&&!answer)html+=`<p class="muted">⏳ Après la réponse orale, tu recevras une relance adaptée au choix du suspect.</p>`;
 if(asker&&!target&&answer)html+=`<div class="private"><strong>🎯 Ta question de relance :</strong><p class="quote">« ${h(q.relances[answer.value])} »</p><p>Pose-la à voix haute, puis laisse les autres réagir. Aucun texte de réponse ne s'affiche ici.</p><p class="muted small" data-autocount="${answer.submittedAt||0}">La suite arrivera automatiquement après la discussion.</p></div>`;
 
 html+='</div>';
 if(target)html+=`<div class="card private"><h3>🔒 Secret du personnage</h3><p>${h(q.truth)}</p><p class="small">Ne le dévoile que si la discussion établit ce fait.</p></div>`;
 return html;
}
function carnet(){
 const step=ctx().phase;
 const flashs=personalFlashs(step);
 const flashHtml=flashs.length?`<div class="card" style="border-color:#997e43"><h3>🕯️ Notes d’analyse automatiques</h3><p class="muted small">Des pistes personnelles adaptées à TES soupçons, pas un verdict ni des faits supplémentaires.</p>${flashs.map(f=>`<div class="analysis-flash"><strong>${h(f.tag)} · ${P[f.id]}</strong><p>${h(f.text)}</p></div>`).join('')}</div>`:'';
 return flashHtml+`<div class="card"><h2>📋 Mon carnet Cluedo</h2><p class="muted">Notes privées par joueur, enregistrées dans Firebase. Une copie locale protège les saisies en cas de coupure.</p><p class="small ok" data-note-sync>${h(noteStatus)}</p>${suspects.map(p=>{const x=notes[p]||{};return `<div class="note-row"><strong>${P[p]}</strong><label>Mon avis<select data-note="${p}" data-field="status">${[['inconnu','❔ Inconnu'],['suspect','🔴 Suspect'],['verifier','🟠 À vérifier'],['ecarte','🟢 Écarté']].map(([v,l])=>`<option value="${v}" ${(x.status||'inconnu')===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Mes observations<textarea data-note="${p}" data-field="text" maxlength="600" placeholder="Témoignage, alibi, contradiction…">${h(x.text||'')}</textarea></label></div>`}).join('')}<p class="small muted">Seul ce personnage peut lire et modifier son carnet. Les flashs ne sont pas partagés.</p></div>`;
}
function mjUI(){
 const c=ctx(),step=c.phase,connected=Object.keys(c.members).length;
 return `<div class="card"><h2>👑 Charlotte — Dossier confidentiel</h2>
 <p><strong>${step<15?'Manche '+(Math.floor(step/5)+1)+'/3 · Confrontation '+(step+1)+'/15':step===15?'Verdicts en cours':'Enquête terminée'}</strong></p>
 <p>Le jeu fait progresser seul les interrogatoires et les verdicts. Tu participes comme suspecte, sans piloter les questions.</p>
 <p>Participants : ${connected}/6. ${connected<6?'Attente des personnages manquants.':'Tous les personnages sont inscrits.'}</p>
 <p class="muted small">Chaque réponse ouvre une période de ${Math.round(DISCUSSION_MS/1000)} secondes pour la relance orale et les notes. Le prochain tour est déclenché automatiquement par les téléphones connectés.</p>
 <details><summary>📜 Vérité du scénario (confidentiel)</summary>
 <p><strong>20 h 25 :</strong> Nino prend une friandise. <strong>20 h 28 :</strong> Mathieu cache un sac de bonbons. <strong>20 h 29 :</strong> Charlotte déplace une décoration. <strong>Après 20 h 31 :</strong> James voit encore le coffret. <strong>20 h 33 :</strong> Matys et Nino sont à la cuisine ; Enola transporte le coffret vers les jouets ; Andreas entend un couvercle. <strong>20 h 35 :</strong> disparition constatée.</p>
 </details><details class="card"><summary>🧪 Nouvelle salle de test</summary><p class="muted small">L’ancienne salle et les carnets restent conservés.</p><button class="btn secondary" data-action="new-room">Créer une nouvelle salle</button></details></div>`;
}
function render(){showStatus();let html='';if(!session)html=loginUI();else html=menu()+(tab==='carnet'?carnet():tab==='mj'?mjUI():interrogation());if(error)html=`<div class="card error">⚠️ ${h(error)} <button class="btn secondary" data-action="dismiss">Fermer</button></div>`+html;root.innerHTML=html;updateCountdowns();}
root.addEventListener('change',e=>{
 if(e.target.name==='answer'){selectedAnswer=Number(e.target.value);render()}
 if(e.target.id==='player')selectedPlayer=e.target.value;
 if(e.target.id==='suspect')chosenSuspect=e.target.value;
 if(e.target.dataset.note){editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);if(e.target.dataset.field==='status')render();}
});
root.addEventListener('input',e=>{
 if(e.target.dataset.note)editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);
 if(e.target.id==='voteReason')voteArgument=e.target.value;
 if(e.target.id==='code')joinCode=e.target.value;
});

root.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}const action=el.dataset.action;if(pending)return;pending=true;error='';try{if(action==='dismiss'){}else if(action==='google')await hostLogin();else if(action==='host'){location.href=location.pathname+'?mj=1';return}else if(action==='create'||action==='new-room')await createRoom();else if(action==='leave')leaveRoom();else if(action==='join')await openRoom(joinCode,selectedPlayer);else if(action==='copy'){const url=location.origin+location.pathname+'?room='+session.code;await navigator.clipboard.writeText(url)}else if(action==='answer')await submitAnswer(ctx().phase,selectedAnswer);else if(action==='vote')await vote()}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async u=>{me=u;try{if(!u){await signInAnonymously(auth);return}const prior=JSON.parse(localStorage.getItem(sessionKey)||'null');if(prior&&!session){try{await openRoom(prior.code,prior.role)}catch(e){localStorage.removeItem(sessionKey);error='Ancienne session : '+e.message}}render()}catch(e){error=e.message;render()}});
</script></body></html>
