async function vote(final){const stage=nowStage();if(stage!==(final?STAGE.SECOND:STAGE.FIRST)||!investigators.includes(session.role))throw Error('Vote indisponible.');if(!suspects.includes(chosenSuspect)&&chosenSuspect!=='indetermine')throw Error('Choisis un suspect.');if(!Object.hasOwn(CONVICTIONS,chosenSource)||!voteArgument.trim())throw Error('Précise ta raison.');const payload={suspect:chosenSuspect,source:chosenSource,argument:voteArgument.trim(),by:me.uid,submittedAt:serverTimestamp()};if(final){payload.influencedBy=influencedBy;payload.influenceReason=influenceReason.trim()}await set(p(`${final?'votesFinal':'votesInitial'}/${session.role}`),payload);chosenSuspect='';chosenSource='';voteArgument='';influencedBy='aucune';influenceReason=''}
async function savePublicClaim(){if(!host()||nowStage()!==STAGE.DISCUSS)throw Error('La consignation collective n’est disponible que pendant la confrontation.');const text=claimText.trim();if(!text)throw Error('Inscris une déclaration réellement prononcée.');const node=push(p('claims'));await set(node,{author:claimAuthor,kind:claimKind,status:claimStatus,text,at:serverTimestamp()});claimText=''}
async function markAbsent(id,round){if(!host()||!investigators.includes(id)||!['initial','final'].includes(round))throw Error('Action interdite.');if(nowStage()!==(round==='initial'?18:20))throw Error('Cette étape est terminée.');await set(p(`absences/${round}/${id}`),true)}
async function startGame(){
 if(!host()||!member())throw Error('Le lancement est réservé au MJ.');
 if(nowStage()!==-1)throw Error('L’audience a déjà commencé.');
 await set(p('progress/step'),0);
}
async function advance(){if(!host())throw Error('Pilotage réservé à l’organisatrice.');const step=nowStage();if(step>=STAGE.ARCHIVE)throw Error('La soirée est terminée.');if(step<18&&(!room.currentAnswer||!latestTestimony(step+1)?.validated))throw Error('Enregistre et valide oralement le témoignage avant de poursuivre.');if(step===STAGE.FIRST&&!allFinished('initial'))throw Error('Attends les votes ou marque les absences dans le Pilotage.');if(step===STAGE.SECOND&&!allFinished('final'))throw Error('Attends les votes finaux ou marque les absences dans le Pilotage.');await set(p('progress/step'),step+1)}
async function nextInfluence(){if(!host()||nowStage()!==STAGE.INFLUENCES)throw Error('Action réservée au second tableau.');const count=investigators.filter(id=>{const b=room.votesFinal?.[id];return b&&investigators.includes(b.influencedBy)&&b.influencedBy!==id}).length;if((room.progress?.influenceIndex||0)>=count)return;await set(p('progress/influenceIndex'),(room.progress?.influenceIndex||0)+1)}
async function deleteSession(){if(!host()||nowStage()!==STAGE.ARCHIVE)throw Error('Suppression indisponible.');const expected=`SUPPRIMER ${session.code}`;const typed=prompt(`La session et ses données seront effacées définitivement. Les PDF déjà téléchargés resteront sur les appareils.\n\nSaisis exactement : ${expected}`);if(typed!==expected)return;const old=session;await remove(p());const proof=await get(at(old.code,'edition'));if(proof.exists())throw Error('Suppression non confirmée : ne considère pas la session comme effacée.');clearSession()}
function latestVotes(){return investigators.map(id=>({id,initial:room.votesInitial?.[id]||null,final:room.votesFinal?.[id]||null,absentInitial:room.absences?.initial?.[id],absentFinal:room.absences?.final?.[id]}))}
function formatVote(b){return b?(b.suspect==='indetermine'?'Preuves insuffisantes':fullName(b.suspect))+(b.argument?` — « ${b.argument} »`:''):'Abstention / vote absent'}
function countFinal(){const counts={};for(const id of investigators){const who=room.votesFinal?.[id]?.suspect;if(who&&who!=='indetermine')counts[who]=(counts[who]||0)+1}const max=Math.max(0,...Object.values(counts));return Object.entries(counts).filter(([,v])=>v===max).map(([id])=>id)}
function influenceEdges(){return investigators.flatMap(id=>{const b=room.votesFinal?.[id];return b&&investigators.includes(b.influencedBy)&&id!==b.influencedBy?[{from:b.influencedBy,to:id,reason:b.influenceReason||'Argument non détaillé'}]:[]})}
function classificationFacts(){const items=[];const changed=latestVotes().filter(x=>x.initial?.suspect&&x.final?.suspect&&x.initial.suspect!==x.final.suspect);if(changed.length)items.push(`${changed.length} joueur${changed.length>1?'s ont':' a'} changé de suspect entre les deux votes.`);const edges=influenceEdges();if(edges.length)items.push(`${edges.length} influence${edges.length>1?'s ont':' a'} été explicitement déclarée${edges.length>1?'s':''}.`);const repeated=Object.values(room.votesFinal||{}).filter(x=>x.source==='collectif').length;if(repeated)items.push(`${repeated} personne${repeated>1?'s':''} ${repeated>1?'ont':'a'} déclaré s’appuyer surtout sur les soupçons du groupe.`);for(const c of Object.values(room.claims||{}).filter(c=>c.status==='validee'))items.push(`${fullName(c.author)} a déclaré : « ${c.text} » (${c.kind}).`);return items.slice(0,3)}
function tableVerdicts(){return `<div class="card reveal-stage"><div class="quiet">TABLEAU 1 · LES VERDICTS</div><h2>Vous n’avez pas tous raconté la même histoire.</h2>${latestVotes().map(x=>`<div class="conviction-voice"><strong>${h(fullName(x.id))}</strong><p><span class="muted">Premier vote :</span> ${h(formatVote(x.initial))}</p><p><span class="muted">Vote final :</span> ${h(formatVote(x.final))}</p></div>`).join('')}<p class="small muted">Ces choix sont les votes réellement enregistrés. Aucun changement d’avis n’est supposé.</p></div>`}
function tableInfluences(){const edges=influenceEdges(),visible=edges.slice(0,room.progress?.influenceIndex||0);return `<div class="card reveal-stage"><div class="quiet">TABLEAU 2 · LES INFLUENCES</div><h2>Qui a réellement influencé qui ?</h2>${visible.length?visible.map((e,i)=>`<div class="conviction-voice influence-edge" style="animation-delay:${i*120}ms"><strong>${h(fullName(e.from))} → ${h(fullName(e.to))}</strong><p>${h(e.reason)}</p></div>`).join(''):'<p>Aucune influence révélée pour le moment.</p>'}<p class="small muted">Seules les influences expressément déclarées sont affichées. Un vote identique ne prouve pas une influence.</p></div>`}
function tableCertainties(){const items=classificationFacts();return `<div class="card reveal-stage"><div class="quiet">TABLEAU 3 · LE PROCÈS DES CERTITUDES</div><h2>Qu'avez-vous réellement prouvé ?</h2>${items.length?items.map((v,i)=>`<div class="conviction-voice"><strong>Constat ${i+1}</strong><p>${h(v)}</p></div>`).join(''):'<p>Les données enregistrées ne suffisent pas à démontrer une influence ou un changement d’avis collectif.</p>'}<p>Avoir une conviction ne constitue pas une preuve. Le Tribunal n’attribue aucune intention aux joueurs.</p></div>`}
function fakeVerdict(){const leaders=countFinal();const title=leaders.length===1?`Le Tribunal s'apprête à désigner ${fullName(leaders[0])}…`:leaders.length>1?`Les accusations se partagent entre ${leaders.map(fullName).join(' et ')}…`:'Aucune accusation ne permet de désigner un seul suspect…';return `<div class="card reveal-stage"><div class="quiet">LE FAUX VERDICT</div><h2>${h(title)}</h2><p class="dramatic">Le marteau va tomber. Quelqu’un souhaite-t-il contester ce verdict ?</p><p>Silence. Le Tribunal interrompt son jugement.</p><h2>VERDICT SUSPENDU</h2><p class="dramatic">Mais avez-vous seulement prouvé qu’un vol avait eu lieu ?</p></div>`}
function enigmaClock(){return `<div class="card reveal-stage"><div class="quiet">ÉNIGME COLLECTIVE · PREMIÈRE ÉTAPE</div><h2>Quand le coffret a-t-il disparu ?</h2><div class="clockline"><strong>Avant 20 h 28</strong> — James a vu le coffret.</div><div class="clockline"><strong>Vers 20 h 30</strong> — Charlotte remarque son absence.</div><div class="clockline"><strong>20 h 31</strong> — Les lumières s'éteignent.</div><p>Reconstituez oralement l'intervalle. L'organisatrice valide la réponse avant de poursuivre.</p></div>`}
function enigmaZone(){return `<div class="card reveal-stage"><div class="quiet">ÉNIGME COLLECTIVE · DEUXIÈME ÉTAPE</div><h2>Où chercher ?</h2><div class="plan"><div>🍽️ Table</div><div>🍳 Cuisine</div><div>🚪 Passage</div><div>🧸 Coin des jouets</div></div><p><strong>Témoignage :</strong> Nino a aperçu une petite silhouette non identifiée se dirigeant vers les jouets.</p><p><strong>Indice numérique :</strong> un emballage de bonbon a été remarqué près des jouets ; sa provenance reste inconnue.</p><p>Sur cette représentation simplifiée, quelle zone faut-il vérifier ? Répondez oralement.</p></div>`}
function stagesHTML(){const step=nowStage();if(step===STAGE.VERDICTS)return tableVerdicts();if(step===STAGE.INFLUENCES)return tableInfluences();if(step===STAGE.CERTAINTIES)return tableCertainties();if(step===STAGE.FAKE)return fakeVerdict();if(step===STAGE.CLOCK)return enigmaClock();if(step===STAGE.ZONE)return enigmaZone();if(step===STAGE.SEARCH)return `<div class="card reveal-stage"><h2>🔍 À vous de chercher !</h2><p>Le Tribunal vous autorise maintenant à chercher <strong>tous ensemble dans le coin des jouets</strong>. Retrouvez le coffret sans l’ouvrir.</p></div>`;if(step===STAGE.FOUND)return `<div class="card reveal-stage"><h2>Le coffret est retrouvé.</h2><p>Laissez-le fermé. La question n’est plus seulement : « Qui l’a pris ? »</p></div>`;if(step===STAGE.NOVOL)return `<div class="card reveal-stage"><h2>Il n’y a pas eu de vol.</h2><p>Le coffret a été déplacé avant l’extinction des lumières, sans intention de voler.</p></div>`;if(step===STAGE.ENOLA)return `<div class="card reveal-stage"><h2>🧸 Enola</h2><p class="dramatic">Enola a déplacé innocemment le coffret pour jouer, entre 20 h 28 et 20 h 30. Personne n’avait besoin de l’accuser ou de l’interroger.</p></div>`;if(step===STAGE.JUDGMENT)return `<div class="card reveal-stage"><h2>LE TRIBUNAL DÉCLARE COUPABLES… LES CERTITUDES.</h2><p>Les suspects sont tous acquittés. Le Tribunal condamne symboliquement les certitudes collectives, jamais les personnes.</p><p class="dramatic">Le plus grand trésor n’était pas celui qui avait disparu. C’était celui qui nous réunissait tous autour de cette table.</p></div>`;if(step===STAGE.PARTY)return `<div class="card reveal-stage celebration"><h2>🎃 HALLOWEEN SAUVÉ !</h2><p class="dramatic">Affaire classée. Le Trésor de la Chouquette peut être ouvert et partagé librement !</p><p>Halloween 2026 · Ingré</p></div>`;if(step===STAGE.ARCHIVE)return `<div class="card reveal-stage"><h2>🎃 HALLOWEEN SAUVÉ ! — Affaire classée</h2><p>Ton enquête reste consultable jusqu’à la suppression volontaire de la session. Tu peux enregistrer ton dossier PDF souvenir personnel.</p><div class="final-steps">${["🗳️ Les verdicts","🕰️ Les faits","🧸 La vérité"].map((name,i)=>`<button class="final-step" data-final-view="${i}" aria-current="${finalView===i?"step":"false"}">${name}</button>`).join("")}</div>${finalView===0?tableVerdicts():finalView===1?`<div class="card"><h3>Les faits</h3>${FACTS.map(([t,x])=>`<p><strong>${h(t)}</strong> — ${h(x)}</p>`).join("")}</div>`:`<div class="card"><h3>Le Trésor retrouvé</h3><p>Enola l’a déplacé innocemment pour jouer. Aucun vol, aucun coupable.</p></div>`}<button class="btn" data-action="pdf">Télécharger mon dossier PDF</button></div>`;return ''}
function interrogation(){const step=nowStage();if(step>=18)return stageContent();const q=Q[step],ans=room.currentAnswer,asking=q.asker===session.role,target=q.target===session.role;const previous=revisions(q.id),last=latestTestimony(q.id);let html=`<div class="card"><div class="round">MANCHE ${q.round}/3 · INTERROGATION ${q.id}/18</div><div class="versus"><strong>${h(fullName(q.asker))}</strong><span>interroge →</span><strong>${h(fullName(q.target))}</strong></div><div class="big-question">« ${h(q.question)} »</div>`;
 if(asking)html+='<p class="role-instruction">Lis la question principale à voix haute. Au maximum deux questions complémentaires peuvent être posées oralement.</p>';
 if(target&&!ans)html+=`<p>Choisis une formulation fidèle à ton personnage et prononce-la à voix haute.</p><div class="response-grid">${q.answers.map((a,i)=>`<label class="response-card ${selectedAnswer===i?'selected':''}"><input name="answer" type="radio" value="${i}" ${selectedAnswer===i?'checked':''}><span class="response-letter">${'ABC'[i]}</span><span>${h(a)}</span></label>`).join('')}</div><button class="btn w100" data-action="answer" ${selectedAnswer<0?'disabled':''}>Enregistrer ma réponse</button>`;
 if(target&&ans)html+=`<div class="private">Ta réponse enregistrée : « ${h(q.answers[ans.value])} »</div>`;
 if(asking&&ans)html+=`<div class="private"><strong>Relances facultatives (maximum deux)</strong>${q.relances.map(a=>`<p>« ${h(a)} »</p>`).join('')}</div>`;
 if(!asking&&!target)html+='<p>Écoute les questions et les réponses orales, puis complète ton carnet Cluedo.</p>';
 if(last)html+=`<div class="clue-line"><strong>Procès-verbal validé</strong><p>${h(last.statement)}</p>${last.followup1?`<p>Relance 1 : ${h(last.followup1)}</p>`:''}${last.followup2?`<p>Relance 2 : ${h(last.followup2)}</p>`:''}${previous.length>1?`<p class="small">${previous.length-1} correction(s) conservée(s) dans l’historique.</p>`:''}</div>`;
 html+='</div>';return html}
function stageContent(){const s=nowStage();if(s===STAGE.FIRST||s===STAGE.SECOND)return investigators.includes(session.role)?voteForm(s===STAGE.SECOND):`<div class="card"><h2>${h(stageName(s))}</h2><p>Les six enquêteurs votent individuellement. Charlotte ne vote pas : elle pilote la séance.</p></div>`;if(s===STAGE.DISCUSS)return `<div class="card"><h2>🎤 Confrontation collective</h2><p>Les premiers votes sont enregistrés, mais encore secrets. Échangez oralement vos théories et vos preuves, puis chacun déposera son vote final.</p><p>Les notes privées restent privées.</p></div>`;return stagesHTML()}
function affaire(){const step=nowStage(),pieces=[{at:0,title:'Disparition constatée',text:'Vers 20 h 30, Charlotte remarque la table vide. Un déplacement ne prouve pas un vol.'},{at:3,title:'Friandise de Nino',text:'Nino reconnaît avoir pris un bonbon en cachette, sans lien démontré avec le coffret.'},{at:4,title:'Dernière observation du coffret',text:'James l’a vu sur la table avant 20 h 28. Il n’atteste rien après.'},{at:6,title:'Sac de Mathieu',text:'Mathieu avait caché un sac de friandises, non le coffret.'},{at:12,title:'Blackout',text:'Charlotte avait programmé l’extinction à 20 h 31, indépendamment de la disparition.'},{at:16,title:'Message de Norah et Matys',text:'Le message concernait une plaisanterie indépendante du Trésor.'},{at:17,title:'Petite silhouette',text:'Nino a aperçu une silhouette non identifiée allant vers les jouets avant le noir.'},{at:18,title:'Emballage près des jouets',text:'Indice numérique : un emballage a été remarqué près des jouets ; son origine est inconnue.'}];return `<div class="card"><h2>🕰️ L’affaire</h2><p>Faits et témoignages accessibles au fur et à mesure, sans révéler le dénouement.</p>${pieces.filter(p=>step>=p.at).map(p=>`<div class="clue-line"><strong>${h(p.title)}</strong><p>${h(p.text)}</p></div>`).join('')}${step>=STAGE.ENOLA?`<h3>Chronologie établie après la révélation</h3>${FACTS.map(([t,x])=>`<div class="clockline"><strong>${h(t)}</strong><p>${h(x)}</p></div>`).join('')}`:''}${step===STAGE.ARCHIVE?`<div class="card"><h3>Rejouer la chronologie</h3><p class="small">Lecture privée sans modifier l’enquête.</p><div class="clockline"><strong>${h(FACTS[replayIndex][0])}</strong><p>${h(FACTS[replayIndex][1])}</p></div><p><strong>Mes convictions réellement enregistrées :</strong></p><p>Premier vote : ${h(formatVote(room.votesInitial?.[session.role]))}</p><p>Vote final : ${h(formatVote(room.votesFinal?.[session.role]))}</p><div class="flex"><button class="btn secondary" data-replay="prev" ${replayIndex===0?'disabled':''}>← Précédent</button><span>${replayIndex+1}/${FACTS.length}</span><button class="btn secondary" data-replay="next" ${replayIndex===FACTS.length-1?'disabled':''}>Suivant →</button></div></div>`:''}</div>`}
function personalMirror(){if(nowStage()<STAGE.VERDICTS)return '';const first=room.votesInitial?.[session.role],last=room.votesFinal?.[session.role];if(!first&&!last)return '';return `<div class="mirror-panel"><h3>🪞 Le miroir de tes certitudes</h3><p><strong>Premier vote :</strong> ${h(formatVote(first))}</p><p><strong>Vote final :</strong> ${h(formatVote(last))}</p>${last?`<p><strong>Influence déclarée :</strong> ${h(last.influencedBy==='aucune'?'Aucune':last.influencedBy==='inconnue'?'Je ne sais pas':fullName(last.influencedBy))}</p>`:''}<p class="small">Il s’agit de tes propres déclarations, sans interprétation automatique.</p></div>`}
function carnet(){const n=normalizedNote(notes[selectedPerson]),statusNames={inconnu:'❔ Inconnu',suspect:'🔴 Suspect',verifier:'🟠 À vérifier',ecarte:'🟢 Écarté'};const readonly=nowStage()>=STAGE.ARCHIVE;let header=`<div class="card"><div class="round">CARNET CONFIDENTIEL</div><h2>📋 Mon Cluedo</h2><p class="small" data-note-sync>${h(noteStatus)}</p><div class="cluedo-switch"><button class="cluedo-switch-btn ${notebookView==='dossiers'?'active':''}" data-cluedo-view="dossiers">🔎 Dossiers suspects</button><button class="cluedo-switch-btn ${notebookView==='souvenirs'?'active':''}" data-cluedo-view="souvenirs">🧩 Mes souvenirs</button></div></div>`;
 if(notebookView==='souvenirs')return header+personalMirror()+`<div class="card"><h3>Ce dont ton personnage se souvient</h3>${(MEMORIES[session.role]||[]).map((t,i)=>`<div class="memory-entry"><strong>${i+1}.</strong><p>${h(t)}</p></div>`).join('')}</div>`;
 return header+personalMirror()+`<div class="card"><div class="person-grid">${suspects.map(id=>`<button type="button" class="person-tile ${selectedPerson===id?'selected':''}" data-person-note="${id}"><span class="emoji">${h(fullName(id).split(' ')[0])}</span><span class="name">${h(fullName(id).split(' ').slice(1).join(' '))}</span><span class="tiny">${h(statusNames[normalizedNote(notes[id]).status])}</span></button>`).join('')}</div><h3>${h(fullName(selectedPerson))}</h3><div class="status-picker">${noteStatuses.map(id=>`<button type="button" class="status-pill ${n.status===id?'active':''}" data-status="${id}" ${readonly?'disabled':''}>${h(statusNames[id])}</button>`).join('')}</div><div class="quick-tags">${NOTE_TAGS.map(([id,label])=>`<button type="button" class="quick-tag" data-tag="${id}" aria-pressed="${n.tags[id]}" ${readonly?'disabled':''}>${h(label)}</button>`).join('')}</div><label>Mes notes privées<textarea id="noteText" data-note="${selectedPerson}" maxlength="600" ${readonly?'readonly':''}>${h(n.text)}</textarea></label><p class="small muted">Sauvegarde automatique dans Firebase ; accessible seulement sur ton identité.</p><div class="analysis-flash"><strong>🕯️ Question pour ton enquête</strong><p>Qu’as-tu réellement vu ou entendu concernant ${h(fullName(selectedPerson))}, et qu’as-tu seulement déduit ?</p></div></div>`}
function pilotage(){if(!host())return '';const st=nowStage(),readiness=(round)=>`<div class="status-list">${investigators.map(id=>{const complete=room?.[round==='initial'?'votesInitial':'votesFinal']?.[id];const absent=room.absences?.[round]?.[id];return `<div class="status-line"><span>${h(fullName(id))}</span><span>${complete?'✓ Voté':absent?'– Abstention':`<button type="button" class="btn secondary btn-small" data-absent="${round}:${id}">Marquer absent</button>`}</span></div>`}).join('')}</div>`;
 let html=`<section class="card host-panel"><div class="round">MODE PILOTAGE · CONFIDENTIEL</div><h2>${h(stageName(st))}</h2><p class="small">Progression manuelle de la soirée ; aucune avance automatique.</p>`;
 if(st===-1){const registered=investigators.filter(id=>room?.players?.[id]?.uid).length;return `<section class="card host-panel host-ready"><div class="round">ESPACE MJ · CONFIDENTIEL</div><h2>Ouvrir l’audience</h2><p>Les participants sont accueillis dans la salle du Tribunal. Ils ne voient aucune interrogation avant ton lancement.</p><div class="people">${investigators.map(id=>`<div class="person-status ${room?.players?.[id]?.uid?'present':''}">${room?.players?.[id]?.uid?'✓':'◌'} ${h(fullName(id))}</div>`).join('')}</div><p><strong>${registered}/6 enquêteurs inscrits</strong> — Vérifie que chacun est prêt autour de la table.</p><button class="btn w100" data-action="start-game">⚖️ Ouvrir l’audience et lancer l’enquête</button><p class="small muted">Seul le MJ peut utiliser cette commande. Tous les téléphones passeront alors à l’interrogation 1.</p></section>`}
 if(st<18){const q=Q[st],ans=room.currentAnswer,previous=revisions(q.id);html+=`<p><strong>Interrogé :</strong> ${h(fullName(q.target))}</p><p><strong>Réponse enregistrée :</strong> ${ans?h(q.answers[ans.value]):'En attente du personnage'}</p><div class="host-form"><label>Réponse réellement prononcée<textarea id="spoken" maxlength="1000" placeholder="Recopie les paroles entendues (ou utilise la réponse enregistrée si elle a réellement été dite).">${h(transcriptDraft)}</textarea></label><button class="btn secondary" data-action="copy-answer" ${!ans?'disabled':''}>Reprendre la réponse enregistrée</button><label>1re question complémentaire et réponse (facultatif)<textarea id="followup1" maxlength="500">${h(followup1Draft)}</textarea></label><label>2e question complémentaire et réponse (facultatif)<textarea id="followup2" maxlength="500">${h(followup2Draft)}</textarea></label><button class="btn secondary" data-action="save-testimony" ${!ans?'disabled':''}>${previous.length?'Consigner une correction validée':'Valider le procès-verbal oral'}</button></div><p class="small">Le groupe valide oralement ce qui a été dit. Une correction crée un nouvel enregistrement ; les précédents restent disponibles.</p>${previous.length?`<details><summary>Historique (${previous.length})</summary>${previous.map((x,i)=>`<p>${i+1}. ${h(x.statement)}</p>`).join('')}</details>`:''}`}
 if(st===STAGE.DISCUSS){const previous=Object.values(room.claims||{});html+=`<h3>Registre des affirmations orales</h3><p class="small">Consigner uniquement des déclarations réellement entendues. Faire confirmer le statut par leur auteur. Ce registre est public ; les carnets restent privés.</p><label>Auteur<select id="claimAuthor">${[...investigators,'charlotte'].map(id=>`<option value="${id}" ${claimAuthor===id?'selected':''}>${h(fullName(id))}</option>`).join('')}</select></label><label>Nature<select id="claimKind"><option value="temoignage" ${claimKind==='temoignage'?'selected':''}>Témoignage</option><option value="hypothese" ${claimKind==='hypothese'?'selected':''}>Hypothèse</option><option value="accusation" ${claimKind==='accusation'?'selected':''}>Accusation</option></select></label><label>État<select id="claimStatus"><option value="en_attente" ${claimStatus==='en_attente'?'selected':''}>À confirmer</option><option value="validee" ${claimStatus==='validee'?'selected':''}>Confirmée oralement</option><option value="contestee" ${claimStatus==='contestee'?'selected':''}>Contestée</option></select></label><label>Déclaration<textarea id="claimText" maxlength="500">${h(claimText)}</textarea></label><button class="btn secondary" data-action="save-claim">Consigner cette affirmation</button><p class="small">${previous.length} affirmation(s) enregistrée(s). Les corrections se consignent comme de nouvelles déclarations, sans effacer les précédentes.</p>`}
 if(st===STAGE.FIRST||st===STAGE.SECOND)html+=`<h3>${st===STAGE.FIRST?'Premiers votes':'Votes finaux'}</h3>${readiness(st===STAGE.FIRST?'initial':'final')}`;
 if(st===STAGE.INFLUENCES){const total=influenceEdges().length;html+=`<p>Influences révélées : ${room.progress?.influenceIndex||0}/${total}</p><button class="btn secondary" data-action="next-influence" ${(room.progress?.influenceIndex||0)>=total?'disabled':''}>Afficher le lien suivant</button>`}
 if(st===STAGE.ARCHIVE){html+=`<p>Avant la suppression, laisse chacun enregistrer son PDF souvenir.</p><button class="btn danger w100" data-action="delete">Terminer et supprimer la session</button>`}else{let ready=st<18?Boolean(room.currentAnswer&&latestTestimony(st+1)?.validated):st===STAGE.FIRST?allFinished('initial'):st===STAGE.SECOND?allFinished('final'):true;html+=`<button class="btn w100" data-action="advance" ${ready?'':'disabled'}>${st===STAGE.ZONE?'Valider oralement puis autoriser la recherche':st===STAGE.SEARCH?'Coffret retrouvé et toujours fermé':st===STAGE.CLOCK?'Valider l’intervalle proposé':'Valider et poursuivre'} →</button>`}
 return html+'</section>'}
function screen(){const st=nowStage();if(st<0)return `<section class="card convocation"><div class="eyebrow">Halloween 2026 · Ingré</div><h2>Le Tribunal des Roubatvot</h2><p class="case-name">L'affaire du Trésor de la Chouquette</p><p class="intro-story">Le coffret a disparu de la table. Chacun possède un souvenir. Chacun pourrait avoir quelque chose à cacher.</p><p class="status-await">⚖️ L’audience va bientôt s’ouvrir</p><p class="small muted">L’organisatrice donnera le signal de départ.</p></section>`;if(st<STAGE.VERDICTS)return `<section class="card reveal-stage"><h2>🕯️ Le Tribunal des Roubatvot</h2><p>L’enquête est en cours. Écoutez les témoignages et confrontez vos hypothèses.</p></section>`;return stagesHTML()}
function settings(){const connected=Object.keys(room?.players||{}).length;return `<details class="settings room-settings"><summary>Paramètres de la salle</summary><div class="room-settings-content"><p>Salle : <strong>${h(session.code)}</strong> · ${connected}/7 participants · ${h(stageName(nowStage()))}</p><div class="room-settings-actions"><button class="btn secondary" data-action="copy-url">Copier le lien</button><button class="btn secondary" data-action="leave">Quitter la salle</button>${host()?'<button class="btn secondary" data-action="open-screen">Ouvrir l’écran commun</button>':''}</div>${host()?`<details><summary>Vérité du scénario (confidentielle)</summary>${FACTS.map(([t,x])=>`<p><strong>${h(t)}</strong> — ${h(x)}</p>`).join('')}<p>La découverte physique du coffret précède sa révélation. La lumière de 20 h 31 était programmée, indépendante. Aucun suspect n’a volé le coffret.</p></details>`:''}</div></details>`}
function login(){const mj=qs.get('mj')==='1';return `<div class="card"><h2>Entrer dans l’enquête</h2>${mj?`<p>Accès organisatrice.</p>${me&&!me.isAnonymous?`<button class="btn" data-action="create">Créer la salle</button>`:`<button class="btn" data-action="google">Connexion Google</button>`}`:`<label>Code de salle<input id="code" maxlength="8" value="${h(joinCode)}" placeholder="ABCDEFGH"></label><p>Choisis ton personnage :</p><div class="person-grid">${investigators.map(id=>`<button type="button" class="person-tile ${selectedPlayer===id?'selected':''}" data-join-person="${id}">${h(fullName(id))}</button>`).join('')}</div><button class="btn" data-action="join">Rejoindre l’enquête</button><button class="btn secondary" data-action="host-link">Accès organisatrice</button>`}</div>`}
function nav(){const sections=[['enquete','🎭 Tribunal'],['carnet','📋 Mon Cluedo'],['affaire','🕰️ L’affaire']];if(host())sections.push(['mj','⚖️ Espace MJ']);return `<div class="tabs ${host()?'tabs-host':''}">${sections.map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>`}
function welcome(){const registered=investigators.filter(id=>room?.players?.[id]?.uid).length;return `<section class="card convocation" aria-label="Convocation du Tribunal"><div class="eyebrow">Convocation confidentielle · Halloween 2026</div><h2>Le Tribunal des Roubatvot</h2><p class="case-name">Affaire n° 2026 — Le Trésor de la Chouquette</p><p class="intro-story">Ce soir, un coffret a disparu. Entre souvenirs, secrets et soupçons, chaque parole comptera. Le Tribunal va bientôt ouvrir l'enquête.</p><div class="identity"><span class="small muted">Vous êtes convoqué en qualité de</span><strong>${h(fullName(session.role))}</strong><p class="small">Gardez vos souvenirs pour vous jusqu’aux interrogations.</p></div><p class="status-await">🕯️ En attente de l’ouverture de l’audience</p><p class="small muted">${registered}/6 enquêteurs inscrits. Le MJ lancera la partie lorsque tout le monde sera prêt.</p></section>`}
function renderSafely(){if(!document.activeElement||!document.activeElement.matches('textarea,input,select'))render();else noteSync()}
function render(){
 for(const x of root.querySelectorAll('details[data-keep]')){if(x.open)expanded.add(x.dataset.keep);else expanded.delete(x.dataset.keep)}
 const current=nowStage();let body;
 if(!session)body=login();
 else if(screenMode)body=screen();
 else if(current<0)body=(host()?pilotage():welcome())+settings();
 else body=nav()+(tab==='mj'&&host()?pilotage():tab==='carnet'?carnet():tab==='affaire'?affaire():`<section class="card chapter-title"><div class="round">${h(stageName(current))}</div></section>`+(current<18?interrogation():stageContent()))+settings();
 if(error)body=`<div class="card error" role="alert">⚠️ ${h(error)} <button type="button" class="btn secondary" data-action="clear-error">Fermer</button></div>`+body;
 root.innerHTML=body;
 for(const el of root.querySelectorAll('details[data-keep]'))el.open=expanded.has(el.dataset.keep);
}
async function savePDF(){if(nowStage()<STAGE.ARCHIVE)throw Error('Le PDF souvenir est proposé après la fin du jeu.');const JSPDF=window.jspdf?.jsPDF;if(!JSPDF)throw Error('Le module PDF est indisponible. Vérifie la connexion internet, puis réessaie.');const doc=new JSPDF({unit:'mm',format:'a4'});let y=22,page=1;const margin=19;function add(text,opts={}){doc.setFont('helvetica',opts.bold?'bold':'normal');doc.setFontSize(opts.size||10);const content=doc.splitTextToSize(String(text??''),173);const height=content.length*(opts.size||10)*0.44+3;if(y+height>274){doc.addPage();page++;y=20}doc.text(content,margin,y);y+=height}function heading(text){y+=4;add(text,{bold:true,size:14});y+=2}doc.setTextColor(28,33,44);add('TRIBUNAL DES ROUBATVOT — DOSSIER CONFIDENTIEL',{bold:true,size:10});y+=7;add('DOSSIER D’ENQUÊTE',{bold:true,size:22});add('Le Trésor de la Chouquette',{bold:true,size:15});add(`Enquêteur : ${fullName(session.role)}`);add(`Référence fictive : ${session.code}-${session.role.toUpperCase()}`);add('Halloween 2026 · Ingré · AFFAIRE CLASSÉE');y+=8;heading('MES VOTES');add('Premier vote : '+formatVote(room.votesInitial?.[session.role]));add('Vote final : '+formatVote(room.votesFinal?.[session.role]));const last=room.votesFinal?.[session.role];if(last){add('Influence réellement déclarée : '+(last.influencedBy==='aucune'?'Aucune':last.influencedBy==='inconnue'?'Indéterminée':fullName(last.influencedBy)));if(last.influenceReason)add('Argument : '+last.influenceReason)}heading('MON CARNET CLUEDO');for(const id of suspects){const x=normalizedNote(notes[id]);if(x.status!=='inconnu'||x.text||Object.values(x.tags).some(Boolean)){add(`${fullName(id)} — ${x.status}`);if(x.text)add(x.text);const tags=NOTE_TAGS.filter(([key])=>x.tags[key]).map(([,label])=>label);if(tags.length)add(tags.join(' · '))}}heading('AFFIRMATIONS ORALES PUBLIQUES');for(const c of Object.values(room.claims||{})){add(`${fullName(c.author)} — ${c.kind} (${c.status})`);add(c.text)}heading('LES 18 INTERROGATIONS');let partial=[];for(const q of Q){const history=revisions(q.id);add(`PV ${q.id} — ${fullName(q.asker)} → ${fullName(q.target)}`,{bold:true});add('Question : '+q.question);if(history.length){const final=history.at(-1);add('Déclaration consignée : '+final.statement);if(final.followup1)add('Relance 1 : '+final.followup1);if(final.followup2)add('Relance 2 : '+final.followup2);if(history.length>1){add(`Corrections conservées : ${history.length-1}`);history.forEach((entry,i)=>add(`Version ${i+1} — ${new Date(entry.at||0).toLocaleString('fr-FR')} — ${entry.statement}`))}}else{partial.push('PV '+q.id);add('Déclaration non disponible')}}heading('CHRONOLOGIE — FAITS ÉTABLIS');for(const [time,fact]of FACTS)add(`${time} : ${fact}`);heading('CHRONOLOGIE — CONVICTIONS');add('Premier vote : '+formatVote(room.votesInitial?.[session.role]));add('Vote final : '+formatVote(room.votesFinal?.[session.role]));heading('RAPPORT FINAL');add('Aucun vol n’a été commis. Aucun suspect n’est coupable. Enola a déplacé le coffret innocemment pour jouer.');add('Le Tribunal déclare coupables… les certitudes, pas les personnes.');add('Le plus grand trésor n’était pas celui qui avait disparu. C’était celui qui nous réunissait tous autour de cette table.');add('HALLOWEEN SAUVÉ ! — AFFAIRE CLASSÉE');if(!room.votesInitial?.[session.role])partial.push('premier vote');if(!room.votesFinal?.[session.role])partial.push('vote final');if(partial.length){heading('ARCHIVES INCOMPLÈTES');add('Les sections suivantes manquent dans les données accessibles : '+partial.join(', ')+'. Leur absence ne signifie pas qu’elles n’ont jamais existé.')}doc.setProperties({title:'Dossier personnel du Tribunal des Roubatvot',subject:'Halloween 2026'});doc.save(`Tribunal_Roubatvot_${session.role}_Halloween_2026.pdf`)}
root.addEventListener('input',e=>{if(e.target.dataset.note)editNote(e.target.dataset.note,'text',e.target.value);if(e.target.id==='voteReason')voteArgument=e.target.value;if(e.target.id==='influenceReason')influenceReason=e.target.value;if(e.target.id==='code')joinCode=e.target.value;if(e.target.id==='spoken')transcriptDraft=e.target.value;if(e.target.id==='followup1')followup1Draft=e.target.value;if(e.target.id==='followup2')followup2Draft=e.target.value;if(e.target.id==='claimText')claimText=e.target.value});
root.addEventListener('change',e=>{if(e.target.name==='answer'){selectedAnswer=Number(e.target.value);render()}if(e.target.id==='voteSource'){chosenSource=e.target.value;render()}if(e.target.id==='influencedBy')influencedBy=e.target.value;if(e.target.id==='claimAuthor')claimAuthor=e.target.value;if(e.target.id==='claimKind')claimKind=e.target.value;if(e.target.id==='claimStatus')claimStatus=e.target.value});
root.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}if(el.dataset.replay){replayIndex=Math.max(0,Math.min(FACTS.length-1,replayIndex+(el.dataset.replay==='next'?1:-1)));render();return}if(el.dataset.finalView){finalView=Number(el.dataset.finalView);render();return}if(el.dataset.cluedoView){notebookView=el.dataset.cluedoView;render();return}if(el.dataset.personNote){selectedPerson=el.dataset.personNote;render();return}if(el.dataset.joinPerson){selectedPlayer=el.dataset.joinPerson;render();return}if(el.dataset.status){editNote(selectedPerson,'status',el.dataset.status);render();return}if(el.dataset.tag){editNote(selectedPerson,'tag',el.dataset.tag);render();return}if(el.dataset.votePerson){chosenSuspect=el.dataset.votePerson;render();return}if(el.dataset.absent){const [round,id]=el.dataset.absent.split(':');if(confirm(`Confirmer l’abstention exceptionnelle de ${fullName(id)} ?`)){try{await markAbsent(id,round)}catch(ex){error=ex.message;render()}}return}const action=el.dataset.action;if(!action||pending)return;pending=true;error='';try{switch(action){case'clear-error':break;case'google':await hostLogin();break;case'create':await createRoom();break;case'join':await openRoom(joinCode,selectedPlayer);break;case'host-link':location.assign(location.pathname+'?mj=1');return;case'leave':persistLocalNotes();unsubscribe();session=null;room=null;localStorage.removeItem(sessionKey);history.replaceState(null,'',location.pathname);break;case'copy-url':await navigator.clipboard.writeText(joinURL());break;case'open-screen':window.open(`${location.origin}${location.pathname}?screen=1&room=${encodeURIComponent(session.code)}`,'_blank');break;case'answer':await submitAnswer();break;case'copy-answer':if(room.currentAnswer){transcriptDraft=Q[nowStage()].answers[room.currentAnswer.value]};break;case'save-testimony':await saveTestimony();break;case'save-claim':await savePublicClaim();break;case'start-game':await startGame();break;case'vote-initial':await vote(false);break;case'vote-final':await vote(true);break;case'advance':await advance();break;case'next-influence':await nextInfluence();break;case'pdf':await savePDF();break;case'delete':await deleteSession();break;default:break}}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async user=>{me=user;try{if(!user){await signInAnonymously(auth);return}const old=JSON.parse(localStorage.getItem(sessionKey)||'null');if(old&&!session){try{await openRoom(old.code,old.role)}catch(ex){try{localStorage.removeItem(`roubatvot_v16_notes_${old.code}_${old.role}_${me.uid}`)}catch{}localStorage.removeItem(sessionKey);error='Ancienne session indisponible. Retour à l’accueil.'}}render()}catch(ex){error=ex.message;render()}});

</script></body></html>
