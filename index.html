<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAUA4xdHZyh17ZkmDHe0gXqIrNZgEovcrw',
  authDomain: 'roubatvot-murder-party.firebaseapp.com',
  databaseURL: 'https://roubatvot-murder-party-default-rtdb.firebaseio.com',
  projectId: 'roubatvot-murder-party',
  storageBucket: 'roubatvot-murder-party.firebasestorage.app',
  messagingSenderId: '225363228130',
  appId: '1:225363228130:web:94c1839cbe0d542f86b5bb',
  measurementId: 'G-0C0DLB8E6C'
};
const configured = ['apiKey','authDomain','databaseURL','projectId','appId'].every(k =>
  typeof firebaseConfig[k] === 'string' && firebaseConfig[k].length > 5 && !firebaseConfig[k].startsWith('REMPLACER_')
);
let app, auth, db, bootPromise, unsubscribers = [], offsetMs = 0;
const players = ['james','nino','andreas','matys','mathieu'];
function stopListening() { unsubscribers.forEach(unsub => unsub()); unsubscribers = []; }
function pathFor(code, name) { return ref(db, `rooms/${code}/${name}`); }
async function boot() {
  if (!configured) throw new Error('Complète firebaseConfig dans le HTML avant la connexion.');
  if (!bootPromise) bootPromise = (async () => {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
    const user = await new Promise((resolve, reject) => {
      let unsub = () => {};
      unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); }, reject);
    });
    if (!user) await signInAnonymously(auth);
    if (!auth.currentUser) throw new Error('Authentification anonyme indisponible. Active-la dans Firebase Authentication.');
    return auth.currentUser.uid;
  })();
  await bootPromise;
  return auth.currentUser?.uid;
}
function currentHostAccount() {
  const user = auth?.currentUser;
  return user?.providerData?.some(p => p.providerId === 'google.com') ? {uid:user.uid,email:user.email,verified:user.emailVerified} : null;
}
async function signInHost() {
  if (!auth) throw new Error('Firebase n’est pas prêt.');
  const result = await signInWithPopup(auth,new GoogleAuthProvider());
  if (!result.user.emailVerified) throw new Error('Le compte Google doit avoir une adresse e-mail vérifiée.');
  return currentHostAccount();
}
async function switchToAnonymous() {
  await boot();
  await signOut(auth);
  await signInAnonymously(auth);
}
function randomRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}
async function createRoom() {
  const uid = await boot();
  if (!currentHostAccount()?.verified) throw new Error('Connecte-toi avec ton compte Google pour créer une salle MJ.');
  for (let i=0; i<6; i++) {
    const code = randomRoomCode();
    try {
      await set(pathFor(code,''), {
        hostUid: uid,
        createdAt: serverTimestamp(),
        players: { charlotte: { uid } },
        progress: {
          confession: false,
          hintAll: false,
          round: 1,
          stage: 0,
          beat: 0,
          clock: { running: false, elapsedMs: 0, startedAt: 0 }
        }
      });
      return {code, playerId:'charlotte', isHost:true};
    } catch (error) {
      // Collision (extrêmement improbable) : on réessaie seulement si la salle existe.
      try { if (!(await get(pathFor(code,'hostUid'))).exists()) throw error; }
      catch (checkError) { throw error; }
    }
  }
  throw new Error('Impossible de générer un code de salle libre.');
}
async function joinRoom(roomCode, playerId) {
  const uid = await boot();
  const code = String(roomCode || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) throw new Error('Le code de salle doit contenir huit caractères.');
  if (!players.includes(playerId) && playerId !== 'charlotte') throw new Error('Choisis un personnage valide.');
  const hostSnap = await get(pathFor(code,'hostUid'));
  if (!hostSnap.exists()) throw new Error('Salle introuvable. Vérifie les huit caractères.');
  const isHost = hostSnap.val() === uid;
  if (playerId === 'charlotte' && !currentHostAccount()?.verified) throw new Error('La connexion Google est obligatoire pour reprendre le rôle MJ.');
  if (playerId === 'charlotte' && !isHost) throw new Error('Seul le compte Google créateur peut rejoindre le rôle MJ.');
  if (playerId !== 'charlotte' && isHost) throw new Error('Le téléphone MJ doit conserver son propre profil.');
  const playerRef = pathFor(code, `players/${playerId}`);
  const prior = await get(playerRef);
  if (prior.exists() && prior.child('uid').val() !== uid) throw new Error('Ce personnage est déjà pris sur un autre téléphone.');
  if (!prior.exists()) await set(playerRef, {uid});
  return {code, playerId, isHost};
}
function listenRoom(session, callbacks) {
  stopListening();
  const { code, playerId, isHost } = session;
  unsubscribers.push(onValue(pathFor(code,'progress'), snap => callbacks.progress(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'players'), snap => callbacks.players(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,isHost?'votes':`votes/${playerId}`), snap => callbacks.votes(snap.val() || null), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'accusations'), snap => callbacks.accusations(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(ref(db,'.info/serverTimeOffset'), snap => {
    offsetMs = Number(snap.val()) || 0;
    callbacks.offset(offsetMs);
  }, callbacks.error));
}
async function publishSolved(code, level, playerId) {
  if (!players.includes(playerId) || players[level-1] !== playerId) throw new Error('Cette énigme ne correspond pas au joueur.');
  await set(pathFor(code,`progress/solved/${level}`),true);
}
async function forceSolve(code, id) {
  for (let i=1; i<=id; i++) await set(pathFor(code,`progress/solved/${i}`),true);
}
async function hostFlag(code,name,value) {
  if (!['confession','hintAll'].includes(name)) throw new Error('Commande MJ inconnue.');
  await set(pathFor(code,`progress/${name}`),Boolean(value));
}
async function hostClock(code, running, currentClock) {
  const now = Date.now()+offsetMs;
  const elapsed = Number(currentClock?.elapsedMs || 0);
  const started = Number(currentClock?.startedAt || 0);
  await set(pathFor(code,'progress/clock'),running
    ? {running:true,elapsedMs:elapsed,startedAt:serverTimestamp()}
    : {running:false,elapsedMs:elapsed+(currentClock?.running ? Math.max(0,now-started):0),startedAt:0});
}
async function hostStage(code, stage) {
  if (!Number.isInteger(stage) || stage < 0 || stage > 9) throw new Error('Phase invalide.');
  await update(pathFor(code,'progress'), {stage, beat:0});
}
async function hostBeat(code, beat) {
  if (!Number.isInteger(beat) || beat < 0 || beat > 9) throw new Error('Étape de scène invalide.');
  await set(pathFor(code,'progress/beat'), beat);
}
async function castAccusation(code, playerId, accusation) {
  if (!players.includes(playerId)) throw new Error('Seuls les enquêteurs peuvent accuser.');
  await set(pathFor(code,`accusations/${playerId}`), {
    suspect:accusation.suspect,
    indice:accusation.indice,
    argument:accusation.argument.trim(),
    submittedAt:serverTimestamp()
  });
}
async function castVote(code, playerId, vote) {
  await set(pathFor(code,`votes/${playerId}`), {
    historique:vote.historique,
    protocole:vote.protocole,
    intention:vote.intention,
    tresor:vote.tresor,
    preuve:vote.preuve,
    argument:vote.argument,
    submittedAt:serverTimestamp()
  });
}
async function resetRoom(code) {
  const roundSnap = await get(pathFor(code,'progress/round'));
  const nextRound = (Number(roundSnap.val()) || 1) + 1;
  await update(pathFor(code,'progress'), {
    solved:null,
    confession:false,
    hintAll:false,
    stage:0,
    beat:0,
    round:nextRound,
    clock:{running:false,elapsedMs:0,startedAt:0}
  });
  await set(pathFor(code,'votes'),null);
  await set(pathFor(code,'accusations'),null);
}
window.RoubatvotFirebase = {configured, boot, createRoom, joinRoom, listenRoom, stopListening,
  publishSolved, forceSolve, hostFlag, hostClock, hostStage, hostBeat, castAccusation, castVote, resetRoom, currentHostAccount, signInHost, switchToAnonymous};
window.dispatchEvent(new Event('roubatvot-firebase-ready'));
</script>

                  {beat===0 ? currentUser.isMJ ? <p>Fais déposer les cinq bulletins. Les soupçons ne seront affichés qu’après ton signal.</p> : myAccusation ? <div className="rounded-lg bg-emerald-950/30 border border-emerald-700 p-3">✅ Tu as envoyé ton soupçon et ta justification. Attends les autres.</div> : <>
                    <label className="block font-bold">Je soupçonne :</label>
                    <select className="w-full bg-slate-950 border border-slate-600 rounded-lg p-3" value={accusation.suspect} onChange={e=>setAccusation(v=>({...v,suspect:e.target.value}))}><option value="">Choisir un suspect</option>{SUSPECT_OPTIONS.map(x=><option value={x} key={x}>{x}</option>)}</select>
                    <label className="block font-bold">À cause de cette pièce :</label>
                    <select className="w-full bg-slate-950 border border-slate-600 rounded-lg p-3" value={accusation.indice} onChange={e=>setAccusation(v=>({...v,indice:e.target.value}))}><option value="">Choisir une preuve</option>{accusationProofs.map(p=><option value={p.id} key={p.id}>{EVIDENCE_LABELS[p.id]}</option>)}<option value="Indéterminé">Je n'ai pas de preuve suffisante</option></select>
                    <label className="block font-bold">J'explique mon soupçon :</label>
                    <textarea rows={3} maxLength={220} value={accusation.argument} onChange={e=>setAccusation(v=>({...v,argument:e.target.value}))} placeholder="Je soupçonne… parce que la pièce … indique que…" className="w-full bg-slate-950 border border-slate-600 rounded-lg p-3" />
                    <button onClick={sendAccusation} className="w-full bg-amber-500 text-slate-950 font-bold rounded-lg p-3">Enregistrer mon soupçon</button>
                    {accusationError && <p role="alert" className="text-rose-300">{accusationError}</p>}
                  </> : <p>Les bulletins sont prêts à être confrontés.</p>}
                </div>}
                {stage>=4 && (stage>4 || beat>=1) && <div className="rounded-xl bg-slate-900 border border-slate-700 p-4 space-y-2 text-xs">
                  <h3 className="font-bold text-amber-300">🗳️ Soupçons déposés avant les nouveaux témoignages</h3>
                  {Object.entries(accusations).map(([id,v])=><div key={id} className="border-b border-slate-800 pb-2"><strong>{PLAYERS[id]?.name||id}</strong> soupçonnait <strong>{v.suspect}</strong> — {EVIDENCE_LABELS[v.indice]||v.indice}<p className="text-slate-300">« {v.argument||'Justification non fournie'} »</p></div>)}
                  <p className="text-slate-400">Une accusation est une hypothèse : de nouveaux éléments peuvent la modifier.</p>
                </div>}
                {currentUser.isMJ && <button onClick={()=>setActiveTab('mj')} className="w-full bg-rose-900 rounded-lg p-3 text-xs font-bold">👑 Débloquer la prochaine étape dans le panneau MJ</button>}
                <button onClick={()=>setActiveTab('dossier')} className="w-full bg-slate-800 border border-slate-700 rounded-lg py-3 font-semibold">🔎 Consulter les preuves déjà dévoilées</button>
              </section>
            )}

            {activeTab === 'dossier' && (
              <section className="space-y-3">
                <div className="rounded-xl border border-amber-600/50 bg-amber-950/20 p-4 space-y-2">
                  <h2 className="font-cinzel font-bold text-amber-200 text-lg">🔍 Carnet d’enquête</h2>
                  <p className="text-xs">Un indice établit un fait mais ne désigne pas forcément un coupable. À chaque découverte, demandez : « Que sait-on ? Que suppose-t-on ? »</p>
                  <p className="text-xs text-amber-100"><strong>Mission principale :</strong> découvrir où est passé le coffret. La légende et la lettre sont peut-être des détours.</p>
                </div>
                {['Alibis','Horaires','Système','Archives','Coffret'].map(cat=>{
                  const proofs=availableEvidence.filter(p=>p.category===cat);
                  return <div key={cat} className="bg-slate-900 border border-slate-700 rounded-xl p-3 space-y-2 text-xs"><h3 className="font-bold text-amber-200">{cat} · {proofs.length} pièce(s)</h3>
                    {proofs.map(p=><div key={p.id} className="bg-slate-950 border border-slate-800 p-3 rounded-lg space-y-2"><p className="font-bold text-cyan-200">{p.id} — {p.title}</p><p><strong className="text-emerald-200">Fait :</strong> {p.fact}</p><p className="text-slate-400"><strong>Limite :</strong> {p.limit}</p></div>)}
                    {proofs.length===0 && <p className="text-slate-500">🔒 À découvrir pendant la suite de l’enquête.</p>}
                  </div>;
                })}
                {stage>=9 && <button onClick={()=>setActiveTab('vote')} className="w-full bg-amber-500 text-slate-950 rounded-lg py-3 font-bold">⚖️ Je suis prêt à voter</button>}
              </section>
            )}

            {activeTab === 'vote' && (
              <section className="space-y-3">
                <div className="bg-slate-900 border border-amber-600/50 rounded-xl p-4 space-y-2">
                  <h2 className="font-cinzel font-bold text-amber-200 text-lg">⚖️ Le verdict du conseil</h2>
                  <p className="text-xs">Vous pouvez changer d’avis après vos premières accusations. Répondez sur l’affaire de 1897, la lettre et le coffret, puis <strong>choisissez une preuve</strong> et expliquez pourquoi.</p>
                </div>
                {currentUser.isMJ ? <div className="bg-slate-900 rounded-lg p-4 text-xs">👑 Charlotte consulte les cinq bulletins depuis le panneau MJ ; elle ne vote pas.</div>
                 : (!margueriteUnlocked && (solvedLevels.length<5 || stage<9)) ? <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-xs">🔒 Attends le lancement du tribunal par Charlotte et la fin des cinq énigmes.</div>
                 : voteSubmitted ? <div className="bg-emerald-950/30 border border-emerald-700 rounded-xl p-4 text-xs space-y-2"><strong className="text-emerald-200">✅ Ton bulletin a été enregistré</strong>
                    {VOTE_QUESTIONS.map(q=><p key={q.key}>{q.title} <strong>{voteLabel(q,sharedMode ? remoteVotes?.[q.key] : votes[q.key])}</strong></p>)}
                    <p>Preuve : <strong>{sharedMode?remoteVotes?.preuve:votes.preuve}</strong></p>
                    <p>Argument : {sharedMode?remoteVotes?.argument:votes.argument}</p>
                 </div> : <div className="space-y-3">
                   {VOTE_QUESTIONS.map((q,i)=><fieldset key={q.key} className="bg-slate-900 border border-slate-700 rounded-xl p-4 space-y-2"><legend className="font-bold text-amber-300 text-sm">{i+1}. {q.title}</legend><p className="text-xs text-slate-400">{q.help}</p>
                    {q.options.map(([val,label])=><button key={val} onClick={()=>setVotes({...votes,[q.key]:val})} aria-pressed={votes[q.key]===val} className={`w-full text-left rounded-lg border p-3 text-xs ${votes[q.key]===val?'bg-amber-500/20 border-amber-400 text-amber-100':'bg-slate-950 border-slate-700'}`}>{votes[q.key]===val?'◉':'○'} {label}</button>)}
                   </fieldset>)}
                   <div className="bg-slate-900 border border-amber-600/50 rounded-xl p-4 space-y-2 text-xs"><h3 className="font-bold text-amber-200">5. Sur quelle pièce repose ton verdict ?</h3>
                    <select className="w-full p-3 rounded-lg bg-slate-950 border border-slate-700" value={votes.preuve} onChange={e=>setVotes({...votes,preuve:e.target.value})}><option value="">Choisir une preuve</option>{VOTE_PROOFS.map(([id,name])=><option key={id} value={id}>{name}</option>)}</select>
                    <label className="font-semibold block" htmlFor="argument">Explique ton choix en une phrase (12 à 220 caractères)</label>
                    <textarea id="argument" maxLength={220} rows={3} className="w-full rounded-lg bg-slate-950 p-3 border border-slate-700" placeholder="Je soupçonne… car la pièce… montre que…" value={votes.argument} onChange={e=>setVotes({...votes,argument:e.target.value})}></textarea>
                    <button disabled={!voteComplete || voteBusy} onClick={submitVote} className="w-full rounded-lg bg-amber-500 disabled:bg-slate-700 disabled:text-slate-400 text-slate-950 font-bold p-3">{voteBusy?'Envoi…':'🗳️ Sceller mon verdict'}</button>
                    {voteError && <p className="text-rose-300">{voteError}</p>}
                   </div>
                 </div>}
              </section>
            )}
            {activeTab === 'reveal' && margueriteUnlocked && (
              <section className="space-y-4" aria-label="Dénouement">
                <div className="rounded-2xl border-2 border-purple-500 bg-gradient-to-b from-purple-950/80 to-slate-900 p-5 space-y-2 text-center"><div className="text-4xl">🎭</div><h2 className="font-cinzel font-bold text-amber-200 text-xl">La vérité des Roubatvot</h2><p className="text-xs">Trois histoires, un seul Trésor.</p></div>
                <div className="rounded-xl p-4 bg-slate-900 border border-amber-700 space-y-2 text-xs"><h3 className="font-bold text-amber-200">📜 La fausse piste de 1897</h3><p>Une légende accusait Émile d’avoir volé un médaillon. Les archives ne permettent pas de prouver qui l’a pris. Ce récit a détourné vos soupçons du mystère actuel.</p></div>
                <div className="rounded-xl p-4 bg-slate-900 border border-cyan-700 space-y-2 text-xs"><h3 className="font-bold text-cyan-200">🖥️ Les quatre minutes</h3><p>Mathieu avait lancé à 20 h 27 un banal test de connexion. Il ignorait que celui-ci activait N0CT-7. Une temporisation de <strong>240 secondes</strong> a provoqué l’apparition de la lettre à 20 h 31. Le système ne pouvait pas emporter le coffret.</p></div>
                <div className="rounded-xl p-4 bg-pink-950/20 border-2 border-pink-600 space-y-3 text-xs"><h3 className="font-cinzel text-pink-200 text-lg font-bold">🍒 Qui a emporté le Trésor ?</h3><p>James avait aperçu une petite silhouette vers les jouets, Andreas entendu un couvercle et le doudou offrait un dernier rapprochement. <strong>Enola a pris le coffret pour jouer</strong>, sans intention de le cacher à la famille.</p><p className="text-pink-100">Mais vous devez encore le retrouver ensemble !</p></div>
                <div className="rounded-xl bg-emerald-950/30 border border-emerald-700 p-4 space-y-2 text-xs"><h3 className="font-bold text-emerald-200 text-sm">🎁 Ultime énigme collective</h3><p className="italic">« Là où les doudous se reposent, les trésors deviennent des jouets. »</p><p><strong>Règle :</strong> Charlotte autorise maintenant une seule recherche au coin des jouets, près des doudous. Aucune fouille du reste de la maison.</p></div>
                <button onClick={()=>setActiveTab('dossier')} className="w-full rounded-lg border border-purple-700 bg-slate-800 py-3 text-xs font-bold">Revoir l’enquête</button>
              </section>
            )}

            {activeTab === 'mj' && currentUser.isMJ && (
              <div className="space-y-3 animate-fade-in">
                <h2 className="font-cinzel font-bold text-rose-400 text-sm">Panneau Charlotte (MJ)</h2>
                <p className="text-xs text-slate-400">{sharedMode ? 'Commandes protégées par ton compte Google. Les preuves et votes sont synchronisés.' : 'Mode secours : le tableau reflète ce téléphone uniquement. Reçois les codes des joueurs dans « Écran commun ».'}</p>
                <div className="rounded-xl border border-amber-700/60 bg-slate-900 p-4 space-y-3 text-xs">
                  <h3 className="font-cinzel text-amber-200 text-sm font-bold">🎬 Conseil interactif · 10 scènes</h3>
                  <p>Fais parler les joueurs, puis publie une étape à la fois. Les nouveaux témoignages et leurs preuves apparaissent simultanément sur tous les téléphones.</p>
                  <div className="border border-slate-700 rounded-xl p-3 space-y-3">
                    <p className="font-bold text-indigo-200">Scène {stage+1}/10 — {STAGES[stage].name}</p>
                    <p className="text-slate-400">Étape {beat+1}/{SCENE_BEATS[stage].length} : <strong className="text-slate-100">{SCENE_BEATS[stage][beat].title}</strong></p>
                    <p className="text-slate-200">{SCENE_BEATS[stage][beat].mj}</p>
                    <button disabled={hostBusy || beat===SCENE_BEATS[stage].length-1} onClick={advanceBeat} className="w-full bg-indigo-700 disabled:bg-slate-700 disabled:text-slate-400 rounded-lg p-3 font-bold">{beat===SCENE_BEATS[stage].length-1?'✅ Toutes les étapes de la scène sont publiées':'📣 Publier le témoignage / l’étape suivante'}</button>
                    {stage<9 && <>
                      <button disabled={hostBusy || (!testMode && gateReasons.length>0)} onClick={()=>setStage(stage+1)} className="w-full bg-emerald-800 disabled:bg-slate-700 disabled:text-slate-400 rounded-lg p-3 font-bold">➡️ Terminer la scène et passer à « {STAGES[stage+1].name} »</button>
                      {gateReasons.length>0 && <div className="border border-amber-800/60 bg-amber-950/20 rounded-lg p-3"><p className="font-bold text-amber-200">Conditions restantes :</p><ul className="list-disc list-inside">{gateReasons.map((reason,i)=><li key={i}>{reason}</li>)}</ul></div>}
                    </>}
                    {stage===9 && <p className="text-slate-300">Après les cinq bulletins, publie la dernière étape puis lance la révélation depuis les commandes finales.</p>}
                    <details className="bg-slate-950 border border-rose-950 rounded-lg p-3"><summary className="cursor-pointer text-rose-300">🧪 Dépannage MJ — navigation libre (tests uniquement)</summary>
                      <label className="flex gap-2 items-center pt-3"><input type="checkbox" checked={testMode} onChange={e=>setTestMode(e.target.checked)} /> Autoriser à ignorer les conditions de scène</label>
                      {testMode && <div className="flex gap-2 pt-2"><button disabled={stage===0||hostBusy} onClick={()=>setStage(stage-1)} className="flex-1 bg-rose-900 rounded p-2">Phase précédente</button><button disabled={stage===9||hostBusy} onClick={()=>setStage(stage+1)} className="flex-1 bg-rose-900 rounded p-2">Sauter une phase</button></div>}
                      <p className="text-slate-500 text-[11px] pt-2">Le mode test n’annule pas les règles d’écriture des joueurs. Pour une nouvelle manche propre, réinitialise la salle.</p>
                    </details>
                  </div>
                  <button onClick={()=>setActiveTab('interro')} className="bg-emerald-800 border border-emerald-700 rounded-lg w-full p-3 font-bold">🗣️ Afficher la scène commune</button>

                  <details className="bg-slate-950 rounded-lg border border-slate-700 p-3"><summary className="font-bold text-rose-200 cursor-pointer">🔒 Scénario secret MJ (spoilers)</summary><div className="space-y-2 pt-2 text-slate-200"><p><strong>20 h 27 :</strong> Mathieu lance TEST_CONNEXION sans savoir que N0CT-7 affiche la lettre 240 secondes après.</p><p><strong>20 h 31 :</strong> James voit encore le coffret sur la table.</p><p><strong>20 h 33 :</strong> Nino et Matys sont à la cuisine, Andreas les voit et entend un bruit côté jouets. James aperçoit une petite silhouette.</p><p><strong>Vérité :</strong> Enola a emporté le coffret innocemment. Ne révèle rien avant la scène finale.</p></div></details>
                </div>
                {sharedMode && <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                  <p className="font-bold text-amber-400">Profils attribués à la salle</p>
                  {Object.keys(PLAYERS).map(id=><p key={id} className="flex justify-between"><span>{PLAYERS[id].avatar} {PLAYERS[id].name}</span><span>{roomPlayers[id]?'Profil réservé':'En attente'}</span></p>)}
                  <p className="font-bold text-indigo-300 pt-2">Premières accusations : {Object.keys(accusations).length}/5</p>
                  {Object.entries(accusations).map(([id,a])=><p key={id}>{PLAYERS[id]?.name} → {a.suspect} ({a.indice})</p>)}
                  <p className="font-bold text-amber-400 pt-2">Votes enregistrés : {Object.keys(remoteVotes || {}).length} / 5</p>
                  {Object.entries(remoteVotes || {}).map(([id,v])=>(
                    <div key={id} className="bg-slate-950 border border-slate-700 rounded-lg p-2 space-y-1">
                      <p className="font-bold text-amber-200">{PLAYERS[id]?.name || id}</p>
                      {v.historique !== undefined ? <>{VOTE_QUESTIONS.map(q=><p key={q.key}>{q.title} <strong>{voteLabel(q,v[q.key])}</strong></p>)}<p>Preuve : {v.preuve||'—'}</p><p>Argument : {v.argument||'ancien bulletin'}</p></> : <p className="text-amber-200">Bulletin de l’ancienne version (nouvelle manche conseillée).</p>}
                    </div>
                  ))}
                </div>}
                <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                  <button onClick={() => setIsTimerActive(!isTimerActive)} className="w-full bg-slate-800 text-amber-400 py-2 rounded font-semibold">
                    {isTimerActive ? '⏸ Pause Chrono' : '▶ Lancer Chrono'}
                  </button>
                  <button onClick={() => sharedMode ? window.RoubatvotFirebase.hostFlag(roomSession.code,'hintAll',!remoteProgress?.hintAll).catch(e=>setFirebaseError(e.message)) : setMjForceHints(!mjForceHints)} className="w-full bg-amber-900/60 text-amber-200 py-2 rounded font-semibold">
                    {(sharedMode ? remoteProgress?.hintAll : mjForceHints) ? 'Verrouiller Indices' : '💡 Forcer Indices pour Tous'}
                  </button>
                  <div className="rounded-lg border border-purple-800/70 bg-purple-950/25 p-3 space-y-2">
                    <p className="font-semibold text-purple-200">🎭 Révélation finale sur tous les téléphones</p>
                    <p className="text-[11px] text-slate-300">À lancer de préférence après les cinq énigmes et les cinq votes. L'écran final s'ouvre automatiquement chez les joueurs, et reste consultable ensuite.</p>
                    {sharedMode && <p className="text-[11px] text-slate-400">Énigmes : {solvedLevels.length}/5 · Votes : {Object.keys(remoteVotes || {}).length}/5</p>}
                    <button onClick={() => {
                      if (!margueriteUnlocked && !testMode && (solvedLevels.length < 5 || stage < 9 || beat < SCENE_BEATS[9].length-1 || (sharedMode && Object.keys(remoteVotes || {}).length < 5))) {
                        setFirebaseError('Révélation bloquée : termine les scènes et collecte les cinq votes.'); return;
                      }
                      setMargueriteUnlocked(!margueriteUnlocked);
                    }} disabled={!testMode && !margueriteUnlocked && (stage!==9 || beat<1 || solvedLevels.length<5 || (sharedMode && Object.keys(remoteVotes||{}).length<5))} className="w-full bg-rose-900/70 disabled:bg-slate-700 disabled:text-slate-400 text-rose-100 py-3 rounded-lg font-bold">
                      {margueriteUnlocked ? 'Masquer la révélation pour tous' : '🎬 Déclencher la révélation finale'}
                    </button>
                  </div>
                  <div className="pt-2 border-t border-slate-800 font-bold text-slate-300">{sharedMode ? 'Déblocage forcé pour tous :' : 'Déblocage forcé (sur cet appareil) :'}</div>
                  {PUZZLES.map(p => (
                    <div key={p.id} className="flex justify-between items-center bg-slate-950 p-2 rounded">
                      <span>Épreuve {p.id}</span>
                      <button disabled={solvedLevels.includes(p.id)} onClick={()=>handleMJUnlock(p.id)} className="bg-amber-500 disabled:bg-slate-800 text-slate-950 text-[10px] px-2 py-1 rounded font-bold">
                        {solvedLevels.includes(p.id) ? 'Validé' : 'Forcer'}
                      </button>
                    </div>
                  ))}
                  <button className="w-full bg-rose-950 border border-rose-700 text-rose-200 rounded py-2" onClick={()=>{
                    if(confirm(sharedMode ? 'Réinitialiser la partie POUR TOUS les joueurs ? Cette action efface les votes et les preuves partagés.' : 'Réinitialiser le jeu sur CE téléphone ? Cette action efface aussi les votes et preuves locaux.')) {
                      if (sharedMode) {window.RoubatvotFirebase.resetRoom(roomSession.code).catch(e=>setFirebaseError(e.message));} else setGame({...defaultProgress, votes: {...defaultProgress.votes}, puzzleStarts:{}, hintsAsked:{}});
                      setPuzzleInput(''); setRelayInput(''); setRelayMessage(''); setMjForceHints(false); setPuzzleError('');
                    }
                  }}>↺ {sharedMode ? 'Réinitialiser la salle entière' : 'Réinitialiser sur cet appareil'}</button>
                </div>
              </div>
            )}
          </>
        )}

      </main>

      <footer className="bg-slate-950 border-t border-slate-900 p-2 text-center text-[10px] text-slate-500">
        La Malédiction des Roubatvot &copy; 2026 - Ingré · {sharedMode ? "synchronisation Firebase" : "mode local avec codes-relais"}
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
