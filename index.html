const Q=[{"id":1,"round":1,"asker":"james","target":"charlotte","question":"Je t'ai vue près de la table avant la disparition. Qu'est-ce que tu y faisais exactement ?","answers":["Je terminais les décorations. Il fallait bien que quelqu'un prépare cette soirée.","J'étais près de la table, oui. Mais être près du coffret ne signifie pas l'avoir touché.","Tu m'as vue près de la table, James. As-tu vu mes mains sur le coffret ?"],"relances":["Quelle décoration préparais-tu à ce moment-là ?","Qu'as-tu réellement touché sur la table ?","Tu ne réponds pas : quel objet as-tu déplacé ?"],"truth":"Charlotte s'est approchée de la table à 20 h 29 pour une décoration ; elle n'a pas déplacé le coffret."},{"id":2,"round":1,"asker":"nino","target":"andreas","question":"Comment sais-tu que je suis passé près de la table ? Tu regardais le Trésor ou tu me surveillais ?","answers":["Je t'ai vu passer vers 20 h 25. Je regardais ce qui se passait autour de moi.","J'ai remarqué ton passage vers 20 h 25 parce que tu semblais vouloir rester discret.","Je t'ai aperçu près de la table vers 20 h 25. Pourquoi veux-tu tant savoir si je te regardais ?"],"relances":["M'as-tu vu toucher le coffret, ou seulement passer ?","Ton impression vient de quel geste précis ?","Réponds : que m'as-tu vu faire exactement ?"],"truth":"Andreas a remarqué Nino près de la table vers 20 h 25 ; il ne l'a pas vu déplacer le Trésor."},{"id":3,"round":1,"asker":"andreas","target":"nino","question":"Tu étais près de la table à 20 h 25. Qu'est-ce que tu cherchais ?","answers":["Une friandise ! Je n'ai pas volé un coffret pour un bonbon.","J'avais faim, je suis venu prendre une friandise. Et alors ?","L'emballage était à moi. Mais qui a touché au coffret après ?"],"relances":["Pourquoi voulais-tu éviter qu'on parle de la friandise ?","As-tu laissé l'emballage près de la table ?","Tu admets la friandise : as-tu vu quelqu'un d'autre près du coffret ?"],"truth":"Nino a pris une friandise à 20 h 25 et laissé un emballage ; cel function collectiveDiagnosis(votes){
 const ballots=investigators.map(id=>({id,v: votes?.[id]||{}}));
 const count=suspect=>ballots.filter(x=>x.v.suspect===suspect).length;
 const sourceCount=source=>ballots.filter(x=>x.v.source===source).length;
 const group=suspects.map(id=>({id,n:count(id)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||suspects.indexOf(a.id)-suspects.indexOf(b.id));
 const indeterminate=count('indetermine');
 const sources=SOURCE_KEYS.map(id=>({id,n:sourceCount(id)}));
 const selected=sources.reduce((sum,x)=>sum+x.n,0);
 const largest=group.length?group[0].n:0;
 return {ballots,group,indeterminate,sources,selected,largest,collectif:sourceCount('collectif')};
}
function sharedVerdicts(votes){
 return investigators.map(id=>{
  const ballot=votes?.[id]||{};
  const suspect=ballot.suspect==='indetermine'?'❔ Preuves insuffisantes':(P[ballot.suspect]||'Verdict non disponible');
  const source=CONVICTION_SOURCES[ballot.source];
  return `<div class="conviction-voice"><strong>${h(P[id])} → ${h(suspect)}</strong><small>${source?`${h(source.icon)} ${h(source.short)}`:'Source de conviction non indiquée'}${ballot.argument?` · « ${h(ballot.argument)} »`:''}</small></div>`;
 }).join('');
}
function sharedBeliefMirror(votes){
 const d=collectiveDiagnosis(votes);
 const major=d.group.filter(x=>x.n===d.largest);
 const lead=d.largest>=2?(major.length===1
  ?`${d.largest} enquêteurs ont désigné ${P[major[0].id]}. Ils partageaient une accusation, pas nécessairement les mêmes preuves.`
  :`${major.map(x=>P[x.id]).join(' et ')} recueillent chacun ${d.largest} accusations. Il n’y a pas une seule théorie dominante.`)
  :`Aucune personne ne rassemble plusieurs accusations : les conclusions du groupe divergent.`;
 const collective=d.collectif===0
  ?'Personne n’a déclaré que les soupçons répétés du groupe étaient sa raison principale. Cela ne permet pas de savoir si les discussions ont malgré tout influencé des choix.'
  :`${d.collectif} enquêteur${d.collectif>1?'s':''} ${d.collectif>1?'déclarent':'déclare'} que les soupçons répétés du groupe ${d.collectif>1?'étaient':'étaient'} ${d.collectif>1?'leur raison principale':'sa raison principale'}. C’est leur déclaration, pas une preuve que quelqu’un les a trompés.`;

 const ballot=ctx().votes?.[session.role];
 if(!ballot)return `<section class="mirror-panel" aria-label="Bilan personnel"><h3>🕯️ Ton bilan se prépare</h3><p>Chargement de ton verdict personnel…</p></section>`;
 if(!verdictSnapshot||verdictSnapshot.by!==me?.uid||!verdictSnapshot.notes)return `<section class="mirror-panel" aria-label="Bilan personnel"><h3>🕯️ Ton verdict est connu</h3><p>Ton choix était ${h(P[ballot.suspect]||'« Les preuves ne suffisent pas »')}.</p><p>L’instantané de tes notes au moment du vote n’est pas disponible. Tes notes actuelles restent consultables, mais je ne peux pas en déduire ce que tu pensais alors.</p></section>`;
 const traces=mirrorFacts(verdictSnapshot,ballot);
 const choice=ballot.suspect==='indetermine'?'❔ Preuves insuffisantes':P[ballot.suspect]||'Choix inconnu';
 const question=MIRROR_VERDICT_QUESTIONS[ballot.suspect]||MIRROR_VERDICT_QUESTIONS.indetermine;
 const argument=typeof ballot.argument==='string'?ballot.argument.trim():'';
 const disclosed=CONVICTION_SOURCES[ballot.source];
 const sourceReflection=disclosed?`<p><strong>Tu avais choisi :</strong> ${h(disclosed.short)}. ${h(disclosed.question)}</p>`:'<p>La raison principale de ta conviction n’a pas été enregistrée.</p>';
 return `<section class="mirror-panel" aria-label="Bilan rétrospectif privé"><div class="round">CHAPITRE V · APRÈS LA VÉRITÉ</div><h3>🪞 Ce que tu croyais savoir</h3><p class="mirror-subtitle">Voici tes choix tels qu’ils étaient enregistrés au moment de ton vote. Ce bilan questionne tes raisonnements ; il ne les juge pas.</p><div class="mirror-verdict"><span class="mini-tag">🗳️ Ton verdict enregistré</span><strong>${h(choice)}</strong>${argument?`<p>Ta justification : « ${h(argument)} »</p>`:'<p>Tu n’avais pas rédigé de justification.</p>'}${sourceReflection}<p>${h(question)}</p></div>${traces.length?`<h4>📋 Tes convictions au moment du vote</h4>${traces.map(t=>`<div class="mirror-trace"><div class="label">${h(P[t.id])} · ${h({suspect:'🔴 Suspect',ecarte:'🟢 Écarté',verifier:'🟠 À vérifier',inconnu:'❔ Inconnu'}[t.status])}</div><p>${h(t.text)}</p>${t.tags?`<p class="small">Tes pastilles : ${h(t.tags)}</p>`:''}${t.observation?`<blockquote>Ta note : « ${h(t.observation)} »</blockquote>`:''}</div>`).join('')}`:'<div class="mirror-trace"><strong>Tu n’avais classé aucun dossier.</strong><p>Ton absence de certitude faisait aussi partie de ton enquête.</p></div>'}<p class="mirror-foot">🔒 Bilan personnel. Cette photographie est figée : si tu modifies une fiche maintenant, le souvenir de ton vote ne change pas. Les faits de la soirée sont disponibles dans « L’affaire ».</p></section>`;
}
function carnet(){
 const step=ctx().phase,memories=unlockedMemories(session?.role,step);
 const flashs=personalFlashs(step);
 const flashHtml=flashs.length?`<div class="card"><h3>🕯️ Mes Flashs d’analyse</h3><p class="muted small">Ces questions dépendent de tes soupçons, de tes annotations et des faits déjà abordés. Elles ne désignent aucun coupable.</p>${flashs.map(f=>`<div class="analysis-flash"><strong>${h(f.tag)} · ${h(P[f.id])}</strong><p>${h(f.text)}</p>${f.reflect?`<p class="flash-reflection">${h(f.reflect)}</p>`:""}</div>`).join('')}</div>`:'';
 const s=selectedNotebookPerson,entry=normalizeNote(notes[s]),stat=entry.status;
 const badgeText={inconnu:'❔ Inconnu',suspect:'🔴 Suspect',verifier:'🟠 À vérifier',ecarte:'🟢 Écarté'};
 const followed=suspects.filter(p=>notes[p]?.status&&notes[p].status!=='inconnu').length;
 const header=`<div class="card"><div class="flex between"><div><div class="round">CARNET CONFIDENTIEL</div><h2>📋 Mon Cluedo</h2></div><span class="mini-tag">🔒 Privé</span></div><p class="muted small">Deux espaces différents : ce que tu sais personnellement, et ce que tu penses des autres.</p><p class="status-summary" data-note-sync role="status">${h(noteStatus)}</p><div class="cluedo-switch" role="tablist" aria-label="Espaces du carnet"><button type="button" id="cluedo-memories-tab" class="cluedo-switch-btn ${notebookView==='souvenirs'?'active':''}" data-cluedo-view="souvenirs" role="tab" aria-controls="cluedo-memories" aria-selected="${notebookView==='souvenirs'}">🧩 Mes souvenirs <span class="small">(${memories.length})</span></button><button type="button" id="cluedo-suspects-tab" class="cluedo-switch-btn ${notebookView==='dossiers'?'active':''}" data-cluedo-view="dossiers" role="tab" aria-controls="cluedo-suspects" aria-selected="${notebookView==='dossiers'}">🔎 Dossiers suspects</button></div><p class="cluedo-section-note">${notebookView==='souvenirs'?'Ces souvenirs appartiennent à ton personnage. Ils ne sont pas des preuves établies.':`${followed} suspect${followed>1?'s':''} classé${followed>1?'s':''} · Tes choix et tes notes sont personnels.`}</p></div>`;
 if(notebookView==='souvenirs'){
  const body=memories.length?memories.map((memory,i)=>`<div class="memory-entry"><span class="memory-entry-icon" aria-hidden="true">🧩</span><div><h4>Souvenir ${i+1}</h4><p>${h(memory.text)}</p></div></div>`).join(''):`<div class="memory-empty"><strong>Les souvenirs viendront…</strong>Écoute les premières confrontations. Tu retrouveras ici ce que ton personnage sait personnellement.</div>`;
  return header+mirrorPanel()+`<section class="card cluedo-panel" id="cluedo-memories" role="tabpanel" aria-labelledby="cluedo-memories-tab"><div class="cluedo-section-head"><div><h3>🧩 Mes souvenirs</h3><p class="muted small">${h(P[session.role])} · regard personnel</p></div><span class="mini-tag">🔒 Pour toi</span></div><div class="memory-intro"><strong>Ce dont tu te souviens</strong><p>Tu peux être sincère et te tromper sur un détail. Ces fragments ne sont pas partagés automatiquement avec les autres joueurs.</p></div>${body}<div class="memory-boundary">Ces souvenirs ne changent pas quand tu ouvres le dossier d’un suspect. Le dossier commun « L’affaire » rassemble séparément les témoignages connus.</div>${rumorCard(step)}</section>`;
 }
 const suspectsUi=`<section class="card cluedo-panel suspect-panel" id="cluedo-suspects" role="tabpanel" aria-labelledby="cluedo-suspects-tab"><div class="cluedo-section-head"><div><h3>🔎 Dossiers suspects</h3><p class="muted small">Choisis une personne et consigne tes impressions.</p></div><span class="mini-tag">8 profils</span></div><div class="person-grid">${suspects.map(p=>{const st=notes[p]?.status||'inconnu';return `<button type="button" class="person-tile ${p===s?'selected':''}" data-notebook-person="${p}" aria-pressed="${p===s}" aria-label="Dossier ${h(P[p])}, ${h(badgeText[st])}"><span class="emoji">${h(P[p].split(' ')[0])}</span><span class="name">${h(P[p].split(' ').slice(1).join(' '))}</span><span class="tiny">${h(badgeText[st])}</span></button>`}).join('')}</div><div class="suspect-detail" aria-label="Fiche de ${h(P[s])}"><h3>${h(P[s])}</h3><p class="subhead">Quel est ton avis sur cette personne ? Tu peux changer d’idée.</p><div class="status-picker" role="group" aria-label="Statut de ${h(P[s])}">${[['inconnu','❔ Inconnu'],['suspect','🔴 Suspect'],['verifier','🟠 À vérifier'],['ecarte','🟢 Écarté']].map(([v,label])=>`<button type="button" class="status-pill ${stat===v?'active':''}" data-status-value="${v}" aria-pressed="${stat===v}">${label}</button>`).join('')}</div><div class="tag-context">Notes rapides · tes impressions, jamais des preuves officielles.</div><div class="quick-tags" role="group" aria-label="Annotations sur ${h(P[s])}">${NOTE_TAGS.map(([id,label])=>`<button type="button" class="quick-tag" data-note-tag="${id}" aria-pressed="${entry.tags?.[id]===true}">${h(label)}</button>`).join('')}</div><label for="suspectNote">Mes observations sur ${h(P[s].split(' ').slice(1).join(' '))}</label><textarea id="suspectNote" data-note="${s}" data-field="text" maxlength="600" placeholder="Qu’as-tu vu, entendu ou déduit ?">${h(entry.text||'')}</textarea><span class="suspect-note-help">Tu peux utiliser les pastilles sans rien écrire. Sauvegarde automatique.</span></div></section>`;
 return header+mirrorPanel()+suspectsUi+testimonyLens(step)+flashHtml;
}
function mjUI(){
 const c=ctx(),step=c.phase,connected=Object.keys(c.members).length;
 return `<div class="card"><h2>👑 Charlotte — Dossier confidentiel</h2>
 <p><strong>${step<18?'Manche '+(Math.floor(step/6)+1)+'/3 · Confrontation '+(step+1)+'/18':step===18?'Verdicts en cours':'Enquête terminée'}</strong></p>
 <p>Le tribunal avance seul. Tu joues une suspecte, pas une régisseuse. Tu n’as aucun bouton de passage ni de révélation. Laisse le doute s’installer, sans accuser les personnes réelles.</p>
 <p>Participants : ${connected}/7. ${connected<7?'Attente des personnages manquants.':'Tous les personnages sont inscrits.'}</p>
 <p class="muted small">Chaque réponse ouvre une période de ${Math.round(DISCUSSION_MS/1000)} secondes pour la relance orale et les notes. Le prochain tour est déclenché automatiquement par les téléphones connectés.</p>
 <details><summary>📜 Vérité du scénario (confidentiel)</summary>
 <p><strong>20 h 25 :</strong> Nino prend une friandise. <strong>20 h 28 :</strong> Mathieu cache un sac de friandises fictif. <strong>20 h 29 :</strong> Charlotte déplace une décoration. <strong>Après 20 h 31 :</strong> James voit encore le coffret. <strong>20 h 32 :</strong> Norah rédige un message pour Matys près des jouets. <strong>20 h 33 :</strong> Matys et Nino sont à la cuisine ; Enola transporte le coffret vers les jouets ; Andreas entend un couvercle. <strong>20 h 35 :</strong> disparition constatée.</p>
 </details><details class="card"><summary>🧪 Nouvelle salle de test</summary><p class="muted small">L’ancienne salle et les carnets restent conservés.</p><button class="btn secondary" data-action="new-room">Créer une nouvelle salle</button></details></div>`;
}
function render(){showStatus();let html='';if(!session)html=loginUI();else html=menu()+(tab==='carnet'?carnet():tab==='affaire'?affaire():chapterPrelude(ctx().phase)+interrogation());if(error)html=`<div class="card error">⚠️ ${h(error)} <button class="btn secondary" data-action="dismiss">Fermer</button></div>`+html;root.innerHTML=html;updateCountdowns();}
root.addEventListener('change',e=>{
 if(e.target.name==='answer'){selectedAnswer=Number(e.target.value);render()}
 if(e.target.id==='player')selectedPlayer=e.target.value;
 if(e.target.id==='suspect')chosenSuspect=e.target.value;
 if(e.target.dataset.note){editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);if(e.target.dataset.field==='status')render();}
});
root.addEventListener('input',e=>{
 if(e.target.dataset.note)editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);
 if(e.target.id==='voteReason')voteArgument=e.target.value;
 if(e.target.id==='code')joinCode=e.target.value;
});

root.addEventListener('click',async e=>{
 const cluedoView=e.target.closest('[data-cluedo-view]');if(cluedoView){const next=cluedoView.dataset.cluedoView;if(next==='souvenirs'||next==='dossiers'){notebookView=next;render()}return;}
 const person=e.target.closest('[data-notebook-person]');if(person){selectedNotebookPerson=person.dataset.notebookPerson;render();return;}
 const status=e.target.closest('[data-status-value]');if(status){editNote(selectedNotebookPerson,'status',status.dataset.statusValue);render();return;}
 const tag=e.target.closest('[data-note-tag]');if(tag){editNote(selectedNotebookPerson,'tag',tag.dataset.noteTag);render();return;}
 const conviction=e.target.closest('[data-vote-source]');if(conviction){chosenSource=conviction.dataset.voteSource;render();return;}
 const votePerson=e.target.closest('[data-vote-person]');if(votePerson){chosenSuspect=votePerson.dataset.votePerson;render();return;}
 const choose=e.target.closest('[data-person]');if(choose){selectedPlayer=choose.dataset.person;render();return;}
 const el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}const action=el.dataset.action;if(pending)return;pending=true;error='';try{if(action==='dismiss'){}else if(action==='google')await hostLogin();else if(action==='host'){location.href=location.pathname+'?mj=1';return}else if(action==='create'||action==='new-room')await createRoom();else if(action==='leave')leaveRoom();else if(action==='join')await openRoom(joinCode,selectedPlayer);else if(action==='copy'){const url=location.origin+location.pathname+'?room='+session.code;await navigator.clipboard.writeText(url)}else if(action==='answer')await submitAnswer(ctx().phase,selectedAnswer);else if(action==='vote')await vote()}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async u=>{me=u;try{if(!u){await signInAnonymously(auth);return}const prior=JSON.parse(localStorage.getItem(sessionKey)||'null');if(prior&&!session){try{await openRoom(prior.code,prior.role)}catch(e){localStorage.removeItem(sessionKey);error='Ancienne session : '+e.message}}render()}catch(e){error=e.message;render()}});
</script></body></html>
