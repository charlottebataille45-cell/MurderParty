<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAUA4xdHZyh17ZkmDHe0gXqIrNZgEovcrw',
  authDomain: 'roubatvot-murder-party.firebaseapp.com',
  databaseURL: 'https://roubatvot-murder-party-default-rtdb.firebaseio.com',
  projectId: 'roubatvot-murder-party',
  storageBucket: 'roubatvot-murder-party.firebasestorage.app',
  messagingSenderId: '225363228130',
  appId: '1:225363228130:web:94c1839cbe0d542f86b5bb',
  measurementId: 'G-0C0DLB8E6C'
};
const configured = ['apiKey','authDomain','databaseURL','projectId','appId'].every(k =>
  typeof firebaseConfig[k] === 'string' && firebaseConfig[k].length > 5 && !firebaseConfig[k].startsWith('REMPLACER_')
);
let app, auth, db, bootPromise, unsubscribers = [], offsetMs = 0;
const players = ['james','nino','andreas','matys','mathieu'];
function stopListening() { unsubscribers.forEach(unsub => unsub()); unsubscribers = []; }
function pathFor(code, name) { return ref(db, `rooms/${code}/${name}`); }
async function boot() {
  if (!configured) throw new Error('Complète firebaseConfig dans le HTML avant la connexion.');
  if (!bootPromise) bootPromise = (async () => {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
    const user = await new Promise((resolve, reject) => {
      let unsub = () => {};
      unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); }, reject);
    });
    if (!user) await signInAnonymously(auth);
    if (!auth.currentUser) throw new Error('Authentification anonyme indisponible. Active-la dans Firebase Authentication.');
    return auth.currentUser.uid;
  })();
  await bootPromise;
  return auth.currentUser?.uid;
}
function currentHostAccount() {
  const user = auth?.currentUser;
  return user?.providerData?.some(p => p.providerId === 'google.com') ? {uid:user.uid,email:user.email,verified:user.emailVerified} : null;
}
async function signInHost() {
  if (!auth) throw new Error('Firebase n’est pas prêt.');
  const result = await signInWithPopup(auth,new GoogleAuthProvider());
  if (!result.user.emailVerified) throw new Error('Le compte Google doit avoir une adresse e-mail vérifiée.');
  return currentHostAccount();
}
async function switchToAnonymous() {
  await boot();
  await signOut(auth);
  await signInAnonymously(auth);
}
function randomRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}
async function createRoom() {
  const uid = await boot();
  if (!currentHostAccount()?.verified) throw new Error('Connecte-toi avec ton compte Google pour créer une salle MJ.');
  for (let i=0; i<6; i++) {
    const code = randomRoomCode();
    try {
      await set(pathFor(code,''), {
        hostUid: uid,
        createdAt: serverTimestamp(),
        players: { charlotte: { uid } },
        progress: {
          confession: false,
          hintAll: false,
          round: 1,
          stage: 0,
          clock: { running: false, elapsedMs: 0, startedAt: 0 }
        }
      });
      return {code, playerId:'charlotte', isHost:true};
    } catch (error) {
      // Collision (extrêmement improbable) : on réessaie seulement si la salle existe.
      try { if (!(await get(pathFor(code,'hostUid'))).exists()) throw error; }
      catch (checkError) { throw error; }
    }
  }
  throw new Error('Impossible de générer un code de salle libre.');
}
async function joinRoom(roomCode, playerId) {
  const uid = await boot();
  const code = String(roomCode || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) throw new Error('Le code de salle doit contenir huit caractères.');
  if (!players.includes(playerId) && playerId !== 'charlotte') throw new Error('Choisis un personnage valide.');
  const hostSnap = await get(pathFor(code,'hostUid'));
  if (!hostSnap.exists()) throw new Error('Salle introuvable. Vérifie les huit caractères.');
  const isHost = hostSnap.val() === uid;
  if (playerId === 'charlotte' && !currentHostAccount()?.verified) throw new Error('La connexion Google est obligatoire pour reprendre le rôle MJ.');
  if (playerId === 'charlotte' && !isHost) throw new Error('Seul le compte Google créateur peut rejoindre le rôle MJ.');
  if (playerId !== 'charlotte' && isHost) throw new Error('Le téléphone MJ doit conserver son propre profil.');
  const playerRef = pathFor(code, `players/${playerId}`);
  const prior = await get(playerRef);
  if (prior.exists() && prior.child('uid').val() !== uid) throw new Error('Ce personnage est déjà pris sur un autre téléphone.');
  if (!prior.exists()) await set(playerRef, {uid});
  return {code, playerId, isHost};
}
function listenRoom(session, callbacks) {
  stopListening();
  const { code, playerId, isHost } = session;
  unsubscribers.push(onValue(pathFor(code,'progress'), snap => callbacks.progress(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'players'), snap => callbacks.players(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,isHost?'votes':`votes/${playerId}`), snap => callbacks.votes(snap.val() || null), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'accusations'), snap => callbacks.accusations(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(ref(db,'.info/serverTimeOffset'), snap => {
    offsetMs = Number(snap.val()) || 0;
    callbacks.offset(offsetMs);
  }, callbacks.error));
}
async function publishSolved(code, level, playerId) {
  if (!players.includes(playerId) || players[level-1] !== playerId) throw new Error('Cette énigme ne correspond pas au joueur.');
  await set(pathFor(code,`progress/solved/${level}`),true);
}
async function forceSolve(code, id) {
  for (let i=1; i<=id; i++) await set(pathFor(code,`progress/solved/${i}`),true);
}
async function hostFlag(code,name,value) {
  if (!['confession','hintAll'].includes(name)) throw new Error('Commande MJ inconnue.');
  await set(pathFor(code,`progress/${name}`),Boolean(value));
}
async function hostClock(code, running, currentClock) {
  const now = Date.now()+offsetMs;
  const elapsed = Number(currentClock?.elapsedMs || 0);
  const started = Number(currentClock?.startedAt || 0);
  await set(pathFor(code,'progress/clock'),running
    ? {running:true,elapsedMs:elapsed,startedAt:serverTimestamp()}
    : {running:false,elapsedMs:elapsed+(currentClock?.running ? Math.max(0,now-started):0),startedAt:0});
}
async function hostStage(code, stage) {
  if (!Number.isInteger(stage) || stage < 0 || stage > 9) throw new Error('Phase invalide.');
  await set(pathFor(code,'progress/stage'), stage);
}
async function castAccusation(code, playerId, accusation) {
  if (!players.includes(playerId)) throw new Error('Seuls les enquêteurs peuvent accuser.');
  await set(pathFor(code,`accusations/${playerId}`), {
    suspect:accusation.suspect,
    indice:accusation.indice,
    submittedAt:serverTimestamp()
  });
}
async function castVote(code, playerId, vote) {
  await set(pathFor(code,`votes/${playerId}`), {
    historique:vote.historique,
    protocole:vote.protocole,
    intention:vote.intention,
    tresor:vote.tresor,
    preuve:vote.preuve,
    argument:vote.argument,
    submittedAt:serverTimestamp()
  });
}
async function resetRoom(code) {
  const roundSnap = await get(pathFor(code,'progress/round'));
  const nextRound = (Number(roundSnap.val()) || 1) + 1;
  await update(pathFor(code,'progress'), {
    solved:null,
    confession:false,
    hintAll:false,
    stage:0,
    round:nextRound,
    clock:{running:false,elapsedMs:0,startedAt:0}
  });
  await set(pathFor(code,'votes'),null);
  await set(pathFor(code,'accusations'),null);
}
window.RoubatvotFirebase = {configured, boot, createRoom, joinRoom, listenRoom, stopListening,
  publishSolved, forceSolve, hostFlag, hostClock, hostStage, castAccusation, castVote, resetRoom, currentHostAccount, signInHost, switchToAnonymous};
window.dispatchEvent(new Event('roubatvot-firebase-ready'));
</script>

 {stage:8,target:'James',question:'Qu’as-tu vu juste après la lettre ?',rule:'Il décrit une petite silhouette avec un objet vers les jouets, sans nommer Enola.'},
 {stage:8,target:'Andreas',question:'Quel bruit as-tu entendu vers 20 h 33 ?',rule:'Il parle du couvercle du côté des jouets.'}
];
const SUSPECT_OPTIONS = ['James','Nino','Andreas','Matys','Mathieu','Charlotte','Enola','Indéterminé'];
const ACCUSATION_CLUES = ['J-01','N-01','A-01','C-01','J-02','S-00','Indéterminé'];
const VOTE_QUESTIONS = [
 {key:'historique',title:'Que vaut l’accusation de 1897 ?',help:'Les documents historiques permettent-ils réellement d’accuser quelqu’un ?', options:[['Légende','C’est une légende non démontrée'],['Émile','Émile est coupable'],['Marguerite','Marguerite est coupable'],['Indéterminé','Les documents ne suffisent pas à trancher']]},
 {key:'protocole',title:'Qui a déclenché N0CT-7 ?',help:'Pense au test enregistré à 20 h 27, sans confondre déclenchement et vol.', options:[['Mathieu','Mathieu'],['Nino','Nino'],['Andreas','Andreas'],['Indéterminé','Impossible à établir']]},
 {key:'intention',title:'Le déclenchement était-il voulu ?',help:'Le lancement d’un test peut avoir des conséquences inconnues.', options:[['Accidentelle','Non, c’était involontaire'],['Volontaire','Oui, c’était délibéré'],['Indéterminée','Preuves insuffisantes']]},
 {key:'tresor',title:'Qui a déplacé le Trésor ?',help:'Croise les témoignages de 20 h 33. Tu peux aussi choisir de ne pas conclure.', options:SUSPECT_OPTIONS.map(v=>[v,v==='Indéterminé'?'Preuves insuffisantes':v])}
];
const VOTE_PROOFS = [['J-03+A-03','J-03 + A-03 : témoin et bruit'],['J-03+S-02','J-03 + S-02 : silhouette et doudou'],['N-01','N-01 : emballage'],['T-01+T-02','T-01 + T-02 : journaux et délai'],['N-02+A-02','N-02 + A-02 : alibi confirmé'],['M-01','M-01 : registre'],['Indéterminé','Preuves insuffisantes']];
const EMPTY_VOTE = {historique:'',protocole:'',intention:'',tresor:'',preuve:'',argument:''};
const FINAL_VERDICT = {historique:'Légende',protocole:'Mathieu',intention:'Accidentelle',tresor:'Enola'};
function voteLabel(question, value) { return question.options.find(([k]) => k === value)?.[1] || value || '—'; }
const STORE_KEY = 'roubatvot_refonte_v4';
const defaultProgress = { solvedLevels: [], margueriteUnlocked: false, votes: {...EMPTY_VOTE}, voteSubmitted: false, timerSeconds: 0, isTimerActive: false, stage:0, accusations:{}, puzzleStarts: {}, hintsAsked: {} };
function readGame() {
  try {
    const val = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    return val && typeof val === 'object' ? {...defaultProgress, ...val} : defaultProgress;
  } catch (_) { return defaultProgress; }
}
function safeSave(key, val) { try { localStorage.setItem(key, val); } catch (_) {} }
function normalizeCode(s) { return String(s || '').trim().toUpperCase().replace(/\s+/g,''); }

function App() {
  const [currentUser, setCurrentUser] = useState(null);
  const [activeTab, setActiveTab] = useState('histoire');
  const [game, setGame] = useState(readGame);
  const [now, setNow] = useState(Date.now());
  const [selectedWire, setSelectedWire] = useState(null);
  const [chairOpened, setChairOpened] = useState(false);
  const [digits, setDigits] = useState([1,9,0,0]);
  const [cipherDirection, setCipherDirection] = useState('');
  const [matysReading, setMatysReading] = useState('');
  const [mathieuChronology, setMathieuChronology] = useState('');
  const [mathieuDiagnosis, setMathieuDiagnosis] = useState('');
  const [puzzleInput, setPuzzleInput] = useState('');
  const [puzzleError, setPuzzleError] = useState('');
  const [relayInput, setRelayInput] = useState('');
  const [relayMessage, setRelayMessage] = useState('');
  const [mjForceHints, setMjForceHints] = useState(false);
  const [voteBusy, setVoteBusy] = useState(false);
  const [voteError, setVoteError] = useState('');

  // Salle Firebase : les énigmes restent inchangées ; seul l'état collectif est partagé.
  const [firebaseMode, setFirebaseMode] = useState('loading'); // loading, setup, ready, error
  const [firebaseError, setFirebaseError] = useState('');
  const [offlineOverride, setOfflineOverride] = useState(false);
  const [roomSession, setRoomSession] = useState(null);
  const lastRound = React.useRef(null);
  // Alerte ponctuelle à l'ouverture de la révélation (et lors d'une reprise de salle).
  const lastRevealState = React.useRef(false);
  const [remoteProgress, setRemoteProgress] = useState(null);
  const [roomPlayers, setRoomPlayers] = useState({});
  const [remoteVotes, setRemoteVotes] = useState(null);
  const [remoteAccusations, setRemoteAccusations] = useState({});
  const [accusation, setAccusation] = useState({suspect:'',indice:''});
  const [accusationError,setAccusationError] = useState('');
  const [clockOffset, setClockOffset] = useState(0);
  const [roomInput, setRoomInput] = useState(() => new URLSearchParams(location.search).get('room') || '');
  const [joinPlayer, setJoinPlayer] = useState('james');
  const [lobbyBusy, setLobbyBusy] = useState(false);
  const [roomError, setRoomError] = useState('');
  const mjEntry = new URLSearchParams(location.search).get('mj') === '1';
  const [googleHost, setGoogleHost] = useState(null);
  const networkMode = !offlineOverride && firebaseMode === 'ready';
  const sharedMode = networkMode && !!roomSession;
  const activeClock = sharedMode ? (remoteProgress?.clock || {}) : null;
  const stage = sharedMode ? Number(remoteProgress?.stage || 0) : Number(game.stage || 0);
  const accusations = sharedMode ? remoteAccusations : (game.accusations || {});
  const myAccusation = currentUser && !currentUser.isMJ ? accusations[currentUser.id] : null;
  const setStage = async next => {
    if (!currentUser?.isMJ) return;
    try {
      if (sharedMode) await window.RoubatvotFirebase.hostStage(roomSession.code,next);
      else setGame(g=>({...g,stage:next}));
    } catch(e) {setFirebaseError('Phase MJ : '+e.message);}
  };
  const sendAccusation = async () => {
    if (!currentUser || currentUser.isMJ || myAccusation || stage !== 4) return;
    if (!SUSPECT_OPTIONS.includes(accusation.suspect) || !ACCUSATION_CLUES.includes(accusation.indice)) {
      setAccusationError('Choisis un suspect ET un indice.'); return;
    }
    try {
      if(sharedMode) await window.RoubatvotFirebase.castAccusation(roomSession.code,currentUser.id,accusation);
      else setGame(g=>({...g,accusations:{...g.accusations,[currentUser.id]:{...accusation,submittedAt:Date.now()}}}));
      setAccusationError('');
    } catch(e){setAccusationError('Accusation non enregistrée : '+e.message);}
  };


  const solvedLevels = sharedMode ? Object.keys(remoteProgress?.solved || {}).filter(k => remoteProgress.solved[k]).map(Number).sort((a,b)=>a-b) : game.solvedLevels;
  const evidenceList = PUZZLES.filter(p => solvedLevels.includes(p.id)).map(p => p.rewardEvidence);
  const timerSeconds = sharedMode ? Math.floor((Number(activeClock?.elapsedMs || 0) + (activeClock?.running && Number(activeClock.startedAt) > 0 ? Math.max(0, now+clockOffset-Number(activeClock.startedAt)) : 0))/1000) : game.timerSeconds;
  const isTimerActive = sharedMode ? !!activeClock?.running : game.isTimerActive;
  const margueriteUnlocked = sharedMode ? !!remoteProgress?.confession : game.margueriteUnlocked;
  const votes = {...EMPTY_VOTE, ...(game.votes || {})};
  const voteSubmitted = sharedMode ? !!remoteVotes?.submittedAt : game.voteSubmitted;
  const voteComplete = VOTE_QUESTIONS.every(q => q.options.some(([key]) => key === votes[q.key])) && VOTE_PROOFS.some(([k])=>k===votes.preuve) && votes.argument.trim().length>=12 && votes.argument.trim().length<=220;
  const setIsTimerActive = val => { if (sharedMode) { window.RoubatvotFirebase.hostClock(roomSession.code, val, activeClock).catch(e=>setFirebaseError(e.message)); return; } setGame(g => ({...g,isTimerActive: typeof val === 'function' ? val(g.isTimerActive):val})); };
  const setMargueriteUnlocked = val => { if (sharedMode) {window.RoubatvotFirebase.hostFlag(roomSession.code,'confession',val).catch(e=>setFirebaseError(e.message)); return;} setGame(g=>({...g,margueriteUnlocked: typeof val === 'function' ? val(g.margueriteUnlocked):val})); };
  const setVotes = val => setGame(g => ({...g, votes: typeof val === 'function' ? val(g.votes) : val}));
  const submitVote = async () => {
    if (!voteComplete || voteSubmitted || voteBusy || currentUser?.isMJ) return;
    if (!margueriteUnlocked && (solvedLevels.length < PUZZLES.length || stage < 9)) {setVoteError('Attendez le lancement du tribunal final par Charlotte.'); return;}
    setVoteError(''); setVoteBusy(true);
    try {
      if (sharedMode) {
        await window.RoubatvotFirebase.castVote(roomSession.code,roomSession.playerId,votes);
        // La confirmation vient de l'écoute Firebase : remoteVotes.submittedAt.
      } else setGame(g => ({...g,voteSubmitted:true}));
    } catch(e) { setVoteError('Vote refusé par Firebase : '+e.message); }
    finally {setVoteBusy(false);}
  };

  // L'indicateur « confession » est déjà partagé par Firebase et protégé par les règles MJ.
  // Quand Charlotte le passe à true, chaque appareil ouvre la scène une seule fois.
  // Le joueur peut ensuite naviguer librement et retrouver la scène via « Révélation ».
  useEffect(() => {
    if (!currentUser) {
      lastRevealState.current = false;
      return;
    }
    if (margueriteUnlocked && !lastRevealState.current) {
      setActiveTab('reveal');
      // Au déclenchement, montrer le début de la scène même si le joueur était en bas de page.
      window.scrollTo(0, 0);
    } else if (!margueriteUnlocked && lastRevealState.current) {
      setActiveTab(tab => tab === 'reveal' ? 'dossier' : tab);
    }
    lastRevealState.current = margueriteUnlocked;
  }, [margueriteUnlocked, currentUser?.id, roomSession?.code]);

  useEffect(() => {
    let alive = true;
    const onReady = async () => {
      const api = window.RoubatvotFirebase;
      if (!api) return;
      if (!api.configured) { if (alive) setFirebaseMode('setup'); return; }
      try {
        await api.boot();
        if (!alive) return;
        setFirebaseMode('ready');
        setGoogleHost(api.currentHostAccount());
        try {
          const previous = JSON.parse(localStorage.getItem('roubatvot_room_session') || 'null');
          if (previous?.code && previous?.playerId) {
            const resumed = await api.joinRoom(previous.code,previous.playerId);
            if (alive) activateRoom(resumed);
          }
        } catch (error) { localStorage.removeItem('roubatvot_room_session'); if (alive) setRoomError('Ancienne session non récupérable : '+error.message); }
      } catch (e) { if (alive) {setFirebaseMode('error');setFirebaseError(e.message);} }
    };
    window.addEventListener('roubatvot-firebase-ready',onReady);
    if (window.RoubatvotFirebase) onReady();
    const delayed = setTimeout(() => { if(alive && !window.RoubatvotFirebase) {setFirebaseMode('error');setFirebaseError('Le module Firebase n’a pas chargé. Vérifie Internet ou les restrictions du navigateur.');}}, 8000);
    return () => {alive=false; clearTimeout(delayed); window.removeEventListener('roubatvot-firebase-ready',onReady);window.RoubatvotFirebase?.stopListening?.();};
  }, []);
  function activateRoom(session) {
    lastRound.current = null;
    let previousSession = null;
    try {previousSession = JSON.parse(localStorage.getItem('roubatvot_room_session') || 'null');} catch (_) {}
    if (previousSession?.code !== session.code) {
      setGame(g=>({...g,puzzleStarts:{},hintsAsked:{},votes:{...EMPTY_VOTE},voteSubmitted:false,accusations:{},stage:0}));
    }
    setRoomSession(session);
    setCurrentUser(PLAYERS[session.playerId]);
    setActiveTab('histoire');
    setRoomError('');
    setRemoteProgress(null);
    setRemoteVotes(null);
    setRemoteAccusations({});
    safeSave('roubatvot_room_session',JSON.stringify({code:session.code,playerId:session.playerId}));
    safeSave('roubatvot_user',session.playerId);
    window.RoubatvotFirebase.listenRoom(session,{
      progress: setRemoteProgress,
      players: setRoomPlayers,
      votes: setRemoteVotes,
      accusations: setRemoteAccusations,
      offset: setClockOffset,
      error: err => setFirebaseError('Synchronisation : '+err.message)
    });
  }
  const loginHost = async () => {
    setLobbyBusy(true); setRoomError('');
    try { setGoogleHost(await window.RoubatvotFirebase.signInHost()); }
    catch (e) { setRoomError('Connexion Google : '+e.message); }
    finally {setLobbyBusy(false);}
  };
  const changeHostAccount = async () => {
    setLobbyBusy(true); setRoomError('');
    try { await window.RoubatvotFirebase.switchToAnonymous(); setGoogleHost(null); }
    catch(e) {setRoomError(e.message);} finally{setLobbyBusy(false);}
  };
  const createNewRoom = async () => {
    setLobbyBusy(true);setRoomError('');
    try {activateRoom(await window.RoubatvotFirebase.createRoom());}
    catch(e){setRoomError(e.message);}finally{setLobbyBusy(false);}
  };
  const joinExistingRoom = async () => {
    setLobbyBusy(true);setRoomError('');
    try {activateRoom(await window.RoubatvotFirebase.joinRoom(roomInput,joinPlayer));}
    catch(e){setRoomError(e.message);}finally{setLobbyBusy(false);}
  };
  const leaveRoom = () => {
    if (!confirm('Quitter cette salle sur ce téléphone ? La progression collective reste enregistrée.')) return;
    window.RoubatvotFirebase.stopListening();
    localStorage.removeItem('roubatvot_room_session');
    localStorage.removeItem('roubatvot_user');
    setRoomSession(null);setCurrentUser(null);setRemoteProgress(null);setRemoteVotes(null);setRemoteAccusations({});setActiveTab('perso');
  };

  useEffect(() => {
    if (networkMode || firebaseMode === 'loading') return;
    try {
      const saved = localStorage.getItem('roubatvot_user');
      if (saved && PLAYERS[saved]) setCurrentUser(PLAYERS[saved]);
    } catch (_) {}
  }, [firebaseMode, offlineOverride]);
  useEffect(() => { if(!sharedMode) safeSave(STORE_KEY, JSON.stringify(game)); }, [game,sharedMode]);
  useEffect(() => {
    if (!sharedMode || !remoteProgress?.round) return;
    if (lastRound.current !== null && lastRound.current !== remoteProgress.round) {
      setGame(g => ({...g,puzzleStarts:{},hintsAsked:{},votes:{...EMPTY_VOTE},voteSubmitted:false,accusations:{},stage:0}));
      setSelectedWire(null);setChairOpened(false);setDigits([1,9,0,0]);
      setCipherDirection('');setMatysReading('');setMathieuChronology('');setMathieuDiagnosis('');
      setPuzzleInput('');setPuzzleError('');setAccusation({suspect:'',indice:''});
    }
    lastRound.current = remoteProgress.round;
  }, [sharedMode,remoteProgress?.round]);

  useEffect(() => {
    const interval = setInterval(() => {
      setNow(Date.now());
      if (!roomSession) setGame(g => g.isTimerActive ? {...g, timerSeconds: g.timerSeconds + 1} : g);
    },1000);
    return () => clearInterval(interval);
  }, [roomSession]);
  useEffect(() => {
    const onStorage = e => { if (e.key === STORE_KEY && e.newValue) setGame(readGame()); };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);
  useEffect(() => {
    if (!currentUser || currentUser.isMJ || activeTab !== 'my_puzzle') return;
    const p = PUZZLES.find(x => x.assignedTo === currentUser.id);
    if (!p || (p.id > 1 && !solvedLevels.includes(p.id-1)) || solvedLevels.includes(p.id)) return;
    if (!game.puzzleStarts[p.id]) setGame(g => ({...g, puzzleStarts: {...g.puzzleStarts, [p.id]: Date.now()}}));
  }, [currentUser, activeTab, solvedLevels, game.puzzleStarts]);

  useEffect(() => {
    // La MJ annonce la phase ; on ouvre la scène commune aux moments décisifs seulement.
    if (currentUser && [4,5,8,9].includes(stage) && !margueriteUnlocked) {
      setActiveTab(stage === 9 ? 'vote' : 'interro');
    }
  }, [stage,roomSession?.code]);

  const handleSelectUser = key => {
    safeSave('roubatvot_user', key);
    setCurrentUser(PLAYERS[key]);
    setActiveTab('histoire');
    setPuzzleInput(''); setPuzzleError(''); setRelayMessage('');
  };
  const handleLogout = () => {
    if (sharedMode) {leaveRoom();return;}
    if (confirm('Changer de profil ?')) {
      try { localStorage.removeItem('roubatvot_user'); } catch (_) {}
      setCurrentUser(null);
      setActiveTab('perso');
    }
  };
  const markSolved = async id => { if (sharedMode) await window.RoubatvotFirebase.publishSolved(roomSession.code,id,roomSession.playerId); else setGame(g=>({...g,solvedLevels:[...new Set([...g.solvedLevels,id])].sort((a,b)=>a-b)})); };
  const handleSolveMyPuzzle = async p => {
    if (p.id > 1 && !solvedLevels.includes(p.id-1)) { setPuzzleError('Attends le code-relais de l’enquêteur précédent.'); return; }
    const ans = normalizeCode(puzzleInput);
    let isCorrect = false;
    switch(p.id) {
      case 1: isCorrect = chairOpened && selectedWire === 4; break;
      case 2: isCorrect = cipherDirection === 'reculer' && ans === 'NODE-7'; break;
      case 3: isCorrect = digits.join('') === '2027'; break;
      case 4: isCorrect = ans === 'AMOUR' && matysReading === 'souvenir'; break;
      case 5: isCorrect = mathieuChronology === 'avant' && mathieuDiagnosis === 'incertain'; break;
    }
    if (isCorrect) { try {await markSolved(p.id);setPuzzleError('');setPuzzleInput('');}catch(e){setPuzzleError('La validation n’a pas été enregistrée : '+e.message);} }
    else { setPuzzleError('Il manque un élément ou la réponse ne correspond pas aux indices. Réessaie.'); }
  };
  // Une transmission orale explicite remplace la synchronisation serveur absente.
  const handleRelay = () => {
    if (sharedMode) {setRelayMessage('En mode Firebase, les validations arrivent automatiquement.');return;}
    const code = normalizeCode(relayInput);
    const p = PUZZLES.find(x => x.relayCode === code);
    if (!p) { setRelayMessage('Code de transmission non reconnu.'); return; }
    if (!currentUser?.isMJ) {
      const mine = PUZZLES.find(x => x.assignedTo === currentUser.id);
      if (!mine || p.id !== mine.id-1) {
        setRelayMessage('Entre seulement le code de l’enquêteur qui te précède.'); return;
      }
    }
    setGame(g => ({...g, solvedLevels: [...new Set([...g.solvedLevels, ...Array.from({length:p.id}, (_,i)=>i+1)])].sort((a,b)=>a-b)}));
    setRelayInput('');
    setRelayMessage(`Transmission reçue : étape ${p.id} ajoutée à ce téléphone.`);
  };
  const handleMJUnlock = id => {
    if (!currentUser?.isMJ) return;
    if (sharedMode) {window.RoubatvotFirebase.forceSolve(roomSession.code,id).catch(e=>setFirebaseError(e.message));return;}
    setGame(g => ({...g, solvedLevels: [...new Set([...g.solvedLevels, ...Array.from({length:id}, (_,i)=>i+1)])].sort((a,b)=>a-b)}));
  };
  const requestHint = id => setGame(g => ({...g, hintsAsked: {...g.hintsAsked, [id]: Math.min(2,(g.hintsAsked[id] || 0)+1)}}));
  const formatTime = sec => `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
  const promptCyber = `Tu es analyste en cybersécurité dans une enquête fictive de murder party. Le journal indique une session N0CT-7 à 20h27 et l'apparition d'une lettre à 20h31. Indique l'ordre des événements et l'écart temporel. Sépare faits, hypothèses et preuves manquantes. Peux-tu démontrer que la session a causé l'apparition de la lettre ? Ne conclus pas à une falsification sans preuve.`;
  const relayForm = <div className="bg-slate-900 border border-slate-700 rounded-xl p-3 space-y-2 text-xs">
    <p className="text-amber-400 font-semibold">📡 Recevoir une transmission</p>
    <p className="text-slate-400">Entre le code-relais annoncé par le joueur précédent. Sans serveur, chaque téléphone doit recevoir son code.</p>
    <div className="flex gap-2">
      <input aria-label="Code de transmission" value={relayInput} onChange={e=>setRelayInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')handleRelay();}} placeholder="Code-relais" className="min-w-0 flex-1 bg-slate-950 border border-slate-600 rounded-lg p-2 font-mono uppercase" />
      <button onClick={handleRelay} className="bg-amber-500 text-slate-950 font-bold rounded-lg px-3">Recevoir</button>
    </div>
    {relayMessage && <p role="status" className="text-slate-200">{relayMessage}</p>}
  </div>;
  return (
    <div className="min-h-screen flex flex-col justify-between max-w-md mx-auto bg-slate-950 border-x border-slate-900 shadow-2xl">
      
      {/* HEADER MOBILE */}
      <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 p-3">
        <div className="flex items-center justify-between">
          <div className="flex items-center space-x-2">
            <span className="text-xl">🕯️</span>
            <span className="font-cinzel text-xs font-bold text-amber-400">LES ROUBATVOT</span>
          </div>
          <div className="flex items-center space-x-2">
            <div className="font-mono text-xs bg-slate-950 px-2 py-1 rounded text-amber-400 border border-slate-800">
              {formatTime(timerSeconds)}
            </div>
            {currentUser && (
              <button onClick={handleLogout} className="text-slate-400 hover:text-rose-400 text-xs px-1" title={sharedMode ? "Quitter la salle" : "Changer de profil"}>
                <i className="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            )}
          </div>
        </div>

        {currentUser && (
          <nav className="flex gap-1 overflow-x-auto mt-2 pt-1 border-t border-slate-800 text-[11px]">
            <button onClick={() => setActiveTab('histoire')} className={`px-2.5 py-1.5 rounded whitespace-nowrap ${activeTab === 'histoire' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}`}>📖 Histoire</button>
            <button onClick={() => setActiveTab('perso')} className={`px-2.5 py-1.5 rounded whitespace-nowrap ${activeTab === 'perso' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}`}>Mon Profil</button>
            <button onClick={() => setActiveTab('my_puzzle')} className={`px-2.5 py-1.5 rounded whitespace-nowrap ${activeTab === 'my_puzzle' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}`}>Mon Énigme</button>
            <button onClick={() => setActiveTab('common')} className={`px-2.5 py-1.5 rounded whitespace-nowrap ${activeTab === 'common' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}`}>Écran Commun</button>

                    {isTimerActive ? '⏸ Pause Chrono' : '▶ Lancer Chrono'}
                  </button>
                  <button onClick={() => sharedMode ? window.RoubatvotFirebase.hostFlag(roomSession.code,'hintAll',!remoteProgress?.hintAll).catch(e=>setFirebaseError(e.message)) : setMjForceHints(!mjForceHints)} className="w-full bg-amber-900/60 text-amber-200 py-2 rounded font-semibold">
                    {(sharedMode ? remoteProgress?.hintAll : mjForceHints) ? 'Verrouiller Indices' : '💡 Forcer Indices pour Tous'}
                  </button>
                  <div className="rounded-lg border border-purple-800/70 bg-purple-950/25 p-3 space-y-2">
                    <p className="font-semibold text-purple-200">🎭 Révélation finale sur tous les téléphones</p>
                    <p className="text-[11px] text-slate-300">À lancer de préférence après les cinq énigmes et les cinq votes. L'écran final s'ouvre automatiquement chez les joueurs, et reste consultable ensuite.</p>
                    {sharedMode && <p className="text-[11px] text-slate-400">Énigmes : {solvedLevels.length}/5 · Votes : {Object.keys(remoteVotes || {}).length}/5</p>}
                    <button onClick={() => {
                      if (!margueriteUnlocked && sharedMode && (solvedLevels.length < 5 || stage < 9 || Object.keys(remoteVotes || {}).length < 5)) {
                        if (!confirm('Toutes les énigmes ou tous les votes ne sont pas terminés. Déclencher quand même la révélation finale ?')) return;
                      }
                      setMargueriteUnlocked(!margueriteUnlocked);
                    }} className="w-full bg-rose-900/70 text-rose-100 py-3 rounded-lg font-bold">
                      {margueriteUnlocked ? 'Masquer la révélation pour tous' : '🎬 Déclencher la révélation finale'}
                    </button>
                  </div>
                  <div className="pt-2 border-t border-slate-800 font-bold text-slate-300">{sharedMode ? 'Déblocage forcé pour tous :' : 'Déblocage forcé (sur cet appareil) :'}</div>
                  {PUZZLES.map(p => (
                    <div key={p.id} className="flex justify-between items-center bg-slate-950 p-2 rounded">
                      <span>Épreuve {p.id}</span>
                      <button disabled={solvedLevels.includes(p.id)} onClick={()=>handleMJUnlock(p.id)} className="bg-amber-500 disabled:bg-slate-800 text-slate-950 text-[10px] px-2 py-1 rounded font-bold">
                        {solvedLevels.includes(p.id) ? 'Validé' : 'Forcer'}
                      </button>
                    </div>
                  ))}
                  <button className="w-full bg-rose-950 border border-rose-700 text-rose-200 rounded py-2" onClick={()=>{
                    if(confirm(sharedMode ? 'Réinitialiser la partie POUR TOUS les joueurs ? Cette action efface les votes et les preuves partagés.' : 'Réinitialiser le jeu sur CE téléphone ? Cette action efface aussi les votes et preuves locaux.')) {
                      if (sharedMode) {window.RoubatvotFirebase.resetRoom(roomSession.code).catch(e=>setFirebaseError(e.message));} else setGame({...defaultProgress, votes: {...defaultProgress.votes}, puzzleStarts:{}, hintsAsked:{}});
                      setPuzzleInput(''); setRelayInput(''); setRelayMessage(''); setMjForceHints(false); setPuzzleError('');
                    }
                  }}>↺ {sharedMode ? 'Réinitialiser la salle entière' : 'Réinitialiser sur cet appareil'}</button>
                </div>
              </div>
            )}
          </>
        )}

      </main>

      <footer className="bg-slate-950 border-t border-slate-900 p-2 text-center text-[10px] text-slate-500">
        La Malédiction des Roubatvot &copy; 2026 - Ingré · {sharedMode ? "synchronisation Firebase" : "mode local avec codes-relais"}
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
