<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111e"><title>Le Tribunal des Roubatvot</title>
<style>
:root{color-scheme:dark;--bg:#0c101d;--panel:#171e31;--line:#33405a;--text:#eff3fa;--muted:#b0bbcf;--gold:#f4c972;--accent:#76cecf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b101e,#18142b);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}main{max-width:880px;margin:auto;padding:20px 14px 80px}header{text-align:center;padding:17px 0 8px}h1{font:700 clamp(25px,5vw,36px) Georgia,serif;color:var(--gold);margin:4px}h2{font-size:22px;margin:0 0 10px}h3{font-size:18px;margin:10px 0}p{margin:8px 0 14px}.hint,.muted{color:var(--muted)}.tag{display:inline-block;font-size:12px;border:1px solid #6c6983;border-radius:99px;padding:2px 9px;color:#eed5a1}.card{background:rgba(24,32,52,.97);border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 6px 20px #05061125}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{padding:12px 17px;border:0;background:var(--gold);color:#1b1b21;border-radius:9px;font-weight:800;cursor:pointer;font-size:15px}.btn.secondary{background:#2f425e;color:#fff}.btn.danger{background:#7a3941;color:white}.btn:disabled{opacity:.44;cursor:not-allowed}input,textarea,select{width:100%;padding:12px;background:#0d1425;color:white;border:1px solid #61718b;border-radius:8px;font:inherit}textarea{min-height:74px;resize:vertical}label{display:block;margin:10px 0 5px}.options{display:grid;gap:9px;margin:15px 0}.choice{display:block;background:#1d2943;padding:13px;border:1px solid #52617b;border-radius:11px;cursor:pointer}.choice input{width:auto;margin-right:10px}.choice:has(input:checked){border-color:var(--gold);background:#3e3646}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#25344b;color:white;border:1px solid #425774;border-radius:8px;padding:9px 13px;cursor:pointer}.tabs button.active{background:#ac8853;color:#130f10;font-weight:800}.quote{border-left:3px solid var(--gold);padding:9px 13px;background:#2c2b3e;font-size:18px}.timeline{display:flex;gap:6px;flex-wrap:wrap}.dot{font-size:12px;border-radius:99px;background:#30384e;padding:5px 10px}.dot.done{background:#25564d}.round{font-size:14px;color:var(--gold);font-weight:700}.private{border:1px dashed #bd9768;background:#2b2636;padding:12px;border-radius:10px}.note-row{border-top:1px solid var(--line);padding:13px 0}.note-row:first-of-type{border:0}.error{color:#ff9ca5}.ok{color:#a4e7c7}.hide{display:none}.small{font-size:13px}footer{text-align:center;color:#8d99b1;font-size:12px;margin-top:30px}.memory{border-left:3px solid #8a7fcb;background:#28263e;border-radius:7px;padding:12px;margin:12px 0}.rumor{border:1px solid #725e7c;background:#292336;border-radius:10px;padding:14px;margin:12px 0}.warning-line{color:#d8bfa4;font-size:13px}.reveal-stage{border:1px solid #8f765f;background:linear-gradient(135deg,#211c2d,#182231);padding:22px;border-radius:13px}.reveal-stage h2{font:700 clamp(23px,5vw,30px) Georgia,serif;color:var(--gold)}.reveal-stage .clockline{border-left:2px solid #d3b47a;padding:7px 13px;margin:9px 0}.reveal-stage .clockline .time{color:var(--gold);font-weight:bold}.reveal-stage .dramatic{font:italic 20px Georgia,serif;line-height:1.6}.quiet{letter-spacing:.08em;text-transform:uppercase;color:#decaa2}.flash-head{font-size:13px;letter-spacing:.04em}
.flash-reflection{font-size:12px;color:#b8dcd9;border-top:1px solid #4a5571;padding-top:8px;margin-top:8px}.analysis-flash{padding:12px;background:#20283d;border-left:3px solid #d9b36b;border-radius:7px;margin:9px 0}.analysis-flash p{margin:5px 0 0}.small{font-size:.85rem}
:root{--gold:#f5cb7b;--accent:#86d9d1;--line:#43516b}main{max-width:720px;padding:12px 12px 94px}header{padding:10px 0 2px}header h1{font-size:clamp(24px,6vw,33px)}.card{padding:16px;margin:12px 0;border-radius:17px}.tabs{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#0d1424ed;backdrop-filter:blur(10px);padding:8px 2px;border-radius:13px;gap:5px}.tabs button{padding:12px 5px;border-radius:10px;font-weight:700;font-size:clamp(12px,3vw,15px)}.card-title{color:var(--gold);margin:5px 0 10px}.step-track{height:7px;background:#26344e;border-radius:999px;overflow:hidden;margin:9px 0}.step-track-fill{height:100%;background:linear-gradient(90deg,#6db9bd,#efc471);border-radius:999px}.versus{display:flex;align-items:center;justify-content:center;gap:15px;margin:12px 0}.character{display:grid;place-items:center;gap:2px;min-width:90px;text-align:center}.character .avatar{font-size:32px}.versus .mid{color:#abb8cb}.big-question{font:600 clamp(19px,4.8vw,25px)/1.4 Georgia,serif;text-align:center;background:#242943;border-radius:13px;padding:20px 12px;margin:15px 0}.role-instruction{background:#22394d;padding:12px;border-radius:11px;color:#e2f4ff}.response-grid{display:grid;gap:10px;margin:12px 0}.response-card{border:1px solid #576986;border-radius:14px;background:#202a42;padding:15px;display:flex;gap:12px;cursor:pointer;align-items:flex-start;min-height:65px}.response-card.selected{border:2px solid var(--gold);background:#34304a}.response-card input{position:absolute;opacity:0;width:1px;height:1px}.response-letter{display:grid;place-items:center;background:#364b68;border-radius:10px;width:33px;height:33px;flex:0 0 33px;font-weight:800}.response-card.selected .response-letter{background:var(--gold);color:#171a24}.person-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.person-tile{background:#1d2c42;color:inherit;border:1px solid #485874;border-radius:13px;min-height:91px;padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center;font-size:12px;cursor:pointer;position:relative}.person-tile.selected{border:2px solid var(--gold);background:#3b3444}.person-tile .emoji{font-size:28px}.person-tile .tiny{font-size:10px;color:#c8d0e2}.person-tile .name{font-weight:750}.status-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.status-pill{color:#f4f4ff;background:#223048;padding:11px 4px;border:1px solid #52627b;border-radius:12px;font-size:13px;font-weight:700;min-height:44px;cursor:pointer}.status-pill.active{border:2px solid var(--gold);background:#403a43}.status-summary{margin:0;color:#b4c7d5;font-size:12px}.clue-line{border-left:3px solid #dcb669;background:#202b3e;padding:10px 12px;border-radius:7px;margin:10px 0}.clue-line .time{color:var(--gold);font-weight:800}.suspect-vote-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.suspect-vote-grid .person-tile{min-height:83px}.w100{width:100%}.mini-tag{display:inline-block;border-radius:20px;border:1px solid #698296;padding:4px 9px;font-size:12px}.scroll-tip{font-size:13px;color:#afc0d0}details.settings{margin:12px 0;color:#b9c6db}details.settings summary{cursor:pointer;padding:5px;font-size:12px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #eac27c;outline-offset:2px}@media(min-width:580px){.person-grid{grid-template-columns:repeat(4,1fr)}.status-picker{grid-template-columns:repeat(4,1fr)}}
.quick-tags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:9px 0 13px}.quick-tag{border:1px solid #60718b;background:#1d2b40;color:#eff3fa;border-radius:11px;padding:11px 7px;min-height:46px;font:600 13px/1.3 system-ui,sans-serif;text-align:center;cursor:pointer}.quick-tag[aria-pressed="true"]{border:2px solid var(--gold);background:#3e374a}.quick-tag:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.tag-context{margin:8px 0 0;font-size:12px;color:#b1bfd1}@media(min-width:580px){.quick-tags{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* V4.8 · Etape 2 — deux espaces autonomes du carnet */
.cluedo-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:5px;border-radius:15px;background:#111b2e;border:1px solid #354664;margin:15px 0 9px}
.cluedo-switch-btn{border:1px solid transparent;border-radius:11px;padding:13px 8px;min-height:53px;color:#c6d5e5;background:transparent;font:700 14px/1.35 system-ui,sans-serif;cursor:pointer}
.cluedo-switch-btn.active{background:#39435a;border-color:#e4c17f;color:#fff;box-shadow:inset 0 0 0 1px #d8b36d50}
.cluedo-switch-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cluedo-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;margin:13px 0 5px}
.cluedo-section-head h3{margin:0;font-size:19px;color:#f3d99c}
.cluedo-section-head p{margin:3px 0 7px}
.cluedo-panel{animation:panel-in .16s ease-out both}
@keyframes panel-in{from{opacity:.75;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.cluedo-panel{animation:none}}
.memory-intro{border-left:3px solid #b0a1e8;background:#27243b;border-radius:9px;padding:12px 13px;margin:10px 0 16px}
.memory-intro p{margin:3px 0;color:#d7cde9}
.memory-entry{display:flex;gap:12px;padding:15px 12px;margin:9px 0;background:#202b40;border:1px solid #495273;border-radius:12px}
.memory-entry-icon{font-size:20px;flex:0 0 25px}
.memory-entry h4{margin:0 0 5px;font-size:15px;color:#f4d99f}
.memory-entry p{margin:0;font-size:15px;line-height:1.55}
.memory-empty{padding:25px 15px;border:1px dashed #566788;border-radius:12px;text-align:center;color:#c2d1e5;margin:12px 0}
.memory-empty strong{display:block;color:#f3e4c4;margin-bottom:4px}
.memory-boundary{font-size:13px;color:#a9bdce;padding:10px 2px;border-top:1px solid #45516a;margin-top:12px}
.suspect-panel{margin-top:12px}
.suspect-panel .person-grid{margin:10px 0}
.suspect-detail{background:#19263c;border:1px solid #435875;border-radius:15px;padding:15px;margin-top:14px}
.suspect-detail h3{margin:0;color:#f0d398}
.suspect-detail .subhead{font-size:13px;color:#b7c6da;margin:4px 0 13px}
.person-tile[aria-pressed="true"]{box-shadow:inset 0 0 0 1px #dfb96655}
.suspect-note-help{display:block;color:#aebed1;font-size:12px;margin-top:6px}
.cluedo-section-note{font-size:12px;color:#b9c9da;margin:0 0 9px}
@media(max-width:360px){.cluedo-switch-btn{font-size:12px;padding:12px 4px}.person-tile .name{font-size:11px}.person-grid{gap:5px}}
/* V4.8 — Étape 4 : récit rétrospectif sans modifier les notes du joueur */
.mirror-panel{border:1px solid #9b805e;background:linear-gradient(145deg,#222337,#1c2c3d);padding:18px;border-radius:16px;margin:14px 0}
.mirror-panel h3{font:700 clamp(20px,4.5vw,26px) Georgia,serif;color:#f4d396;margin:7px 0}
.mirror-subtitle{font-size:13px;color:#b7cee1;line-height:1.5}
.mirror-verdict{padding:14px 12px;margin:13px 0;background:#2d2a40;border-left:3px solid #ecc67e;border-radius:8px}
.mirror-verdict strong{display:block;color:#fff;font-size:18px;margin:5px 0}
.mirror-verdict p{margin:7px 0 0}
.mirror-trace{padding:11px 13px;margin:10px 0;background:#1b3140;border:1px solid #3f6271;border-radius:10px}
.mirror-trace .label{font-weight:750;color:#e2c98f}
.mirror-trace p{margin:6px 0}
.mirror-trace blockquote{margin:8px 0 0;padding:8px 10px;border-left:2px solid #9fb4c8;color:#d4e0ed;font-size:14px}
.mirror-foot{font-size:12px;color:#c4d0dd;border-top:1px solid #546076;padding-top:10px;margin-top:13px}
@media(max-width:360px){.mirror-panel{padding:13px}}

/* V4.9 — Source déclarée de la conviction, jamais déduite des notes privées */
.conviction-choices{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:8px;margin:11px 0 17px}
.conviction-choice{width:100%;min-height:52px;background:#1c2c42;border:1px solid #576b87;border-radius:12px;color:#f3f7fe;display:flex;align-items:center;gap:10px;text-align:left;padding:11px 13px;font:600 14px/1.4 system-ui,sans-serif;cursor:pointer}
.conviction-choice[aria-pressed="true"]{background:#3a3647;border:2px solid #f4cb7e}
.conviction-choice .source-icon{font-size:19px;flex:0 0 27px}
.conviction-summary{font-size:13px;line-height:1.5;color:#ccdae7;background:#192b3a;border-left:3px solid #90cbc8;border-radius:7px;padding:10px 12px;margin:9px 0}
.conviction-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:15px 0}
.conviction-stat{padding:12px 10px;background:#28334a;border:1px solid #576786;border-radius:12px}
.conviction-stat strong{font-size:23px;color:#f5d48e;display:block}
.conviction-stat span{color:#d0dcf0;font-size:12px}
.conviction-voice{background:#242d42;border-left:3px solid #81c6c8;padding:10px 12px;margin:8px 0;border-radius:7px}
.conviction-voice strong{color:#f4d99f}
.conviction-voice small{display:block;color:#bcd1e3;margin-top:4px}
.collective-reflection{padding:12px 14px;background:#293041;border:1px solid #8a7764;border-radius:12px;margin:14px 0}
.collective-reflection h3{margin:2px 0 7px;font:700 19px Georgia,serif;color:#f5cf86}
@media(min-width:580px){.conviction-choices{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* V4.9.2 — onglets de navigation finale sans compteur ni boutons superflus */
.final-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 13px}
.final-step{min-height:58px;padding:9px 5px;border:1px solid #53667e;border-radius:11px;background:#1b2b41;color:#d5e1f0;cursor:pointer;font:700 12px/1.35 system-ui,sans-serif;text-align:center}
.final-step[aria-current="step"]{border:2px solid var(--gold);background:#453b46;color:#fff}
.final-step:focus-visible{outline:3px solid #f0ca7f;outline-offset:2px}
[data-final-panel]{scroll-margin-top:76px}
@media(max-width:360px){.final-step{font-size:11px;padding:8px 3px}}

/* V4.9.3 : les commandes de salle restent accessibles, sans bandeau permanent. */
.room-settings{margin:28px 0 0;padding:12px 2px 0;border-top:1px solid #3c4660;color:var(--muted)}
.room-settings>summary{padding:9px 3px;font-size:12px;cursor:pointer}
.room-settings-content{padding:10px 4px 6px}
.room-settings-meta{display:flex;flex-direction:column;gap:2px;margin:0 0 13px}
.room-settings-meta strong{color:var(--text);font-size:14px}
.room-settings-actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.room-settings-actions .btn{font-size:13px;padding:10px 12px}
.room-settings-content>details>summary{cursor:pointer;padding:9px 3px}

/* Synopsis V16.6 : extension minimale des vues de pilotage et du dénouement. */
.host-panel{border-color:#8b7656;background:#20273b}.host-form{border:1px solid #465877;border-radius:12px;padding:13px;margin:12px 0}.host-form textarea{min-height:62px}.host-form .btn{margin:5px 0 12px}
.status-list{margin:10px 0}.status-line{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #344359;padding:8px 0}.btn-small{font-size:12px;padding:7px 8px}.chapter-title{padding:8px 14px}.chapter-title .round{margin:0}
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0}.plan>div{border:1px solid #66738a;border-radius:12px;background:#26334d;text-align:center;padding:20px 5px;min-height:80px}.plan>div:nth-child(4){border-style:dashed;border-color:#dfbf7f}
.clockline{border-left:2px solid #d3b47a;padding:8px 13px;margin:12px 0}.influence-edge{animation:panel-in .3s ease-out both}.celebration{text-align:center;padding:40px 22px}
@media(min-width:850px){.host-panel{margin-top:18px}}@media(prefers-reduced-motion:reduce){.influence-edge{animation:none}}
.tabs.tabs-host{grid-template-columns:repeat(4,minmax(0,1fr))}.tabs.tabs-host button{font-size:clamp(11px,2.6vw,14px)}
/* Écran d'accueil de la salle — sans information sur le dénouement */
.convocation{position:relative;overflow:hidden;text-align:center;border:1px solid #9f8156;background:radial-gradient(ellipse at 50% 0%,#343248 0%,#1a2335 52%,#141c2b 100%);padding:clamp(24px,5vw,44px) 20px;margin-top:20px}
.convocation::before{content:'⚖';position:absolute;right:-12px;top:-30px;font-size:150px;color:#f2c87910;pointer-events:none}
.convocation .eyebrow{color:#edd19e;letter-spacing:.16em;font-size:12px;font-weight:800;text-transform:uppercase}
.convocation h2{font:700 clamp(28px,6vw,42px) Georgia,serif;line-height:1.15;color:#f6d69b;margin:14px auto;max-width:580px}
.convocation .case-name{color:#e4eaf3;font:italic clamp(18px,4vw,23px) Georgia,serif}
.convocation .intro-story{font-size:clamp(17px,3.6vw,20px);line-height:1.65;max-width:580px;margin:24px auto}
.convocation .identity{border:1px solid #766a65;border-radius:12px;padding:16px;margin:20px auto;background:#121b30a8;max-width:460px}
.convocation .identity strong{display:block;font:700 22px Georgia,serif;color:#f5d49a}
.convocation .status-await{display:inline-block;padding:10px 16px;border-radius:99px;border:1px solid #9c815c;color:#f5daa9;background:#352d36;font-weight:800;margin:10px auto}
.host-ready .people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0}
.host-ready .person-status{padding:10px;border-radius:9px;background:#1a2d3f;border:1px solid #405571;font-size:14px}
.host-ready .person-status.present{border-color:#648977;background:#1b3835}
.host-ready h2{color:var(--gold);font:700 26px Georgia,serif}
@media(min-width:580px){.host-ready .people{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* V16.8 — votes par boutons tactiles, sans menus déroulants */
.vote-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 16px}
.vote-choice{color:var(--text);background:#22314b;border:1px solid #596d89;border-radius:11px;padding:12px 8px;min-height:48px;font-weight:650;cursor:pointer;text-align:center;line-height:1.3}
.vote-choice[aria-pressed="true"]{border:2px solid var(--gold);background:#463c48;color:#fff}
.vote-choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.vote-optional{border:1px solid #46566c;border-radius:11px;padding:12px;margin:13px 0}
.vote-optional summary{font-weight:650;cursor:pointer;color:#e2d5b9;padding:4px}
.vote-form textarea{min-height:67px}
@media(min-width:520px){.vote-choice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* V16.9 — prologue immersif jusqu'au lancement privé par la cheffe d’enquête */
.prologue{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prologue .prologue-seal{font:normal 48px Georgia,serif;color:#f0cf8e;text-shadow:0 0 22px #eac77766;margin:12px auto 0}
.prologue-story{max-width:570px;margin:15px auto 8px;border-top:1px solid #6c625e;border-bottom:1px solid #6c625e;padding:18px 12px;font:18px/1.7 Georgia,serif}
.prologue-story p{margin:0 auto 14px}.prologue-story p:last-child{margin-bottom:0}
.prologue-oath{font-style:italic;color:#f8dda7}
.prologue .status-await{margin-top:22px}
.sound-controls{width:100%;max-width:520px;margin:18px auto 0;padding-top:10px}
.sound-toggle{max-width:360px;width:100%}
@media(prefers-reduced-motion:no-preference){.prologue-seal{animation:seal-fade 3s ease-in-out infinite alternate}@keyframes seal-fade{from{opacity:.6;filter:brightness(.8)}to{opacity:1;filter:brightness(1.2)}}}
@media(max-width:450px){.prologue{min-height:65vh}.prologue-story{font-size:16px}.prologue .identity{padding:11px}}
/* V16.11 — Chronologie individuelle, vote collectif de zone et final court. */
.initial-recap .suspicion-tally{display:grid;gap:12px;margin:18px 0}
.suspicion-row{padding:12px 13px;border:1px solid #52627b;border-radius:11px;background:#202b42}
.suspicion-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.suspicion-label span{font-weight:750;color:#f5ce81;white-space:nowrap}
.suspicion-meter{height:7px;border-radius:99px;background:#3c4760;overflow:hidden}
.suspicion-meter span{display:block;height:100%;background:linear-gradient(90deg,#82cbce,#f5ce81);border-radius:inherit}
.vote-transition{border:1px solid #947a5b;background:linear-gradient(140deg,#2c283e,#172e42)}
.vote-transition h2{color:var(--gold);font:700 26px Georgia,serif}
.debate-stage h2{margin-bottom:16px}

.timeline-puzzle .time-pick-grid{display:grid;gap:9px;margin:12px 0}
.timeline-puzzle .time-pick{display:block;text-align:left;background:#22314b;color:#eff3fa;border:1px solid #596d89;border-radius:12px;padding:12px;font:600 15px/1.5 system-ui,sans-serif;cursor:pointer}
.timeline-puzzle .time-pick:disabled{opacity:.45;cursor:default}

function tone(freq,delay,duration,volume=0.02,type='sine'){
 if(!host()||screenMode||!soundOn)return;
 const ctx=getSoundContext();if(!ctx||ctx.state==='closed')return;

}

function carnet(){const n=normalizedNote(notes[selectedPerson]),statusNames={inconnu:'❔ Inconnu',suspect:'🔴 Suspect',verifier:'🟠 À vérifier',ecarte:'🟢 Écarté'};const readonly=nowStage()>=STAGE.FIN;let header=`<div class="card"><div class="round">CARNET CONFIDENTIEL</div><h2>📋 Mon Cluedo</h2><p class="small" data-note-sync>${h(noteStatus)}</p><div class="cluedo-switch"><button class="cluedo-switch-btn ${notebookView==='dossiers'?'active':''}" data-cluedo-view="dossiers">🔎 Dossiers suspects</button><button class="cluedo-switch-btn ${notebookView==='souvenirs'?'active':''}" data-cluedo-view="souvenirs">🧩 Mes souvenirs</button></div></div>`;
 if(notebookView==='souvenirs')return header+personalMirror()+`<div class="card"><h3>Ce dont ton personnage se souvient</h3>${(MEMORIES[session.role]||[]).map((t,i)=>`<div class="memory-entry"><strong>${i+1}.</strong><p>${h(t)}</p></div>`).join('')}</div>`;
 return header+personalMirror()+`<div class="card"><div class="person-grid">${suspects.map(id=>`<button type="button" class="person-tile ${selectedPerson===id?'selected':''}" data-person-note="${id}"><span class="emoji">${h(fullName(id).split(' ')[0])}</span><span class="name">${h(fullName(id).split(' ').slice(1).join(' '))}</span><span class="tiny">${h(statusNames[normalizedNote(notes[id]).status])}</span></button>`).join('')}</div><h3>${h(fullName(selectedPerson))}</h3><div class="status-picker">${noteStatuses.map(id=>`<button type="button" class="status-pill ${n.status===id?'active':''}" data-status="${id}" ${readonly?'disabled':''}>${h(statusNames[id])}</button>`).join('')}</div><div class="quick-tags">${NOTE_TAGS.map(([id,label])=>`<button type="button" class="quick-tag" data-tag="${id}" aria-pressed="${n.tags[id]}" ${readonly?'disabled':''}>${h(label)}</button>`).join('')}</div><label>Mes notes privées<textarea id="noteText" data-note="${selectedPerson}" maxlength="600" ${readonly?'readonly':''}>${h(n.text)}</textarea></label><p class="small muted">Ce carnet est à toi : garde tes idées secrètes !</p><div class="analysis-flash"><strong>🕯️ Question pour ton enquête</strong><p>Qu’as-tu réellement vu ou entendu concernant ${h(fullName(selectedPerson))}, et qu’as-tu seulement déduit ?</p></div></div>`}
function pilotage(){if(!host())return '';const st=nowStage(),readiness=(round)=>`<div class="status-list">${investigators.map(id=>{const complete=room?.[round==='initial'?'votesInitial':'votesFinal']?.[id];const absent=room.absences?.[round]?.[id];return `<div class="status-line"><span>${h(fullName(id))}</span><span>${complete?'✓ Voté':absent?'– Abstention':`<button type="button" class="btn secondary btn-small" data-absent="${round}:${id}">Marquer absent</button>`}</span></div>`}).join('')}</div>`;
 let html=`<section class="card host-panel"><div class="round">MODE PILOTAGE · CONFIDENTIEL</div><h2>${h(stageName(st))}</h2><p class="small muted">🎛️ À toi de mener l’enquête !</p>${soundPanel()}`;
 if(st===-1){const online=connectedInvestigators();return `<section class="card host-panel host-ready"><div class="round">ESPACE CHEFFE D’ENQUÊTE · CONFIDENTIEL</div><h2>Ouvrir l’audience</h2><p>Le prologue est affiché sur les téléphones. Attends la connexion des six enquêteurs avant de lancer le jeu.</p><div class="people">${investigators.map(id=>`<div class="person-status ${connected(id)?'present':''}">${connected(id)?'✓ Connecté':'◌ En attente'}<br>${h(fullName(id))}</div>`).join('')}</div><p role="status"><strong>${online}/6 enquêteurs connectés</strong>${online===6?' — Tout le monde est là.':' — Lancement en attente des participants.'}</p><button class="btn w100" data-action="start-game" ${online===6&&hostPresenceReady?'':'disabled'}>⚖️ Ouvrir l’audience et lancer l’enquête</button>${soundPanel()}</section>`}
 if(st<18){
  const q=Q[st],ans=room.currentAnswer,last=latestTestimony(q.id);
  html+=`<div class="mj-question"><p><strong>🎤 ${h(fullName(q.asker))}</strong> interroge <strong>${h(fullName(q.target))}</strong></p><p class="mj-main-question">« ${h(q.question)} »</p></div>`;
  if(!ans)html+='<p class="role-instruction">⏳ Le joueur choisit sa réplique sur son téléphone.</p>';
  else html+=`<div class="host-form"><p class="ok"><strong>✅ Réponse choisie par ${h(fullName(q.target))}</strong></p><p class="mj-selected-reply">« ${h(q.answers[ans.value])} »</p><label for="spoken">✏️ Réponse à annoncer <span class="small muted">(préremplie, modifiable si besoin)</span><textarea id="spoken" maxlength="1000">${h(transcriptDraft||q.answers[ans.value])}</textarea></label><details data-keep="mj-followups"><summary>➕ Ajouter une question ou une précision (facultatif)</summary><label>Précision 1<textarea id="followup1" maxlength="500">${h(followup1Draft)}</textarea></label><label>Précision 2<textarea id="followup2" maxlength="500">${h(followup2Draft)}</textarea></label></details><button class="btn w100" data-action="save-testimony">✅ Valider et passer à la question suivante →</button></div>`;
  if(last)html+='<p class="ok">✅ Réponse déjà consignée. Tu peux poursuivre.</p>';
 }
  if(st===STAGE.RECAP)html+=room.profileView?'<p>Le bilan des profils est affiché sur les écrans. Lance la confrontation quand les joueurs l’ont consulté.</p>':'<p>Les soupçons anonymes sont affichés. Affiche ensuite le bilan des profils avant la confrontation.</p><button class="btn secondary w100" data-action="show-profiles">🎭 Afficher le bilan des profils</button>';
 if(st===STAGE.RECAP||st===STAGE.DISCUSS)html+=`<div class="profile-host-controls"><h3>Affichage des profils</h3><div class="profile-mode-choices"><button type="button" class="btn secondary" data-profile-mode="anonymous" aria-pressed="${room.profileMode!=='named'}">🎭 Anonyme</button><button type="button" class="btn secondary" data-profile-mode="named" aria-pressed="${room.profileMode==='named'}">👥 Avec les prénoms</button></div></div>`;
 if(st===STAGE.DISCUSS)html+=`<p>Place au débat ! Les joueurs peuvent revoir les premiers soupçons et le bilan des profils.</p>`;
 if(st===STAGE.CLOCK)html+=`<p>Les joueurs utilisent 🕰️ L’affaire pour classer trois événements.</p><div class="status-list">${investigators.map(id=>`<div class="status-line">${h(fullName(id))}<span>${room.timelineAnswers?.[id]?'✓ Ordre trouvé':'En cours'}</span></div>`).join('')}</div>`;
 if(st===STAGE.ZONE)html+=`<p>Vote simple sur la zone, un choix par enquêteur.</p><div class="status-list">${investigators.map(id=>`<div class="status-line">${h(fullName(id))}<span>${room.zoneVotes?.[id]?'✓ Zone choisie':'En attente'}</span></div>`).join('')}</div>${!room.zoneResult?`<button type="button" class="btn w100" data-action="reveal-zone" ${investigators.every(id=>room.zoneVotes?.[id])?'':'disabled'}>🧸 Révéler le lieu et autoriser la recherche</button>`:'<p>✓ Le lieu et l’autorisation d’ouvrir le coffret sont affichés sur tous les écrans.</p>'}`;
 if(st===STAGE.FIRST||st===STAGE.SECOND)html+=`<h3>${st===STAGE.FIRST?'Premiers votes':'Votes finaux'}</h3>${readiness(st===STAGE.FIRST?'initial':'final')}`;
 if(st===STAGE.INFLUENCES){const total=influenceEdges().length;html+=`<p>Influences révélées : ${room.progress?.influenceIndex||0}/${total}</p><button class="btn secondary" data-action="next-influence" ${(room.progress?.influenceIndex||0)>=total?'disabled':''}>Afficher le lien suivant</button>`}
 if(st===STAGE.FIN){html+=`<p>🎃 Bravo ! Le Trésor est retrouvé.</p><p class="small">Quand la fête est terminée, ferme la salle. Tous les joueurs retourneront à l’accueil et les données de partie seront effacées.</p><button class="btn danger w100" data-action="delete">🚪 Fermer la salle pour tout le monde</button>`}
 else{let ready=st<18?Boolean(room.currentAnswer&&latestTestimony(st+1)?.validated):st===STAGE.FIRST?allFinished('initial'):st===STAGE.SECOND?allFinished('final'):st===STAGE.CLOCK?investigators.every(id=>room.timelineAnswers?.[id]):st===STAGE.ZONE?Boolean(room.zoneResult):st===STAGE.RECAP?Boolean(room.profileView):true;html+=`${st>=18?`<button class="btn w100" data-action="advance" ${ready?'':'disabled'}>${st===STAGE.FIRST?'Afficher les premiers soupçons':st===STAGE.RECAP?'Ouvrir la confrontation':st===STAGE.DISCUSS?'Passer au dernier vote':st===STAGE.SECOND?'Révéler les deux votes':st===STAGE.ZONE?'Terminer la soirée':st===STAGE.CLOCK?'Révéler qui a déplacé le coffret':'Continuer'} →</button>`:''}`}
 
 return html+'</section>'}
function prologue({shared=false}={}){
 const status=`<div class="status-await" role="status">🕯️ L’audience n’a pas encore commencé</div>`;
 const online=connectedInvestigators();
 return `<section class="card convocation prologue" aria-label="Prologue de l'enquête">
  <div class="eyebrow">Halloween 2026 · Ingré</div>
  <div class="prologue-seal" aria-hidden="true">⚖️</div>
  <h2>Le Tribunal des Roubatvot</h2>
  <p class="case-name">L'affaire du Trésor de la Chouquette</p>
  <div class="prologue-story">
   <p>Ce soir, le Trésor de la Chouquette a disparu de la table.</p>
   <p>À 20 h 31, les lumières se sont éteintes. Dans cette maison, chacun possède un souvenir. Certains cachent un secret. Mais personne ne détient toute l'histoire.</p>
   <p class="prologue-oath">Dix-huit interrogations vous attendent. Écoutez. Doutez. Interrogez les certitudes.</p>
  </div>
  ${!shared?`<div class="identity"><span class="small muted">Convocation personnelle au Tribunal</span><strong>${h(fullName(session.role))}</strong><p class="small">Vos souvenirs restent privés. Gardez-les jusqu'aux interrogations.</p></div>`:''}
  ${status}
  <p class="small muted">${online}/6 enquêteurs connectés. La cheffe d’enquête ouvrira l'audience quand tout le monde sera présent.</p>
 </section>`;
}

function screen(){const st=nowStage();if(st<0)return prologue({shared:true});if(st===STAGE.RECAP)return room.profileView?profileRecapHTML():initialRecap();if(st===STAGE.DISCUSS)return confrontation();if(st===STAGE.SECOND)return `<section class="card reveal-stage"><div class="quiet">DERNIÈRE DÉCISION</div><h2>Les débats sont clos.</h2><p>Chaque enquêteur choisit maintenant son dernier suspect, en secret.</p><p class="dramatic">Le Tribunal rendra bientôt son verdict.</p></section>`;if(st<STAGE.VERDICTS)return `<section class="card reveal-stage"><h2>🕯️ Le Tribunal des Roubatvot</h2><p>L’enquête est en cours. Écoutez les témoignages et confrontez vos hypothèses.</p></section>`;return stagesHTML()}
function settings(){const connected=Object.keys(room?.players||{}).length;return `<details class="settings room-settings"><summary>Paramètres de la salle</summary><div class="room-settings-content"><p>Salle : <strong>${h(session.code)}</strong> · ${connected}/7 participants · ${h(stageName(nowStage()))}</p><div class="invite-share"><label for="inviteUrl">Lien d’invitation de la tribu</label><input id="inviteUrl" type="text" readonly value="${h(joinURL())}" aria-label="Lien complet d’invitation" /><div class="invite-actions"><button type="button" class="btn secondary" data-action="copy-url">🔗 Copier le lien d’invitation</button><span class="small" role="status">${h(copyNotice)}</span></div></div><div class="room-settings-actions"><button class="btn secondary" data-action="leave">${host()?'🚪 Fermer la salle pour tous':'Quitter la salle'}</button>${host()?'<button class="btn secondary" data-action="open-screen">Ouvrir l’écran commun</button>':''}</div>${host()?`<details><summary>Vérité du scénario (confidentielle)</summary>${FACTS.map(([t,x])=>`<p><strong>${h(t)}</strong> — ${h(x)}</p>`).join('')}<p>La vérité sur Enola précède le vote sur la zone et la recherche physique du coffret. La lumière de 20 h 31 était programmée, indépendante. Aucun suspect n’a volé le coffret.</p></details>`:''}</div></details>`}
function login(){const mj=qs.get('mj')==='1';return `<div class="card"><h2>Entrer dans l’enquête</h2>${mj?`<p>Tu diriges le Tribunal. L’enquête commence à ton signal.</p>${me&&!me.isAnonymous?`<button class="btn" data-action="create">Créer la salle</button>`:`<button class="btn" data-action="google">Connexion Google</button>`}`:`<label>Code de salle<input id="code" maxlength="8" value="${h(joinCode)}" placeholder="ABCDEFGH"></label><p>Choisis ton personnage :</p><div class="person-grid">${investigators.map(id=>`<button type="button" class="person-tile ${selectedPlayer===id?'selected':''}" data-join-person="${id}">${h(fullName(id))}</button>`).join('')}</div><button class="btn" data-action="join">Rejoindre l’enquête</button><button class="btn secondary" data-action="host-link">🕵️ Accès Cheffe d’enquête</button>`}</div>`}
function nav(){const sections=[['enquete','🎭 Tribunal'],['carnet','📋 Mon Cluedo'],['affaire','🕰️ L’affaire']];if(host())sections.push(['mj','🕵️ Cheffe d’enquête']);return `<div class="tabs ${host()?'tabs-host':''}">${sections.map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>`}
function welcome(){return prologue()}
function renderSafely(){if(!document.activeElement||!document.activeElement.matches('textarea,input,select'))render();else noteSync()}
function render(){
 for(const x of root.querySelectorAll('details[data-keep]')){if(x.open)expanded.add(x.dataset.keep);else expanded.delete(x.dataset.keep)}
 const current=nowStage();let body;
 if(!session)body=login();
 else if(screenMode)body=screen();
 else if(current<0)body=(host()?pilotage():welcome())+settings();
 else body=nav()+(tab==='mj'&&host()?pilotage():tab==='carnet'?carnet():tab==='affaire'?affaire():`<section class="card chapter-title"><div class="round">${h(stageName(current))}</div></section>`+(current<18?interrogation():stageContent()))+settings();
 if(notice)body=`<div class="card ok" role="status">${h(notice)}</div>`+body;
 if(error)body=`<div class="card error" role="alert">⚠️ ${h(error)} <button type="button" class="btn secondary" data-action="clear-error">Fermer</button></div>`+body;
 root.innerHTML=body;
  syncSound();
 for(const el of root.querySelectorAll('details[data-keep]'))el.open=expanded.has(el.dataset.keep);
}
root.addEventListener('input',e=>{if(e.target.dataset.note)editNote(e.target.dataset.note,'text',e.target.value);if(e.target.id==='voteReason')voteArgument=e.target.value;if(e.target.id==='influenceReason')influenceReason=e.target.value;if(e.target.id==='code')joinCode=e.target.value;if(e.target.id==='spoken')transcriptDraft=e.target.value;if(e.target.id==='followup1')followup1Draft=e.target.value;if(e.target.id==='followup2')followup2Draft=e.target.value;});
root.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}if(el.dataset.soundCue){playSoundCue(el.dataset.soundCue);return}if(el.dataset.replay){replayIndex=Math.max(0,Math.min(FACTS.length-1,replayIndex+(el.dataset.replay==='next'?1:-1)));render();return}if(el.dataset.finalView){finalView=Number(el.dataset.finalView);render();return}if(el.dataset.cluedoView){notebookView=el.dataset.cluedoView;render();return}if(el.dataset.personNote){selectedPerson=el.dataset.personNote;render();return}if(el.dataset.joinPerson){selectedPlayer=el.dataset.joinPerson;render();return}if(el.dataset.answerChoice!==undefined){const i=Number(el.dataset.answerChoice);const q=Q[nowStage()];if(q?.target===session?.role&&!room.currentAnswer&&Number.isInteger(i)&&i>=0&&i<3){selectedAnswer=i;render()}return}if(el.dataset.status){editNote(selectedPerson,'status',el.dataset.status);render();return}if(el.dataset.tag){editNote(selectedPerson,'tag',el.dataset.tag);render();return}if(el.dataset.votePerson){chosenSuspect=el.dataset.votePerson;render();return}if(el.dataset.voteSource){chosenSource=chosenSource===el.dataset.voteSource?'':el.dataset.voteSource;render();return}if(el.dataset.timePick){if(nowStage()===STAGE.CLOCK&&!room.timelineAnswers?.[session.role]&&TIME_SEQUENCE.some(x=>x.id===el.dataset.timePick)&&!timelineDraft.includes(el.dataset.timePick)){timelineDraft.push(el.dataset.timePick);timelineError='';render()}return}if(el.dataset.zonePick){if(nowStage()===STAGE.ZONE&&!room.zoneVotes?.[session.role]&&ZONES.some(([id])=>id===el.dataset.zonePick)){zoneChoice=el.dataset.zonePick;render()}return}if(el.dataset.influencer){influencedBy=influencedBy===el.dataset.influencer?'':el.dataset.influencer;if(!investigators.includes(influencedBy))influenceReason='';render();return}if(el.dataset.profileMode){if(pending)return;pending=true;try{await setProfileMode(el.dataset.profileMode)}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}return}if(el.dataset.absent){const [round,id]=el.dataset.absent.split(':');if(confirm(`Confirmer l’abstention exceptionnelle de ${fullName(id)} ?`)){try{await markAbsent(id,round)}catch(ex){error=ex.message;render()}}return}const action=el.dataset.action;if(!action||pending)return;pending=true;error='';try{switch(action){case'clear-error':break;case'google':await hostLogin();break;case'create':await createRoom();break;case'join':await openRoom(joinCode,selectedPlayer);break;case'host-link':location.assign(location.pathname+'?mj=1');return;case'leave':if(host())await deleteSession();else clearSession('Tu as quitté la salle.');break;case'copy-url':await copyInviteURL();break;case'open-screen':window.open(`${location.origin}${location.pathname}?screen=1&room=${encodeURIComponent(session.code)}`,'_blank');break;case'answer':await submitAnswer();break;case'save-testimony':await saveTestimony();break;case'start-game':await startGame();break;case'sound-toggle':toggleSound();break;case'show-profiles':await showProfiles();break;case'vote-initial':await vote(false);break;case'vote-final':await vote(true);break;case'advance':await advance();break;case'next-influence':await nextInfluence();break;case'toggle-recap':debateShowRecap=!debateShowRecap;break;case'timeline-undo':timelineDraft.pop();timelineError='';break;case'timeline-check':await checkTimeline();break;case'zone-vote':await castZone();break;case'reveal-zone':await revealZone();break;case'delete':await deleteSession();break;default:break}}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async user=>{me=user;try{if(!user){await signInAnonymously(auth);return}const old=screenMode&&qs.get('room')?{code:qs.get('room'),role:'charlotte'}:JSON.parse(sessionStorage.getItem(sessionKey)||'null');if(old&&!session){try{await openRoom(old.code,old.role)}catch(ex){sessionStorage.removeItem(sessionKey);error='Ancienne session indisponible. Retour à l’accueil.'}}render()}catch(ex){error=ex.message;render()}});

</script></body></html>
