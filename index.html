 const flashs=personalFlashs(step);
 const flashHtml=flashs.length?`<div class="card" style="border-color:#997e43"><h3>🕯️ Notes d’analyse automatiques</h3><p class="muted small">Des pistes personnelles adaptées à TES soupçons, pas un verdict ni des faits supplémentaires.</p>${flashs.map(f=>`<div class="analysis-flash"><strong>${h(f.tag)} · ${P[f.id]}</strong><p>${h(f.text)}</p></div>`).join('')}</div>`:'';
 return rumorCard(step)+(personalMemory(step)?`<div class="memory"><strong>🧩 Souvenir personnel — fragment incomplet</strong><p>${h(personalMemory(step).text)}</p><p class="warning-line">Il s’agit de ton point de vue, pas d’un témoignage certifié.</p></div>`:'')+testimonyLens(step)+flashHtml+`<div class="card"><h2>📋 Mon carnet Cluedo</h2><p class="muted">Notes privées par joueur, enregistrées dans Firebase. Une copie locale protège les saisies en cas de coupure.</p><p class="small ok" data-note-sync>${h(noteStatus)}</p>${suspects.map(p=>{const x=notes[p]||{};return `<div class="note-row"><strong>${P[p]}</strong><label>Mon avis<select data-note="${p}" data-field="status">${[['inconnu','❔ Inconnu'],['suspect','🔴 Suspect'],['verifier','🟠 À vérifier'],['ecarte','🟢 Écarté']].map(([v,l])=>`<option value="${v}" ${(x.status||'inconnu')===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Mes observations<textarea data-note="${p}" data-field="text" maxlength="600" placeholder="Témoignage, alibi, contradiction…">${h(x.text||'')}</textarea></label></div>`}).join('')}<p class="small muted">Seul ce personnage peut lire et modifier son carnet. Les flashs ne sont pas partagés.</p></div>`;
}
function mjUI(){
 const c=ctx(),step=c.phase,connected=Object.keys(c.members).length;
 return `<div class="card"><h2>👑 Charlotte — Dossier confidentiel</h2>
 <p><strong>${step<15?'Manche '+(Math.floor(step/5)+1)+'/3 · Confrontation '+(step+1)+'/15':step===15?'Verdicts en cours':'Enquête terminée'}</strong></p>
 <p>Le tribunal avance seul. Tu joues une suspecte, pas une régisseuse. Tu n’as aucun bouton de passage ni de révélation. Laisse le doute s’installer, sans accuser les personnes réelles.</p>
 <p>Participants : ${connected}/6. ${connected<6?'Attente des personnages manquants.':'Tous les personnages sont inscrits.'}</p>
 <p class="muted small">Chaque réponse ouvre une période de ${Math.round(DISCUSSION_MS/1000)} secondes pour la relance orale et les notes. Le prochain tour est déclenché automatiquement par les téléphones connectés.</p>
 <details><summary>📜 Vérité du scénario (confidentiel)</summary>
 <p><strong>20 h 25 :</strong> Nino prend une friandise. <strong>20 h 28 :</strong> Mathieu cache un sac de bonbons. <strong>20 h 29 :</strong> Charlotte déplace une décoration. <strong>Après 20 h 31 :</strong> James voit encore le coffret. <strong>20 h 33 :</strong> Matys et Nino sont à la cuisine ; Enola transporte le coffret vers les jouets ; Andreas entend un couvercle. <strong>20 h 35 :</strong> disparition constatée.</p>
 </details><details class="card"><summary>🧪 Nouvelle salle de test</summary><p class="muted small">L’ancienne salle et les carnets restent conservés.</p><button class="btn secondary" data-action="new-room">Créer une nouvelle salle</button></details></div>`;
}
function render(){showStatus();let html='';if(!session)html=loginUI();else html=menu()+(tab==='carnet'?carnet():tab==='mj'?mjUI():chapterPrelude(ctx().phase)+interrogation());if(error)html=`<div class="card error">⚠️ ${h(error)} <button class="btn secondary" data-action="dismiss">Fermer</button></div>`+html;root.innerHTML=html;updateCountdowns();}
root.addEventListener('change',e=>{
 if(e.target.name==='answer'){selectedAnswer=Number(e.target.value);render()}
 if(e.target.id==='player')selectedPlayer=e.target.value;
 if(e.target.id==='suspect')chosenSuspect=e.target.value;
 if(e.target.dataset.note){editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);if(e.target.dataset.field==='status')render();}
});
root.addEventListener('input',e=>{
 if(e.target.dataset.note)editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);
 if(e.target.id==='voteReason')voteArgument=e.target.value;
 if(e.target.id==='code')joinCode=e.target.value;
});

root.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}const action=el.dataset.action;if(pending)return;pending=true;error='';try{if(action==='dismiss'){}else if(action==='google')await hostLogin();else if(action==='host'){location.href=location.pathname+'?mj=1';return}else if(action==='create'||action==='new-room')await createRoom();else if(action==='leave')leaveRoom();else if(action==='join')await openRoom(joinCode,selectedPlayer);else if(action==='copy'){const url=location.origin+location.pathname+'?room='+session.code;await navigator.clipboard.writeText(url)}else if(action==='answer')await submitAnswer(ctx().phase,selectedAnswer);else if(action==='vote')await vote()}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async u=>{me=u;try{if(!u){await signInAnonymously(auth);return}const prior=JSON.parse(localStorage.getItem(sessionKey)||'null');if(prior&&!session){try{await openRoom(prior.code,prior.role)}catch(e){localStorage.removeItem(sessionKey);error='Ancienne session : '+e.message}}render()}catch(e){error=e.message;render()}});
</script></body></html>
