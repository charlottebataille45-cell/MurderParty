const Q=[{"id":1,"round":1,"asker":"james","target":"charlotte","question":"Je t'ai vue près de la table avant la disparition. Qu'est-ce que tu y faisais exactement ?","answers":["Je terminais les décorations. Il fallait bien que quelqu'un prépare cette soirée.","J'étais près de la table, oui. Mais être près du coffret ne signifie pas l'avoir touché.","Tu m'as vue près de la table, James. As-tu vu mes mains sur le coffret ?"],"relances":["Quelle décoration préparais-tu à ce moment-là ?","Qu'as-tu réellement touché sur la table ?","Tu ne réponds pas : quel objet as-tu déplacé ?"],"truth":"Charlotte s'est approchée de la table à 20 h 29 pour une décoration ; elle n'a pas déplacé le coffret."},{"id":2,"round":1,"asker":"nino","target":"andreas","question":"Comment sais-tu que je suis passé près de la table ? Tu regardais le Trésor ou tu me surveillais ?","answers":["Je t'ai vu passer vers 20 h 25. Je regardais ce qui se passait autour de moi.","J'ai remarqué ton passage vers 20 h 25 parce que tu semblais vouloir rester discret.","Je t'ai aperçu près de la table vers 20 h 25. Pourquoi veux-tu tant savoir si je te regardais ?"],"relances":["M'as-tu vu toucher le coffret, ou seulement passer ?","Ton impression vient de quel geste précis ?","Réponds : que m'as-tu vu faire exactement ?"],"truth":"Andreas a remarqué Nino près de la table vers 20 h 25 ; il ne l'a pas vu déplacer le Trésor."},{"id":3,"round":1,"asker":"andreas","target":"nino","question":"Tu étais près de la table à 20 h 25. Qu'est-ce que tu cherchais ?","answers":["Une friandise ! Je n'ai pas volé un coffret pour un bonbon.","J'avais faim, je suis venu prendre une friandise. Et alors ?","L'emballage était à moi. Mais qui a touché au coffret après ?"],"relances":["Pourquoi voulais-tu éviter qu'on parle de la friandise ?","As-tu laissé l'emballage près de la table ?","Tu admets la friandise : as-tu vu quelqu'un d'autre près du coffret ?"],"truth":"Nino a pris une friandise à 20 h 25 et laissé un emballage ; cela ne prouve aucun déplacement du coffret."},{"id":4,"round":1,"asker":"matys","target":"james","question":"Tu dis que le coffret était encore là après le message. Tu l'as vraiment vu ?","answers":["Je l'ai vu après le message de 20 h 31. Je m'en souviens bien.","Oui, je l'ai vu après 20 h 31, mais je ne le surveillais pas tout le temps.","Je sais qu'il était là après 20 h 31, pas à quelle seconde il a disparu."],"relances":["Qui peut confirmer ce dernier moment ?","Pendant combien de temps as-tu cessé de regarder la table ?","Quelle est ta dernière observation certaine, sans supposition ?"],"truth":"James a vu le coffret après 20 h 31 ; il n'a pas surveillé chaque seconde suivante."},{"id":5,"round":1,"asker":"mathieu","target":"norah","question":"Je t'ai vue accroupie près des jouets vers 20 h 32. Pourquoi as-tu caché ton téléphone en me voyant ?","answers":["J'écrivais quelque chose de personnel sur mon téléphone. Oui, près des jouets.","J'étais près des jouets avec mon téléphone ; ça ne t'autorise pas à lire mon écran.","Oui, j'ai verrouillé mon téléphone près des jouets. Mais toi, pourquoi surveillais-tu mes mains ?"],"relances":["Un message à qui, si ce n'est pas trop personnel ?","As-tu touché autre chose que ton téléphone ?","Pourquoi ce secret, juste à ce moment-là ?"],"truth":"Norah était accroupie près des jouets avec son téléphone vers 20 h 32 ; elle préparait un message privé pour Matys."},{"id":6,"round":1,"asker":"norah","target":"mathieu","question":"Mathieu, je t'ai vu cacher quelque chose sous ton pull vers 20 h 28. Pourquoi ?","answers":["C'était une surprise que je voulais garder secrète. Oui, je cachais un objet.","Oui, j'avais un objet sous mon pull. Rien ne prouve que c'était le coffret.","J'ai caché quelque chose à 20 h 28. Toi aussi, tu as caché ton écran, non ?"],"relances":["Quelle surprise voulait-on nous cacher ?","Peut-on savoir au moins quelle forme avait cet objet ?","C'est toi qu'on interroge : que cachais-tu exactement ?"],"truth":"Mathieu cachait un sac de friandises sous son pull vers 20 h 28, pas le coffret."},{"id":7,"round":2,"asker":"james","target":"mathieu","question":"J'ai moi aussi vu quelque chose sous ton pull. Pourquoi refuses-tu de dire ce que c'était ?","answers":["C'était une surprise. Je ne voulais pas la gâcher en la montrant tout de suite.","Tu as vu un objet sous mon pull, James. Tu n'as pas vu le coffret.","Tu m'as vu porter quelque chose vers 20 h 28. Qu'as-tu réellement vu ensuite ?"],"relances":["Quelle surprise peut justifier tant de secret ?","Que contenait l'objet que tu cachais ?","Pourquoi ne pas expliquer directement ce que tu transportais ?"],"truth":"James n'a pas identifié l'objet caché par Mathieu ; Mathieu protégeait une surprise de friandises."},{"id":8,"round":2,"asker":"nino","target":"norah","question":"Norah, tu étais près des jouets avec ton téléphone. Pourquoi as-tu caché ton écran à cet endroit ?","answers":["C'était personnel. Je rédigeais un message sur mon téléphone.","Je préparais quelque chose sur mon téléphone. Ça n'avait rien à voir avec le Trésor.","Je cachais mon écran pour garder une surprise. Est-ce devenu interdit ?"],"relances":["Si tu ne veux pas tout lire, à qui était adressé le message ?","Qu'est-ce que tu peux nous confirmer sans révéler le contenu ?","As-tu seulement gardé ton téléphone en main ?"],"truth":"Norah préparait sur son téléphone un message destiné à Matys, près des jouets. Sa présence reste à examiner."},{"id":9,"round":2,"asker":"andreas","target":"matys","question":"Matys, où étais-tu vers 20 h 33, au moment où le coffret n'était plus surveillé ?","answers":["À la cuisine avec Nino. On discutait, c'est tout.","J'étais avec Nino près de la cuisine. Lui aussi peut le confirmer.","Nino et moi étions ensemble à la cuisine ; je sais que vous allez penser qu'on se couvre."],"relances":["Qu'est-ce qui te permet de dater cette conversation ?","Existe-t-il quelqu'un d'autre qui vous a vus ?","Pourquoi avoir attendu cette question pour le dire ?"],"truth":"Matys et Nino étaient ensemble près de la cuisine vers 20 h 33, sans alibi complet sur tout l'intervalle."},{"id":10,"round":2,"asker":"matys","target":"andreas","question":"Andreas, peux-tu confirmer nous avoir vus, Nino et moi, près de la cuisine vers 20 h 33 ?","answers":["Oui, je vous ai vus tous les deux à la cuisine vers 20 h 33.","Oui, vous étiez ensemble vers 20 h 33 ; je n'ai pas surveillé vos mouvements ensuite.","Je confirme vous avoir vus ensemble. Je ne peux pas dire ce que vous avez fait avant."],"relances":["Cette observation prouve-t-elle notre innocence pendant quatre minutes ?","À quel moment as-tu cessé de nous voir ?","Peux-tu confirmer uniquement ce que tu as personnellement observé ?"],"truth":"Andreas corrobore indépendamment la présence de Matys et Nino près de la cuisine vers 20 h 33."},{"id":11,"round":2,"asker":"mathieu","target":"james","question":"James, tu as remarqué plusieurs personnes. Mais toi, où étais-tu vers 20 h 33 ?","answers":["Dans le salon, près du passage vers les jouets. Je regardais de ce côté.","J'étais dans le salon, pas loin du coin des jouets. Pourquoi ?","Dans le salon, je regardais vers les jouets. Personne ne m'a demandé mon alibi avant."],"relances":["Quelqu'un peut-il confirmer ton emplacement ?","Pourquoi te trouvais-tu si près des jouets ?","Qui pourrait dire ce que tu faisais à cet instant ?"],"truth":"James était dans le salon près du passage vers les jouets ; il ne dispose pas d'alibi indépendant complet."},{"id":12,"round":2,"asker":"norah","target":"charlotte","question":"Pendant que tout le monde regardait le message d'Halloween, qui surveillait le Trésor ?","answers":["Personne n'avait cette mission. Nous fêtions Halloween, pas une exposition de musée.","Je pensais que quelqu'un remarquerait forcément si le coffret bougeait.","Nous étions occupés. Je ne peux pas certifier chaque déplacement dans la pièce."],"relances":["Qui a vu le coffret en dernier, alors ?","Qu'est-ce qui te permettait d'être aussi sûre ?","Pouvons-nous distinguer ce que tu sais de ce que tu supposes ?"],"truth":"Personne ne surveillait le coffret sans interruption ; le message faisait partie des animations prévues."},{"id":13,"round":3,"asker":"james","target":"norah","question":"Norah, tu étais près des jouets et tu cachais ton téléphone. Qu'y faisais-tu vraiment ?","answers":["Je rédigeais un message sur mon téléphone. Je ne portais pas le coffret.","J'avais mon téléphone en main, pas une boîte. Pourquoi mélanges-tu les deux ?","J'étais accroupie avec mon téléphone. Je pensais que personne n'y prêterait attention."],"relances":["Quelqu'un a-t-il vu ce que tu tenais en main ?","Ton téléphone était-il la seule chose que tu touchais ?","Pourquoi avoir choisi le coin des jouets pour écrire ?"],"truth":"Norah avait son téléphone et préparait un message personnel. Aucune observation ne l'identifie avec le coffret."},{"id":14,"round":3,"asker":"nino","target":"james","question":"James, tu regardais vers les jouets. Qu'as-tu réellement aperçu autour de 20 h 33 ?","answers":["Une petite silhouette transportait quelque chose vers les jouets. Je n'ai pas vu son visage.","Quelqu'un qui me paraissait petit portait un objet. Je ne sais pas ce que c'était.","J'ai vu une petite silhouette avec quelque chose. J'ai cru qu'on jouait simplement."],"relances":["James, comment sais-tu que ce n'était pas quelqu'un accroupi ?","Est-ce que la taille te paraît certaine ou estimée ?","Pourquoi n'as-tu pas parlé plus tôt de cette silhouette ?"],"truth":"James affirme avoir vu une silhouette de petite taille avec un objet vers les jouets vers 20 h 33 ; il n'a reconnu personne. James étant lui-même petit, sa fiabilité peut être interrogée sans l'accuser à tort."},{"id":15,"round":3,"asker":"andreas","target":"mathieu","question":"Mathieu, tu as caché un objet sous ton pull à 20 h 28. Peux-tu enfin expliquer ce que c'était ?","answers":["C'était un sac de friandises pour la soirée. J'en gardais la surprise.","Un sac de bonbons. L'énorme théorie du coffret sous mon pull ne tenait pas debout.","Oui, un sac de friandises. Je vous ai laissés imaginer pire en restant vague."],"relances":["Un sac à 20 h 28 explique-t-il aussi tes déplacements après 20 h 31 ?","Peux-tu dater le moment où tu as rangé ce sac ?","Pourquoi n'as-tu pas donné cette explication plus tôt ?"],"truth":"Le sac de Mathieu contient des friandises. Une fiche numérique fictive du jeu le confirme, sans l'innocenter sur toute la soirée."},{"id":16,"round":3,"asker":"matys","target":"norah","question":"Norah, le message que tu préparais près des jouets… à qui était-il destiné ?","answers":["À toi, Matys. Je préparais une petite surprise à t'envoyer après le jeu.","C'était un brouillon pour toi, Matys. Je ne voulais pas que les autres le lisent.","À toi, évidemment. Et tout le monde vient de découvrir ma surprise."],"relances":["Tu peux confirmer l'heure du brouillon sans nous montrer tes messages réels ?","Pourquoi avoir caché cet écran à Mathieu ?","Le jeu peut-il montrer le brouillon fictif pour départager les versions ?"],"truth":"Le brouillon numérique fictif, daté de 20 h 32, est destiné à Matys. Aucun accès à un vrai téléphone ou SMS n'est requis."},{"id":17,"round":3,"asker":"mathieu","target":"nino","question":"Nino, on t'a vu à la table à 20 h 25, puis à la cuisine vers 20 h 33. Que prouvent ces deux faits ?","answers":["J'ai pris une friandise, puis parlé avec Matys. Pas un coffret.","On m'a vu près de la table, pas transporter le Trésor.","Vous avez passé du temps sur mon emballage ; qui a observé le coffret lui-même ?"],"relances":["Est-ce que quelqu'un t'a vu prendre le coffret ?","Que peux-tu établir sur la période entre ces deux moments ?","Quelle observation sur le coffret avons-nous oubliée ?"],"truth":"Nino a pris une friandise à 20 h 25 et était avec Matys vers 20 h 33. Il reste un intervalle insuffisamment observé."},{"id":18,"round":3,"asker":"norah","target":"andreas","question":"Vers 20 h 33, as-tu entendu quelque chose en direction du coin des jouets ?","answers":["Oui. Un bruit de couvercle venait du coin des jouets. Je n'ai vu personne.","Quelque chose s'est refermé là-bas. J'ai pensé à une boîte de jouets.","J'ai entendu un bruit semblable à un couvercle près des jouets. Impossible d'identifier l'objet."],"relances":["As-tu vu qui produisait ce bruit ?","Peux-tu certifier que c'était le coffret ?","Qu'est-ce que tu peux attester, sans inventer l'auteur ?"],"truth":"Andreas a entendu un bruit compatible avec un couvercle près des jouets vers 20 h 33, sans voir la personne ni l'objet."}];

let notes={},dirty=new Set(),notesReady=false,noteTimers=new Map(),noteInFlight=new Set(),noteFailures=new Map(),noteStatus='Connexion au carnet…';

function restoreNotes(){

async function syncNote(who){

  await set(path(writingSession.code,`notebooks/${writingSession.role}/${who}`),{...payload,updatedAt:serverTimestamp()});
  if(session!==writingSession)return;
  noteFailures.delete(who);

   const failures=(noteFailures.get(who)||0)+1;noteFailures.set(who,failures);
   retryMs=Math.min(30000,1500*2**Math.min(failures-1,5));

// Progression totalement autonome : chaque appareil peut prendre le relais.
// Une transaction garantit qu'aucune confrontation n'est sautée, même si six téléphones tentent ensemble.
async function tryAutoProgress(){
 if(!session||!room||autoBusy||!me)return;
 const step=ctx().phase;
 if(step>=19){void ensureRevealStamp();return;}
 if(serverNow()-autoLastAttempt<4500)return;
 if(step<18){
  const q=Q[step];
  if(![q.asker,q.target].includes(session.role))return;
  const a=room.answers?.[q.id];
  if(!a||!Number.isFinite(a.submittedAt)||serverNow()<a.submittedAt+DISCUSSION_MS)return;
 } else if(session.role!=='charlotte'){
  // Chaque joueur connaît son vote ; le dernier vote envoyé déclenche également une tentative.
  if(!room.votes?.[session.role])return;
 }
 autoBusy=true;autoLastAttempt=serverNow();
 try{
  await runTransaction(path(session.code,'progress/step'),current=>current===step?step+1:undefined,{applyLocally:false});
 }catch(e){/* Tous les votes ne sont pas encore présents, ou une autre transaction a avancé. Réessai discret. */}
 finally{autoBusy=false}
}

 return `<div class="card reveal-stage"><div class="quiet">Chapitre IV · Le Trésor</div><h2>Le déplacement était réel. Le vol, non.</h2><p class="dramatic">Pendant que les grandes personnes comparaient leurs secrets, Enola a emporté le coffret vers ses jouets. Pour jouer. Tout simplement.</p><p>La lettre, le sac, le message de Norah, la friandise et les décorations n’étaient pas une conspiration. Vous cherchiez un menteur ; il fallait suivre le coffret.</p><p><strong>Aucun objet à chercher : le dénouement est entièrement dans le jeu.</strong></p>${host?`<details><summary>🗳️ Relire les verdicts après la révélation</summary>${investigators.map(p=>`<p>${P[p]} : ${h(P[c.votes[p]?.suspect]||'Indéterminé')} — ${h(c.votes[p]?.argument||'')}</p>`).join('')}</details>`:`<p>Ton verdict : ${h(P[c.votes[session.role]?.suspect]||'Indéterminé')}.</p>`}</div>`;
}
async function submitAnswer(qIndex,answer){const q=Q[qIndex];if(!Number.isInteger(answer)||answer<0||answer>2)throw Error("Choisis une réponse.");if(session.role!==q.target||ctx().phase!==qIndex)throw Error('Ce n’est pas ton tour de répondre.');if(!ctx().members[q.asker])throw Error('Attends que l’enquêteur rejoigne la salle.');await set(path(session.code,`answers/${q.id}`),{value:answer,by:me.uid,submittedAt:serverTimestamp()});selectedAnswer=-1}
async function vote(){if(!investigators.includes(session.role)||ctx().phase!==18)throw Error('Vote indisponible.');if(![...Object.keys(P),'indetermine'].includes(chosenSuspect))throw Error('Choisis un suspect.');await set(path(session.code,`votes/${session.role}`),{suspect:chosenSuspect,argument:voteArgument.trim(),by:me.uid,submittedAt:serverTimestamp()});
 // La confirmation finale est vérifiée par les règles Firebase, sans intervention de Charlotte.
 void tryAutoProgress();render()}
function updateCountdowns(){
 for(const el of root.querySelectorAll('[data-autocount]')){
  const start=Number(el.dataset.autocount||0),left=Math.ceil((start+DISCUSSION_MS-serverNow())/1000);
  el.textContent=left>0?`🎤 Encore ${left} s pour échanger et noter vos hypothèses ; la suite est automatique.`:'⌛ La prochaine question se prépare automatiquement…';
 }
}
function showStatus(){if(!session){stat.innerHTML='';return;}const c=ctx();stat.innerHTML=`<div class="card flex between"><div><strong>🟢 Salle ${h(session.code)}</strong><br><span class="muted small">${Object.keys(c.members).length}/7 profils · ${c.phase<18?'Manche '+(Math.floor(c.phase/6)+1)+'/3':c.phase===18?'Verdict':'Révélation'}</span></div><button class="btn secondary" data-action="copy">Copier le lien</button></div>`}
function loginUI(){const mj=new URLSearchParams(location.search).get('mj')==='1';return `<div class="card"><h2>Entrer dans l’enquête</h2>${mj?`<p>Accès réservé à Charlotte.</p>${me&&!me.isAnonymous?'<p class="ok">Compte Google MJ connecté.</p>':'<button class="btn" data-action="google">Se connecter avec Google</button>'}${me&&!me.isAnonymous?`<button class="btn secondary" data-action="create">Créer une salle</button>`:''}`:`<label>Code de salle<input id="code" maxlength="8" value="${h(joinCode)}" placeholder="ABCDEFGH"></label><p><strong>Choisis ton personnage</strong></p><div class="person-grid">${investigators.map(p=>`<button type="button" class="person-tile ${selectedPlayer===p?'selected':''}" data-person="${p}"><span class="emoji">${h(P[p].split(' ')[0])}</span><span class="name">${h(P[p].split(' ').slice(1).join(' '))}</span></button>`).join('')}</div><button class="btn" data-action="join">Rejoindre la salle</button><p class="small muted">Chaque joueur utilise son propre navigateur / téléphone, sans le compte Google MJ.</p><button class="btn secondary" data-action="host">Je suis Charlotte (MJ)</button>`}</div>`}
function menu(){return `<div class="tabs" role="navigation" aria-label="Navigation de l’enquête">${[['enquete','🎭 Tribunal'],['carnet','📋 Mon Cluedo'],['affaire','🕰️ L’affaire']].map(([k,label])=>`<button class="${tab===k?'active':''}" data-tab="${k}" aria-current="${tab===k?'page':'false'}">${label}</button>`).join('')}</div><details class="settings"><summary>Paramètres de la salle</summary><button class="btn secondary" data-action="leave">Quitter cette salle</button>${session.role==='charlotte'?`<button class="btn secondary" data-action="new-room">Créer une nouvelle salle de test</button><details><summary>Dossier confidentiel de Charlotte</summary>${mjUI()}</details>`:''}</details>`}
function chapterPrelude(step){
 if(step===0)return `<div class="card reveal-stage"><div class="quiet">Prologue · La même soirée, plusieurs vérités</div><p class="dramatic">À 20 h 35, le Trésor de la Chouquette n’est plus sur la table. Sept personnes racontent ce qu’elles ont vu. Pas forcément ce qu’elles ont compris.</p><p>Ne confondez pas un souvenir, un secret et une preuve. À chaque tour, écoutez la question puis la réponse prononcées à voix haute.</p></div>`;
 if(step===6)return `<div class="card reveal-stage"><div class="quiet">Manche II · Ce qui a été tu</div><p>Un mensonge découvert rend une personne suspecte. Il ne dit pas de quoi elle est coupable.</p></div>`;
 if(step===12)return `<div class="card reveal-stage"><div class="quiet">Manche III · La certitude est un piège</div><p>Le groupe croit tenir des responsables. Reste à savoir de quoi.</p></div>`;
 return '';
}
function interrogation(){
 const c=ctx(),step=c.phase;
 if(step>=19)return revealTheater();
 if(step===18){
  const mine=c.votes[session.role];
  return `<div class="card"><div class="round">VERDICT FINAL · 18 CONFRONTATIONS</div><h2>Qui a déplacé le Trésor ?</h2><p>Choisis un personnage d’après tes notes. Tu peux aussi estimer que les preuves ne suffisent pas.</p>${session.role==='charlotte'?'<p class="muted">Tu es une suspecte : les six enquêteurs votent sans ton intervention. Le verdict est automatiquement révélé.</p>':mine?'<div class="ok">✅ Ton vote est enregistré. Les conclusions des autres restent privées pour l’instant.</div>':`<div class="suspect-vote-grid">${suspects.map(p=>`<button type="button" class="person-tile ${chosenSuspect===p?'selected':''}" data-vote-person="${p}"><span class="emoji">${h(P[p].split(' ')[0])}</span><span class="name">${h(P[p].split(' ').slice(1).join(' '))}</span></button>`).join('')}</div><button class="status-pill w100 ${chosenSuspect==='indetermine'?'active':''}" data-vote-person="indetermine">❔ Les preuves ne suffisent pas</button><label>Ma raison (facultative)<textarea id="voteReason" maxlength="220" placeholder="J’ai entendu que…">${h(voteArgument)}</textarea></label><button class="btn w100" data-action="vote" ${!chosenSuspect?'disabled':''}>Déposer mon verdict</button>`}</div>`;
 }
 const q=Q[step],answer=c.answers[q.id];
 const asker=session.role===q.asker,target=session.role===q.target;
 const progress=`<div class="round">MANCHE ${q.round}/3 · CONFRONTATION ${q.id}/18</div><div class="step-track" aria-label="Progression"><div class="step-track-fill" style="width:${Math.round(step/18*100)}%"></div></div>`;
 if(!asker&&!target)return `<div class="card">${progress}<h2>👂 Observe et écoute</h2><p>Cette question appartient à un autre joueur. Ses choix et ses réponses ne s’affichent pas ici.</p><p>Écoute ce qui est dit autour de la table, puis forme ta propre hypothèse.</p><button class="btn secondary w100" data-tab="carnet">📋 Ouvrir mon carnet</button></div>`;
 let html=`<div class="card">${progress}<div class="versus"><div class="character"><div class="avatar">${h(P[q.asker].split(' ')[0])}</div><strong>${h(P[q.asker].split(' ').slice(1).join(' '))}</strong></div><div class="mid">interroge →</div><div class="character"><div class="avatar">${h(P[q.target].split(' ')[0])}</div><strong>${h(P[q.target].split(' ').slice(1).join(' '))}</strong></div></div><h2 class="card-title">${asker?'🎤 À toi d’interroger':'🎭 À toi de répondre'}</h2><div class="big-question">« ${h(q.question)} »</div>`;
 if(asker&&!answer)html+=`<div class="role-instruction">Lis la question à voix haute. Écoute la réponse, pas l’écran de ton voisin.</div>`;
 if(target&&!answer&&!c.members[q.asker])html+=`<p class="muted">En attente de ${h(P[q.asker])} pour poser la question.</p>`;
 if(target&&!answer&&c.members[q.asker])html+=`<p>Choisis une réponse, puis <strong>lis-la à voix haute</strong> avant de l’enregistrer.</p><div class="response-grid">${q.answers.map((text,i)=>`<label class="response-card ${selectedAnswer===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${selectedAnswer===i?'checked':''}><span class="response-letter">${'ABC'[i]}</span><span>${h(text)}</span></label>`).join('')}</div><button class="btn w100" data-action="answer" ${selectedAnswer<0?'disabled':''}>Confirmer ma réponse</button>`;
 if(target&&answer)html+=`<div class="private"><strong>Ta déclaration choisie</strong><p>« ${h(q.answers[answer.value])} »</p><p>Prononce-la devant les autres. Ils ne la lisent pas sur leurs téléphones.</p><p class="muted small" data-autocount="${answer.submittedAt||0}"></p></div>`;
 if(asker&&answer)html+=`<div class="private"><strong>🎯 Ta relance personnelle</strong><p class="quote">« ${h(q.relances[answer.value])} »</p><p>Pose-la au même suspect, puis laisse les autres discuter.</p><p class="muted small" data-autocount="${answer.submittedAt||0}"></p></div>`;
 html+='</div>';
 if(target)html+=`<details class="card private"><summary>🔒 Mon secret de personnage</summary><p>${h(q.truth)}</p><p class="small">Tu n’es pas obligé de tout raconter : respecte néanmoins les faits de ton rôle.</p></details>`;
 return html;
}
function affaire(){
 const step=ctx().phase;
 const pieces=[
 {after:0,time:'20 h 35',title:'Disparition constatée',text:'Le coffret n’est plus sur la table. Son déplacement exact reste à reconstruire.',type:'Fait de départ'},
 {after:3,time:'20 h 25',title:'Friandise de Nino',text:'Nino admet une friandise ; Andreas avait observé son passage près de la table.',type:'Témoignages'},
 {after:4,time:'Après 20 h 31',title:'Dernière vision du coffret',text:'James affirme l’avoir encore vu après le message d’Halloween.',type:'Témoignage'},
 {after:5,time:'Vers 20 h 32',title:'Norah près des jouets',text:'Mathieu affirme l’avoir aperçue avec son téléphone ; elle confirme sa présence.',type:'Témoignage'},
 {after:6,time:'20 h 28',title:'Secret de Mathieu',text:'Mathieu reconnaît avoir caché quelque chose sous son pull.',type:'Témoignage'},
 {after:10,time:'Vers 20 h 33',title:'Cuisine',text:'Matys dit être avec Nino ; Andreas confirme les avoir vus ensemble à ce moment.',type:'Recoupement'},
 {after:14,time:'Vers 20 h 33',title:'Silhouette sans visage',text:'James rapporte une silhouette de petite taille transportant un objet vers les jouets. Il ne l’a pas identifiée.',type:'Témoignage'},
 {after:15,time:'20 h 28',title:'Le sac de Mathieu',text:'Pièce fictive : inventaire de la surprise prévue pour la soirée — un sac de friandises. Elle explique un objet, pas tous les déplacements.',type:'Document fictif'},
 {after:16,time:'20 h 32',title:'Brouillon de Norah',text:'Pièce fictive, non issue d’un vrai téléphone : « J’ai une petite surprise pour toi après le jeu ❤️ » · À Matys · Non envoyé.',type:'Document fictif'},
 {after:18,time:'Vers 20 h 33',title:'Le bruit près des jouets',text:'Andreas a entendu un bruit compatible avec un couvercle ; personne n’a vu l’objet se refermer.',type:'Témoignage'}
 ];
 const available=pieces.filter(p=>step>=p.after);
 return `<div class="card"><span class="round">DOSSIER COMMUN</span><h2>🕰️ L’affaire</h2><p class="muted">Seulement les éléments déjà apparus pendant les échanges. Ce sont des témoignages et des documents du jeu, pas une transcription des réponses privées.</p>${available.map(p=>`<div class="clue-line"><span class="time">${h(p.time)}</span> <span class="mini-tag">${h(p.type)}</span><strong style="display:block">${h(p.title)}</strong><p>${h(p.text)}</p></div>`).join('')}<p class="scroll-tip">Les hypothèses restent dans ton carnet privé. Aucune personne n’est automatiquement innocentée.</p></div>`;
}
function carnet(){
 const step=ctx().phase,flashs=personalFlashs(step);
 const flashHtml=flashs.length?`<div class="card"><h3>🕯️ Mes Flashs d’analyse</h3><p class="muted small">Ces notes réagissent à tes hypothèses. Elles ne disent jamais qui a raison.</p>${flashs.map(f=>`<div class="analysis-flash"><strong>${h(f.tag)} · ${h(P[f.id])}</strong><p>${h(f.text)}</p></div>`).join('')}</div>`:'';
 const s=selectedNotebookPerson,entry=normalizeNote(notes[s]),stat=entry.status;
 const badgeText={inconnu:'❔ Inconnu',suspect:'🔴 Suspect',verifier:'🟠 À vérifier',ecarte:'🟢 Écarté'};
 return `<div class="card"><div class="flex between"><div><div class="round">CARNET CONFIDENTIEL</div><h2>📋 Mon Cluedo</h2></div><span class="mini-tag">🔒 Privé</span></div><p class="muted small">Choisis un portrait puis touche une pastille. Tes notes se sauvegardent dans Firebase.</p><p class="status-summary" data-note-sync>${h(noteStatus)}</p><div class="person-grid">${suspects.map(p=>{const st=notes[p]?.status||'inconnu';return `<button type="button" class="person-tile ${p===s?'selected':''}" data-notebook-person="${p}"><span class="emoji">${h(P[p].split(' ')[0])}</span><span class="name">${h(P[p].split(' ').slice(1).join(' '))}</span><span class="tiny">${h(badgeText[st])}</span></button>`}).join('')}</div><div class="card" style="margin:0;padding:12px;background:#1b263a"><h3>${h(P[s])}</h3><p class="small muted">Quel est ton avis aujourd’hui ? Il peut changer.</p><div class="status-picker">${[['inconnu','❔ Inconnu'],['suspect','🔴 Suspect'],['verifier','🟠 À vérifier'],['ecarte','🟢 Écarté']].map(([v,label])=>`<button type="button" class="status-pill ${stat===v?'active':''}" data-status-value="${v}" aria-pressed="${stat===v}">${label}</button>`).join('')}</div><div class="tag-context">Annotations rapides · ce sont tes impressions, jamais des preuves validées.</div><div class="quick-tags" role="group" aria-label="Annotations sur ${h(P[s])}">${NOTE_TAGS.map(([id,label])=>`<button type="button" class="quick-tag" data-note-tag="${id}" aria-pressed="${entry.tags?.[id]===true}">${h(label)}</button>`).join('')}</div><label for="suspectNote">Mes observations personnelles</label><textarea id="suspectNote" data-note="${s}" data-field="text" maxlength="600" placeholder="Alibi, contradiction, souvenir…">${h(entry.text||'')}</textarea></div></div>${rumorCard(step)}${personalMemory(step)?`<div class="memory"><strong>🧩 Souvenir personnel</strong><p>${h(personalMemory(step).text)}</p><p class="warning-line">Ton point de vue, pas une preuve certifiée.</p></div>`:''}${testimonyLens(step)}${flashHtml}`;
}
function mjUI(){
 const c=ctx(),step=c.phase,connected=Object.keys(c.members).length;
 return `<div class="card"><h2>👑 Charlotte — Dossier confidentiel</h2>
 <p><strong>${step<18?'Manche '+(Math.floor(step/6)+1)+'/3 · Confrontation '+(step+1)+'/18':step===18?'Verdicts en cours':'Enquête terminée'}</strong></p>
 <p>Le tribunal avance seul. Tu joues une suspecte, pas une régisseuse. Tu n’as aucun bouton de passage ni de révélation. Laisse le doute s’installer, sans accuser les personnes réelles.</p>
 <p>Participants : ${connected}/7. ${connected<7?'Attente des personnages manquants.':'Tous les personnages sont inscrits.'}</p>
 <p class="muted small">Chaque réponse ouvre une période de ${Math.round(DISCUSSION_MS/1000)} secondes pour la relance orale et les notes. Le prochain tour est déclenché automatiquement par les téléphones connectés.</p>
 <details><summary>📜 Vérité du scénario (confidentiel)</summary>
 <p><strong>20 h 25 :</strong> Nino prend une friandise. <strong>20 h 28 :</strong> Mathieu cache un sac de friandises fictif. <strong>20 h 29 :</strong> Charlotte déplace une décoration. <strong>Après 20 h 31 :</strong> James voit encore le coffret. <strong>20 h 32 :</strong> Norah rédige un message pour Matys près des jouets. <strong>20 h 33 :</strong> Matys et Nino sont à la cuisine ; Enola transporte le coffret vers les jouets ; Andreas entend un couvercle. <strong>20 h 35 :</strong> disparition constatée.</p>
 </details><details class="card"><summary>🧪 Nouvelle salle de test</summary><p class="muted small">L’ancienne salle et les carnets restent conservés.</p><button class="btn secondary" data-action="new-room">Créer une nouvelle salle</button></details></div>`;
}
function render(){showStatus();let html='';if(!session)html=loginUI();else html=menu()+(tab==='carnet'?carnet():tab==='affaire'?affaire():chapterPrelude(ctx().phase)+interrogation());if(error)html=`<div class="card error">⚠️ ${h(error)} <button class="btn secondary" data-action="dismiss">Fermer</button></div>`+html;root.innerHTML=html;updateCountdowns();}
root.addEventListener('change',e=>{
 if(e.target.name==='answer'){selectedAnswer=Number(e.target.value);render()}
 if(e.target.id==='player')selectedPlayer=e.target.value;
 if(e.target.id==='suspect')chosenSuspect=e.target.value;
 if(e.target.dataset.note){editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);if(e.target.dataset.field==='status')render();}
});
root.addEventListener('input',e=>{
 if(e.target.dataset.note)editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);
 if(e.target.id==='voteReason')voteArgument=e.target.value;
 if(e.target.id==='code')joinCode=e.target.value;
});

root.addEventListener('click',async e=>{
 const person=e.target.closest('[data-notebook-person]');if(person){selectedNotebookPerson=person.dataset.notebookPerson;render();return;}
 const status=e.target.closest('[data-status-value]');if(status){editNote(selectedNotebookPerson,'status',status.dataset.statusValue);render();return;}
 const tag=e.target.closest('[data-note-tag]');if(tag){editNote(selectedNotebookPerson,'tag',tag.dataset.noteTag);render();return;}
 const votePerson=e.target.closest('[data-vote-person]');if(votePerson){chosenSuspect=votePerson.dataset.votePerson;render();return;}
 const choose=e.target.closest('[data-person]');if(choose){selectedPlayer=choose.dataset.person;render();return;}
 const el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}const action=el.dataset.action;if(pending)return;pending=true;error='';try{if(action==='dismiss'){}else if(action==='google')await hostLogin();else if(action==='host'){location.href=location.pathname+'?mj=1';return}else if(action==='create'||action==='new-room')await createRoom();else if(action==='leave')leaveRoom();else if(action==='join')await openRoom(joinCode,selectedPlayer);else if(action==='copy'){const url=location.origin+location.pathname+'?room='+session.code;await navigator.clipboard.writeText(url)}else if(action==='answer')await submitAnswer(ctx().phase,selectedAnswer);else if(action==='vote')await vote()}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async u=>{me=u;try{if(!u){await signInAnonymously(auth);return}const prior=JSON.parse(localStorage.getItem(sessionKey)||'null');if(prior&&!session){try{await openRoom(prior.code,prior.role)}catch(e){localStorage.removeItem(sessionKey);error='Ancienne session : '+e.message}}render()}catch(e){error=e.message;render()}});
</script></body></html>
