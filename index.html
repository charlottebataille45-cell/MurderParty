:root{color-scheme:dark;--bg:#0c101d;--panel:#171e31;--line:#33405a;--text:#eff3fa;--muted:#b0bbcf;--gold:#f4c972;--accent:#76cecf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b101e,#18142b);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}main{max-width:880px;margin:auto;padding:20px 14px 80px}header{text-align:center;padding:17px 0 8px}h1{font:700 clamp(25px,5vw,36px) Georgia,serif;color:var(--gold);margin:4px}h2{font-size:22px;margin:0 0 10px}h3{font-size:18px;margin:10px 0}p{margin:8px 0 14px}.hint,.muted{color:var(--muted)}.tag{display:inline-block;font-size:12px;border:1px solid #6c6983;border-radius:99px;padding:2px 9px;color:#eed5a1}.card{background:rgba(24,32,52,.97);border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 6px 20px #05061125}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{padding:12px 17px;border:0;background:var(--gold);color:#1b1b21;border-radius:9px;font-weight:800;cursor:pointer;font-size:15px}.btn.secondary{background:#2f425e;color:#fff}.btn.danger{background:#7a3941;color:white}.btn:disabled{opacity:.44;cursor:not-allowed}input,textarea,select{width:100%;padding:12px;background:#0d1425;color:white;border:1px solid #61718b;border-radius:8px;font:inherit}textarea{min-height:74px;resize:vertical}label{display:block;margin:10px 0 5px}.options{display:grid;gap:9px;margin:15px 0}.choice{display:block;background:#1d2943;padding:13px;border:1px solid #52617b;border-radius:11px;cursor:pointer}.choice input{width:auto;margin-right:10px}.choice:has(input:checked){border-color:var(--gold);background:#3e3646}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#25344b;color:white;border:1px solid #425774;border-radius:8px;padding:9px 13px;cursor:pointer}.tabs button.active{background:#ac8853;color:#130f10;font-weight:800}.quote{border-left:3px solid var(--gold);padding:9px 13px;background:#2c2b3e;font-size:18px}.timeline{display:flex;gap:6px;flex-wrap:wrap}.dot{font-size:12px;border-radius:99px;background:#30384e;padding:5px 10px}.dot.done{background:#25564d}.round{font-size:14px;color:var(--gold);font-weight:700}.private{border:1px dashed #bd9768;background:#2b2636;padding:12px;border-radius:10px}.note-row{border-top:1px solid var(--line);padding:13px 0}.note-row:first-of-type{border:0}.error{color:#ff9ca5}.ok{color:#a4e7c7}.hide{display:none}.small{font-size:13px}footer{text-align:center;color:#8d99b1;font-size:12px;margin-top:30px}
</style></head><body><main><header><div>🕯️ LES ROUBATVOT</div><h1>Le Tribunal</h1><div class="muted">V4.3 · Un trésor disparu · Tout le monde suspect</div></header><div id="status"></div><div id="root"><div class="card">Connexion à Firebase…</div></div><footer>Halloween 2026 · Ingré · Chaque témoignage est public, chaque carnet reste personnel.</footer></main>

const firebaseConfig={apiKey:'AIzaSyAUA4xdHZyh17ZkmDHe0gXqIrNZgEovcrw',authDomain:'roubatvot-murder-party.firebaseapp.com',databaseURL:'https://roubatvot-murder-party-default-rtdb.firebaseio.com',projectId:'roubatvot-murder-party',storageBucket:'roubatvot-murder-party.firebasestorage.app',messagingSenderId:'225363228130',appId:'1:225363228130:web:94c1839cbe0d542f86b5bb'};
const Q=[{"id":1,"round":1,"asker":"james","target":"charlotte","question":"Je t’ai vue près de la table. Pourquoi ne l’avoir pas dit ?","answers":["J’étais près de la table, pas forcément du coffret.","Je terminais les décorations. Ce n’est pas un crime !","Tu es sûr de ne pas confondre les moments ?"],"truth":"Charlotte a déplacé une décoration à 20 h 29, pas le coffret.","followup":"As-tu touché quelque chose sur la table ?"},{"id":2,"round":1,"asker":"nino","target":"andreas","question":"Pourquoi tu me regardais près de la table ?","answers":["J’ai simplement remarqué ton passage.","Tu étais dans mon champ de vision.","Pourquoi ça t’inquiète autant ?"],"truth":"Andreas a aperçu Nino à 20 h 25.","followup":"Qu’as-tu exactement vu ?"},{"id":3,"round":1,"asker":"andreas","target":"nino","question":"Pourquoi tu t’inquiètes qu’on parle de ton passage près du coffret ?","answers":["Parce que vous m’accusez sans preuve !","J’ai peut-être caché une chose, pas volé un coffre.","Et pourquoi Andreas surveillait tout le monde ?"],"truth":"Nino a pris une friandise et laissé un emballage.","followup":"Qu’as-tu caché ?"},{"id":4,"round":1,"asker":"matys","target":"james","question":"As-tu vraiment vu le coffret ou supposes-tu qu’il était encore là ?","answers":["Je l’ai vu juste après le message.","J’en suis sûr, mais je ne le surveillais pas.","Je sais quand je l’ai vu, pas quand il a disparu."],"truth":"James a vu le coffret encore présent après 20 h 31.","followup":"Qui se trouvait près de la table ?"},{"id":5,"round":1,"asker":"mathieu","target":"matys","question":"Pourquoi défends-tu Nino avec autant d’assurance ?","answers":["Je ne dis pas qu’il est innocent : je veux une preuve.","Vous l’accusez pour une friandise !","Peut-être que je sais une chose qui vous échappe."],"truth":"Matys était avec Nino près de la cuisine vers 20 h 33.","followup":"Tu sais où était Nino à 20 h 33 ?"},{"id":6,"round":2,"asker":"james","target":"mathieu","question":"Pourquoi cachais-tu un objet sous ton pull ?","answers":["Tu ne sais pas ce que je transportais.","C’était caché, pas volé.","Pourquoi me surveillais-tu ?"],"truth":"Mathieu cachait un sac de friandises pour la soirée vers 20 h 28.","followup":"Alors, que transportais-tu ?"},{"id":7,"round":2,"asker":"nino","target":"charlotte","question":"Pourquoi James t’a-t-il vue juste à côté du Trésor ?","answers":["Le Trésor était sur la table des décorations.","James a raison sur ma présence, pas sur ce que j’ai touché.","Vous transformez un geste banal en vol."],"truth":"Charlotte n’a déplacé qu’une décoration.","followup":"Quel objet précisément ?"},{"id":8,"round":2,"asker":"andreas","target":"matys","question":"À 20 h 33, tu étais près de la cuisine. Avec qui ?","answers":["Avec Nino, je ne pensais pas que c’était important.","Avec Nino ; on m’interrogeait sur le Trésor, pas sur notre conversation.","Avec Nino ; vous l’avez accusé trop vite."],"truth":"Andreas peut confirmer Matys et Nino près de la cuisine.","followup":"Andreas, peux-tu confirmer ?"},{"id":9,"round":2,"asker":"matys","target":"andreas","question":"Pourquoi soupçonner Nino si tu nous as vus ensemble ?","answers":["Je l’ai vu à la table à 20 h 25, puis à la cuisine à 20 h 33.","Mentir pour une friandise est suspect, pas une preuve de vol.","J’ai peut-être jugé trop vite."],"truth":"Ces deux observations d’Andreas ne sont pas contradictoires.","followup":"Que peux-tu affirmer, sans supposer ?"},{"id":10,"round":2,"asker":"mathieu","target":"james","question":"As-tu confondu l’objet sous mon pull avec le coffret ?","answers":["Je t’ai vu cacher quelque chose, pas le coffret.","Je ne sais pas ce que tu portais.","Alors montre-nous cet objet !"],"truth":"James n’a jamais identifié l’objet porté par Mathieu.","followup":"Mathieu, peux-tu montrer le sac ?"},{"id":11,"round":3,"asker":"james","target":"andreas","question":"Pourquoi n’as-tu pas réagi au bruit près des jouets ?","answers":["J’ai entendu un couvercle, pas un appel au secours.","J’ai cru qu’on rangeait un jouet.","J’ai entendu un bruit, sans voir le coffret."],"truth":"Andreas a entendu un bruit de couvercle vers les jouets à 20 h 33.","followup":"De quelle direction venait ce bruit ?"},{"id":12,"round":3,"asker":"nino","target":"james","question":"As-tu vu autre chose que tu jugeais sans importance ?","answers":["Une petite silhouette partait vers les jouets avec quelque chose.","Quelqu’un transportait un objet, sans que je voie son visage.","Un mouvement vers les jouets m’a paru banal."],"truth":"James a vu une petite silhouette se diriger vers les jouets à 20 h 33.","followup":"Pourquoi ne l’as-tu pas raconté avant ?"},{"id":13,"round":3,"asker":"andreas","target":"mathieu","question":"Après ton mensonge, pourquoi devrait-on te croire ?","answers":["Je peux vous montrer le sac de friandises.","Le sac et le coffret sont deux objets différents.","Vous m’avez accusé sans savoir ce que je portais."],"truth":"Mathieu avait caché un sac de friandises.","followup":"Qui d’autre a pu transporter quelque chose sans être remarqué ?"},{"id":14,"round":3,"asker":"matys","target":"charlotte","question":"On cherchait qui était suspect : a-t-on réfléchi à l’endroit où est parti le Trésor ?","answers":["Non, nous avons surtout accusé des personnes.","Nous avons recoupé les alibis, pas les directions.","Nous avons confondu comportement suspect et déplacement du coffret."],"truth":"La piste physique mène vers les jouets.","followup":"Quels témoignages parlent de cet endroit ?"},{"id":15,"round":3,"asker":"mathieu","target":"nino","question":"Quelqu’un t’a-t-il réellement vu prendre le Trésor ?","answers":["Non, vous avez déduit ça de ma présence.","J’ai menti pour une friandise, pas un coffret.","Tout le monde cache quelque chose, ça ne prouve rien !"],"truth":"Plusieurs mensonges n’avaient aucun rapport avec la disparition.","followup":"Quels faits établis restent-ils ?"}];
const P={charlotte:'👑 Charlotte',james:'👺 James',nino:'🦊 Nino',andreas:'🏹 Andreas',matys:'🛡️ Matys',mathieu:'🧙 Mathieu',enola:'🧸 Enola'};
const investigators=['james','nino','andreas','matys','mathieu'];
const auth=getAuth(initializeApp(firebaseConfig));const db=getDatabase();let me=null,session=null,room=null,unsub=null,tab='enquete',error='',pending=false,selectedAnswer=-1,chosenSuspect='',voteArgument='',joinCode=new URLSearchParams(location.search).get('room')||'',selectedPlayer='james';
const root=document.getElementById('root'),stat=document.getElementById('status');
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const path=(code,trail='')=>ref(db,`rooms/${code}${trail?'/'+trail:''}`);
const sessionKey='roubatvot_v43_session';
const ctx=()=>({isHost:session?.role==='charlotte',role:session?.role,phase:Number(room?.progress?.step||0),answers:room?.answers||{},votes:room?.votes||{},members:room?.players||{}});
const isComplete=n=>!!room?.answers?.[String(n)];
function noteKey(){return `roubatvot_v43_notes_${session.code}_${me.uid}_${session.role}`}
function loadNotes(){try{return JSON.parse(localStorage.getItem(noteKey())||'{}')}catch{return {}}}
function saveNotes(x){try{localStorage.setItem(noteKey(),JSON.stringify(x))}catch{}}
async function anon(){if(auth.currentUser&&!auth.currentUser.isAnonymous){await signOut(auth)}if(!auth.currentUser)await signInAnonymously(auth);me=auth.currentUser}
async function hostLogin(){await signInWithPopup(auth,new GoogleAuthProvider());me=auth.currentUser;render()}
async function createRoom(){if(!me||me.isAnonymous||!me.emailVerified)throw Error('Connecte ton compte Google MJ.');const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let j=0;j<5;j++){const nums=crypto.getRandomValues(new Uint8Array(8));const code=[...nums].map(i=>chars[i%chars.length]).join('');try{await set(path(code),{edition:'4.3',hostUid:me.uid,createdAt:serverTimestamp(),players:{charlotte:{uid:me.uid}},progress:{step:0}});await openRoom(code,'charlotte');return}catch(e){if(e.code!=='PERMISSION_DENIED')throw e;throw e}}}
async function openRoom(code,role){code=String(code).trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{8}$/.test(code))throw Error('Code de salle invalide (8 caractères).');const edition=await get(path(code,'edition'));if(edition.val()!=='4.3')throw Error('Cette salle n’est pas une salle V4.3. Crée une nouvelle salle.');const host=(await get(path(code,'hostUid'))).val();if(role==='charlotte' && (host!==me.uid||me.isAnonymous))throw Error('Seule Charlotte peut reprendre le poste MJ.');if(role!=='charlotte' && host===me.uid)throw Error('Ouvre le personnage dans un navigateur privé, sans la session Google MJ.');const old=await get(path(code,`players/${role}`));if(old.exists()&&old.child('uid').val()!==me.uid)throw Error('Ce rôle est déjà réservé par un autre téléphone.');if(!old.exists())await set(path(code,`players/${role}`),{uid:me.uid});session={code,role};localStorage.setItem(sessionKey,JSON.stringify(session));selectedAnswer=-1;tab='enquete';startListening()}
function startListening(){if(unsub)unsub();const unsubs=[];room={players:{},progress:{step:0},answers:{},votes:{}};for(const field of ['players','progress','answers']){unsubs.push(onValue(path(session.code,field),snap=>{room[field]=snap.val()||{};render()},e=>{error=e.message;render()}))}if(session.role==='charlotte'){unsubs.push(onValue(path(session.code,'votes'),snap=>{room.votes=snap.val()||{};render()},e=>{error=e.message;render()}))}else{unsubs.push(onValue(path(session.code,'votes/'+session.role),snap=>{room.votes={[session.role]:snap.val()};render()},e=>{error=e.message;render()}))}unsub=()=>unsubs.forEach(u=>u());render()}

async function changeStep(){const c=ctx();if(!c.isHost)return;let next=c.phase+1;if(next>16)return;if(next<=15&&!isComplete(next))throw Error('Attends la réponse publique à la confrontation '+next+'.');if(next===16&&investigators.some(p=>!c.votes[p]))throw Error('Attends les cinq verdicts.');await set(path(session.code,'progress/step'),next)}
async function submitAnswer(qIndex,answer){const q=Q[qIndex];if(session.role!==q.target||ctx().phase!==qIndex)throw Error('Ce n’est pas ton tour de répondre.');await set(path(session.code,`answers/${q.id}`),{value:answer,by:me.uid});selectedAnswer=-1}
async function vote(){if(!investigators.includes(session.role)||ctx().phase!==15)throw Error('Vote indisponible.');if(![...Object.keys(P),'indetermine'].includes(chosenSuspect))throw Error('Choisis un suspect.');await set(path(session.code,`votes/${session.role}`),{suspect:chosenSuspect,argument:voteArgument.trim(),by:me.uid});render()}
function showStatus(){if(!session){stat.innerHTML='';return;}const c=ctx();stat.innerHTML=`<div class="card flex between"><div><strong>🟢 Salle ${h(session.code)}</strong><br><span class="muted small">${Object.keys(c.members).length}/6 profils · ${c.phase<15?'Manche '+(Math.floor(c.phase/5)+1)+'/3':c.phase===15?'Verdict':'Révélation'}</span></div><button class="btn secondary" data-action="copy">Copier le lien</button></div>`}
function loginUI(){const mj=new URLSearchParams(location.search).get('mj')==='1';return `<div class="card"><h2>Entrer dans l’enquête</h2>${mj?`<p>Accès réservé à Charlotte.</p><button class="btn" data-action="google">Se connecter avec Google</button>${me&&!me.isAnonymous?`<button class="btn secondary" data-action="create">Créer une salle V4.3</button>`:''}`:`<label>Code de salle<input id="code" maxlength="8" value="${h(joinCode)}" placeholder="ABCDEFGH"></label><label>Mon personnage<select id="player">${investigators.map(p=>`<option value="${p}" ${selectedPlayer===p?'selected':''}>${P[p]}</option>`).join('')}</select></label><button class="btn" data-action="join">Rejoindre la salle</button><p class="small muted">Chaque joueur utilise son propre navigateur / téléphone, sans le compte Google MJ.</p><button class="btn secondary" data-action="host">Je suis Charlotte (MJ)</button>`}</div>`}
function menu(){return `<div class="tabs">${[['enquete','🎭 Interrogatoire'],['carnet','📋 Mon Cluedo'],['declarations','🗣️ Témoignages'],['mj','👑 MJ']].filter(v=>v[0]!=='mj'||session.role==='charlotte').map(([k,label])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${label}</button>`).join('')}</div>`}
function interrogation(){const c=ctx(),step=c.phase;if(step>=16)return `<div class="card"><h2>🎁 Le Trésor de la Chouquette</h2><p>La famille cherchait un voleur… mais Enola avait simplement emporté le coffret pour jouer, en direction des doudous.</p><p>Les mensonges concernaient des décorations, des friandises, une horloge et des alibis — pas le vol.</p><p><strong>Charlotte peut maintenant autoriser une seule recherche près des jouets.</strong></p><h3>Les verdicts</h3>${investigators.map(p=>`<p>${P[p]} : ${h(P[c.votes[p]?.suspect]||'Indéterminé')} — ${h(c.votes[p]?.argument||'')}</p>`).join('')}</div>`;
if(step===15){const mine=c.votes[session.role];return `<div class="card"><div class="round">VERDICT FINAL</div><h2>Qui a déplacé le Trésor ?</h2><p>Ce n’est pas forcément la personne qui a menti. Sur quels faits te fondes-tu ?</p>${session.role==='charlotte'?`<p>Charlotte : fais voter les cinq enquêteurs, puis appuie sur le bouton du panneau MJ.</p>`:mine?`<div class="ok">Ton verdict est enregistré et reste privé jusqu’à la révélation.</div>`:`<label>Mon suspect<select id="suspect"><option value="">Choisir…</option>${Object.keys(P).map(p=>`<option value="${p}" ${chosenSuspect===p?'selected':''}>${P[p]}</option>`).join('')}<option value="indetermine">Je ne sais pas</option></select></label><label>Ma raison (facultatif)<textarea id="voteReason" maxlength="220" placeholder="J’ai remarqué que…">${h(voteArgument)}</textarea></label><button class="btn" data-action="vote">Déposer mon verdict</button>`}<p>${Object.keys(c.votes).length}/5 verdicts enregistrés.</p></div>`}
const q=Q[step],answer=c.answers[q.id],isTarget=session.role===q.target;let block=`<div class="card"><div class="round">MANCHE ${q.round}/3 · Question ${q.id}/15</div><h2>${P[q.asker]} interroge ${P[q.target]}</h2><p class="quote">« ${h(q.question)} »</p><p class="muted">${P[q.asker]} pose la question à voix haute. Les autres écoutent, puis prennent des notes.</p>`;
if(answer){block+=`<div class="private"><strong>Réponse publique de ${P[q.target]} :</strong><p>« ${h(q.answers[answer.value])} »</p></div><p>💬 Débat libre : cette réponse est-elle un fait, une supposition ou une esquive ?</p><p class="muted">Relance possible : « ${h(q.followup)} »</p>`}
else if(isTarget){block+=`<h3>À toi de répondre</h3><p>Choisis une réponse compatible avec ton personnage, puis lis-la à voix haute. Le texte sera publié pour tous.</p><div class="options">${q.answers.map((a,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${selectedAnswer===i?'checked':''}>${h(a)}</label>`).join('')}</div><button class="btn" data-action="answer" ${selectedAnswer<0?'disabled':''}>Publier ma réponse</button>`}
else block+=`<p class="muted">⏳ ${P[q.target]} choisit sa réponse. Vous pouvez déjà discuter de la question, sans inventer de nouveaux faits.</p>`;
block+='</div>';if(isTarget||session.role==='charlotte')block+=`<div class="card private"><h3>🔒 Rappel personnel</h3><p>${h(q.truth)}</p><p class="small">Cette indication est affichée uniquement au répondant et à Charlotte. Ne la lis pas avant d’avoir décidé ce que tu peux révéler.</p></div>`;
return block}
function declarations(){const c=ctx();return `<div class="card"><h2>🗣️ Déclarations enregistrées</h2><p class="muted">Paroles publiques : une déclaration n'est pas nécessairement une preuve.</p>${Q.filter(q=>c.answers[q.id]).map(q=>`<div class="note-row"><strong>${q.id}. ${P[q.asker]} → ${P[q.target]}</strong><p>${h(q.question)}</p><p class="quote">${h(q.answers[c.answers[q.id].value])}</p></div>`).join('')||'<p>Aucun témoignage enregistré.</p>'}</div>`}
function carnet(){const data=loadNotes();return `<div class="card"><h2>📋 Mon carnet Cluedo</h2><p class="muted">Personnel et non partagé. Tes notes restent sur cet appareil, dans ce navigateur.</p>${Object.keys(P).map(p=>{const x=data[p]||{};return `<div class="note-row"><strong>${P[p]}</strong><label>Mon avis<select data-note="${p}" data-field="status">${[['inconnu','❔ Inconnu'],['suspect','🔴 Suspect'],['verifier','🟠 À vérifier'],['ecarte','🟢 Écarté']].map(([v,l])=>`<option value="${v}" ${x.status===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Ma note<textarea data-note="${p}" data-field="text" maxlength="600" placeholder="Alibi, contradiction, observation...">${h(x.text||'')}</textarea></label></div>`}).join('')}<p class="small ok">Enregistrement automatique sur ce navigateur.</p></div>`}
function mjUI(){const c=ctx();const step=c.phase;let ready=step===15?investigators.every(p=>c.votes[p]):step<15?isComplete(step+1):false;let copy=step<15?`La question ${step+1} est ${isComplete(step+1)?'terminée':'en cours'}. ${P[Q[step].asker]} interroge ${P[Q[step].target]}.`:step===15?`${Object.keys(c.votes).length}/5 votes`:'La révélation est affichée.';return `<div class="card"><h2>👑 Charlotte — Panneau MJ V4.3</h2><p><strong>${step<15?'Manche '+(Math.floor(step/5)+1)+'/3 · Confrontation '+(step+1)+'/15':step===15?'Verdict':'Terminé'}</strong></p><p>${copy}</p><div class="private"><strong>Ton rôle :</strong> laisse la question, la réponse et les réactions se dérouler à l'oral. Ne révèle pas le dossier secret avant que les joueurs aient formulé leur hypothèse.</div><p>Profils connectés : ${Object.keys(c.members).length}/6. ${investigators.filter(p=>!c.members[p]).map(p=>P[p]+' absent').join(', ')}</p>${step<16?`<button class="btn" data-action="advance" ${!ready?'disabled':''}>${step===14?'Ouvrir le verdict':step===15?'Révéler le Trésor':'Question suivante →'}</button><p class="muted small">${ready?'Prêt à poursuivre.':step===15?'Il manque des verdicts.':'Attendre la réponse du suspect.'}</p>`:''}<details><summary>📜 Dossier confidentiel — vérité de l’enquête</summary><p><strong>20 h 25 :</strong> Nino prend une friandise. <strong>20 h 28 :</strong> Mathieu cache un sac de bonbons. <strong>20 h 29 :</strong> Charlotte déplace une décoration. <strong>Après 20 h 31 :</strong> James voit encore le coffret. <strong>20 h 33 :</strong> Matys et Nino sont à la cuisine ; Enola transporte le coffret vers les jouets ; Andreas entend un couvercle. <strong>20 h 35 :</strong> disparition constatée.</p><p>La lettre d'Halloween sert de distraction, sans énigme informatique ni vol historique.</p></details></div>`}
function render(){showStatus();let html='';if(!session)html=loginUI();else html=menu()+(tab==='carnet'?carnet():tab==='declarations'?declarations():tab==='mj'?mjUI():interrogation());if(error)html=`<div class="card error">⚠️ ${h(error)} <button class="btn secondary" data-action="dismiss">Fermer</button></div>`+html;root.innerHTML=html;}
root.addEventListener('change',e=>{if(e.target.name==='answer'){selectedAnswer=Number(e.target.value);render()}if(e.target.id==='player')selectedPlayer=e.target.value;if(e.target.id==='suspect')chosenSuspect=e.target.value;if(e.target.dataset.note){const data=loadNotes(),role=e.target.dataset.note;data[role]??={};data[role][e.target.dataset.field]=e.target.value;saveNotes(data)}});
root.addEventListener('input',e=>{if(e.target.dataset.note){const data=loadNotes(),role=e.target.dataset.note;data[role]??={};data[role][e.target.dataset.field]=e.target.value;saveNotes(data)}if(e.target.id==='voteReason')voteArgument=e.target.value;if(e.target.id==='code')joinCode=e.target.value});
root.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}const action=el.dataset.action;if(pending)return;pending=true;error='';try{if(action==='dismiss'){}else if(action==='google')await hostLogin();else if(action==='host'){location.href=location.pathname+'?mj=1';return}else if(action==='create')await createRoom();else if(action==='join')await openRoom(joinCode,selectedPlayer);else if(action==='copy'){const url=location.origin+location.pathname+'?room='+session.code;await navigator.clipboard.writeText(url)}else if(action==='advance')await changeStep();else if(action==='answer')await submitAnswer(ctx().phase,selectedAnswer);else if(action==='vote')await vote()}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async u=>{me=u;try{if(!u){await signInAnonymously(auth);return}const prior=JSON.parse(localStorage.getItem(sessionKey)||'null');if(prior&&!session){try{await openRoom(prior.code,prior.role)}catch(e){localStorage.removeItem(sessionKey);error='Ancienne session : '+e.message}}render()}catch(e){error=e.message;render()}});
</script></body></html>
