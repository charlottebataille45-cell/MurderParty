Andreas, peux-tu confirmer ?"]},{"id":9,"round":2,"asker":"matys","target":"andreas","question":"Pourquoi soupçonner Nino si tu nous as vus ensemble ?","answers":["Je l’ai vu à la table à 20 h 25, puis à la cuisine à 20 h 33.","Mentir pour une friandise est suspect, pas une preuve de vol.","J’ai peut-être jugé trop vite."],"truth":"Ces deux observations d’Andreas ne sont pas contradictoires.","followup":"Que peux-tu affirmer, sans supposer ?","relances":["Les deux horaires se contredisent-ils ?","Cela suffit-il pour prouver un vol ?","Quelle observation reste certaine ?"]},{"id":10,"round":2,"asker":"mathieu","target":"james","question":"As-tu confondu l’objet sous mon pull avec le coffret ?","answers":["Je t’ai vu cacher quelque chose, pas le coffret.","Je ne sais pas ce que tu portais.","Alors montre-nous cet objet !"],"truth":"James n’a jamais identifié l’objet porté par Mathieu.","followup":"Mathieu, peux-tu montrer le sac ?","relances":["Mathieu, quel était cet objet ?","Pourquoi ne pas l'avoir dit avant ?","Mathieu, peux-tu montrer le sac ?"]},{"id":11,"round":3,"asker":"james","target":"andreas","question":"Pourquoi n’as-tu pas réagi au bruit près des jouets ?","answers":["J’ai entendu un couvercle, pas un appel au secours.","J’ai cru qu’on rangeait un jouet.","J’ai entendu un bruit, sans voir le coffret."],"truth":"Andreas a entendu un bruit de couvercle vers les jouets à 20 h 33.","followup":"De quelle direction venait ce bruit ?","relances":["De quel objet venait ce bruit ?","De quel côté venait ce son ?","Qu'as-tu entendu précisément ?"]},{"id":12,"round":3,"asker":"nino","target":"james","question":"As-tu vu autre chose que tu jugeais sans importance ?","answers":["Une petite silhouette partait vers les jouets avec quelque chose.","Quelqu’un transportait un objet, sans que je voie son visage.","Un mouvement vers les jouets m’a paru banal."],"truth":"James a vu une petite silhouette se diriger vers les jouets à 20 h 33.","followup":"Pourquoi ne l’as-tu pas raconté avant ?","relances":["Cette silhouette était-elle grande ?","Qu'as-tu pu voir de la taille ?","Où allait ce mouvement ?"]},{"id":13,"round":3,"asker":"andreas","target":"mathieu","question":"Après ton mensonge, pourquoi devrait-on te croire ?","answers":["Je peux vous montrer le sac de friandises.","Le sac et le coffret sont deux objets différents.","Vous m’avez accusé sans savoir ce que je portais."],"truth":"Mathieu avait caché un sac de friandises.","followup":"Qui d’autre a pu transporter quelque chose sans être remarqué ?","relances":["Peux-tu le prouver en montrant le sac ?","Qu'avons-nous ajouté par supposition ?","Qui d'autre pourrait déplacer un objet ?"]},{"id":14,"round":3,"asker":"matys","target":"charlotte","question":"On cherchait qui était suspect : a-t-on réfléchi à l’endroit où est parti le Trésor ?","answers":["Non, nous avons surtout accusé des personnes.","Nous avons recoupé les alibis, pas les directions.","Nous avons confondu comportement suspect et déplacement du coffret."],"truth":"La piste physique mène vers les jouets.","followup":"Quels témoignages parlent de cet endroit ?","relances":["Où chercher le coffret ?","Quelle direction avons-nous oubliée ?","Quel témoin parle d'un lieu précis ?"]},{"id":15,"round":3,"asker":"mathieu","target":"nino","question":"Quelqu’un t’a-t-il réellement vu prendre le Trésor ?","answers":["Non, vous avez déduit ça de ma présence.","J’ai menti pour une friandise, pas un coffret.","Tout le monde cache quelque chose, ça ne prouve rien !"],"truth":"Plusieurs mensonges n’avaient aucun rapport avec la disparition.","followup":"Quels faits établis restent-ils ?","relances":["Qui t'a vu prendre le coffret ?","Quel indice concerne le coffret lui-même ?","Quelles observations restent vérifiables ?"]}];
const P={charlotte:'👑 Charlotte',james:'👺 James',nino:'🦊 Nino',andreas:'🏹 Andreas',matys:'🛡️ Matys',mathieu:'🧙 Mathieu',enola:'🧸 Enola'};
const investigators=['james','nino','andreas','matys','mathieu'];
const auth=getAuth(initializeApp(firebaseConfig)),db=getDatabase();
let me=null,session=null,room=null,unsub=null,answerUnsub=null,noteUnsub=null,lastAnswerStep=null;
let tab='enquete',error='',pending=false,selectedAnswer=-1,chosenSuspect='',voteArgument='',joinCode=new URLSearchParams(location.search).get('room')||'',selectedPlayer='james';
const root=document.getElementById('root'),stat=document.getElementById('status');
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const sessionKey='roubatvot_v44_session';
const ctx=()=>({isHost:session?.role==='charlotte',role:session?.role,phase:Number(room?.progress?.step||0),answers:room?.answers||{},votes:room?.votes||{},members:room?.players||{}});
const isComplete=n=>!!room?.answers?.[String(n)];
const suspects=['james','nino','andreas','matys','mathieu','charlotte','enola'];

let notes={},dirty=new Set(),notesReady=false,noteTimers=new Map(),noteInFlight=new Set(),noteStatus='Connexion au carnet…';
function noteKey(){return `roubatvot_v44_notes_${session.code}_${me.uid}_${session.role}`}
function cacheNotes(){try{localStorage.setItem(noteKey(),JSON.stringify({notes,dirty:[...dirty]}))}catch{}}
function restoreNotes(){notes={};dirty=new Set();notesReady=false;noteStatus='Connexion au carnet…';try{const x=JSON.parse(localStorage.getItem(noteKey())||'null');if(x){notes=x.notes||{};dirty=new Set((x.dirty||[]).filter(p=>suspects.includes(p)))}}catch{}}
function updateNoteUI(){const e=root.querySelector('[data-note-sync]');if(e)e.textContent=noteStatus}
function editNote(who,field,value){
 if(!suspects.includes(who)||!['status','text'].includes(field))return;
 let n=notes[who]||{};n={status:noteStatuses.includes(n.status)?n.status:'inconnu',text:String(n.text||'').slice(0,600)};
 if(field==='status'&&noteStatuses.includes(value))n.status=value;
 if(field==='text')n.text=String(value).slice(0,600);
 notes[who]=n;dirty.add(who);noteStatus='Modifications à synchroniser';cacheNotes();queueNote(who);updateNoteUI();
}
function queueNote(who,delay=700){if(noteTimers.has(who))clearTimeout(noteTimers.get(who));noteTimers.set(who,setTimeout(()=>{noteTimers.delete(who);void syncNote(who)},delay))}
async function syncNote(who){
 if(!session||!notesReady||!dirty.has(who)||noteInFlight.has(who))return;
 const n=notes[who];if(!n)return;
 const payload={status:n.status,text:String(n.text||'').slice(0,600)};
 const serialized=JSON.stringify(payload);
 noteStatus='Enregistrement dans Firebase…';updateNoteUI();noteInFlight.add(who);
 const writingSession=session;
 try{
  await set(path(writingSession.code,`notebooks/${writingSession.role}/${who}`),{...payload,updatedAt:serverTimestamp()});
  // Ne jamais effacer des notes ou modifier l’interface d’une autre salle.
  if(session!==writingSession)return;
  if(JSON.stringify(notes[who])===serialized)dirty.delete(who);else queueNote(who);
  noteStatus=dirty.size?'Enregistrement en cours…':'Carnet sauvegardé dans Firebase';cacheNotes();updateNoteUI();
 }catch(e){if(session===writingSession){noteStatus='Connexion indisponible : copie locale conservée';cacheNotes();updateNoteUI()}return}
 finally{noteInFlight.delete(who);if(session===writingSession&&dirty.has(who)&&notesReady)queueNote(who,250)}
}
function listenNotebook(){
 restoreNotes();
 noteUnsub=onValue(path(session.code,`notebooks/${session.role}`),snap=>{
  const cloud=snap.val()||{};
  for(const who of suspects)if(!dirty.has(who)){
   if(cloud[who]&&noteStatuses.includes(cloud[who].status))notes[who]={status:cloud[who].status,text:String(cloud[who].text||'').slice(0,600)};
   else delete notes[who];
  }
  notesReady=true;noteStatus=dirty.size?'Synchronisation en cours…':'Carnet synchronisé avec Firebase';cacheNotes();
  for(const who of dirty)queueNote(who,100);
  if(!root.querySelector('[data-note]:focus'))render();else updateNoteUI();
 },e=>{noteStatus='Accès au carnet refusé : copie locale conservée';error='Carnet : '+e.message;render()});
}
function listenCurrentAnswer(){
 const step=Number(room?.progress?.step||0);if(step===lastAnswerStep)return;
 lastAnswerStep=step;if(answerUnsub){answerUnsub();answerUnsub=null;}
 room.answers={};selectedAnswer=-1;
 if(step>=15)return;

 if(![q.asker,q.target,'charlotte'].includes(session.role))return;
 answerUnsub=onValue(path(session.code,`answers/${q.id}`),snap=>{
  room.answers=snap.exists()?{[q.id]:snap.val()}:{};render();
 },e=>{error='Réponse : '+e.message;render()});

async function anon(){if(auth.currentUser&&!auth.currentUser.isAnonymous){await signOut(auth)}if(!auth.currentUser)await signInAnonymously(auth);me=auth.currentUser}
async function hostLogin(){await signInWithPopup(auth,new GoogleAuthProvider());me=auth.currentUser;render()}
function leaveRoom(renderNow=true){

 // Les notes en cours restent aussi dans le cache local et seront synchronisées à la reprise.

 if(unsub){unsub();unsub=null;}
 if(answerUnsub){answerUnsub();answerUnsub=null;}
 if(noteUnsub){noteUnsub();noteUnsub=null;}

 noteTimers.clear();noteInFlight.clear();
 const wasHost=session.role==='charlotte';

 notes={};dirty=new Set();notesReady=false;noteStatus='Connexion au carnet…';

}
async function createRoom(){if(!me||me.isAnonymous||!me.emailVerified)throw Error('Connecte ton compte Google MJ.');const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let j=0;j<5;j++){const nums=crypto.getRandomValues(new Uint8Array(8));const code=[...nums].map(i=>chars[i%chars.length]).join('');try{await set(path(code),{edition:'4.4',hostUid:me.uid,createdAt:serverTimestamp(),players:{charlotte:{uid:me.uid}},progress:{step:0}});if(session)leaveRoom(false);await openRoom(code,'charlotte');return}catch(e){if(e.code!=='PERMISSION_DENIED')throw e;throw e}}}
async function openRoom(code,role){code=String(code).trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{8}$/.test(code))throw Error('Code de salle invalide (8 caractères).');const edition=await get(path(code,'edition'));if(edition.val()!=='4.4')throw Error('Cette salle n’est pas une salle V4.4. Crée une nouvelle salle.');const host=(await get(path(code,'hostUid'))).val();if(role==='charlotte' && (host!==me.uid||me.isAnonymous))throw Error('Seule Charlotte peut reprendre le poste MJ.');if(role!=='charlotte' && host===me.uid)throw Error('Ouvre le personnage dans un navigateur privé, sans la session Google MJ.');const old=await get(path(code,`players/${role}`));if(old.exists()&&old.child('uid').val()!==me.uid)throw Error('Ce rôle est déjà réservé par un autre téléphone.');if(!old.exists())await set(path(code,`players/${role}`),{uid:me.uid});session={code,role};localStorage.setItem(sessionKey,JSON.stringify(session));selectedAnswer=-1;tab='enquete';startListening()}
function startListening(){
 if(unsub)unsub();
 if(answerUnsub){answerUnsub();answerUnsub=null;}
 if(noteUnsub){noteUnsub();noteUnsub=null;}
 for(const t of noteTimers.values())clearTimeout(t);noteTimers.clear();lastAnswerStep=null;
 const subs=[];room={players:{},progress:{step:0},answers:{},votes:{}};
 subs.push(onValue(path(session.code,'players'),s=>{room.players=s.val()||{};render()},e=>{error=e.message;render()}));
 subs.push(onValue(path(session.code,'progress'),s=>{room.progress=s.val()||{};listenCurrentAnswer();render()},e=>{error=e.message;render()}));
 if(session.role==='charlotte')subs.push(onValue(path(session.code,'votes'),s=>{room.votes=s.val()||{};render()},e=>{error=e.message;render()}));
 else subs.push(onValue(path(session.code,'votes/'+session.role),s=>{room.votes={[session.role]:s.val()};render()},e=>{error=e.message;render()}));
 listenNotebook();
 unsub=()=>{subs.forEach(fn=>fn());if(answerUnsub)answerUnsub();if(noteUnsub)noteUnsub();for(const t of noteTimers.values())clearTimeout(t);noteTimers.clear()};
 render();
}

async function changeStep(){const c=ctx();if(!c.isHost)return;let next=c.phase+1;if(next>16)return;if(next<=15&&!isComplete(next))throw Error('Attends le choix du répondant pour la confrontation '+next+'.');if(next===16&&investigators.some(p=>!c.votes[p]))throw Error('Attends les cinq verdicts.');await set(path(session.code,'progress/step'),next)}
async function submitAnswer(qIndex,answer){const q=Q[qIndex];if(!Number.isInteger(answer)||answer<0||answer>2)throw Error("Choisis une réponse.");if(session.role!==q.target||ctx().phase!==qIndex)throw Error('Ce n’est pas ton tour de répondre.');await set(path(session.code,`answers/${q.id}`),{value:answer,by:me.uid});selectedAnswer=-1}

function showStatus(){if(!session){stat.innerHTML='';return;}const c=ctx();stat.innerHTML=`<div class="card flex between"><div><strong>🟢 Salle ${h(session.code)}</strong><br><span class="muted small">${Object.keys(c.members).length}/6 profils · ${c.phase<15?'Manche '+(Math.floor(c.phase/5)+1)+'/3':c.phase===15?'Verdict':'Révélation'}</span></div><button class="btn secondary" data-action="copy">Copier le lien</button></div>`}
function loginUI(){const mj=new URLSearchParams(location.search).get('mj')==='1';return `<div class="card"><h2>Entrer dans l’enquête</h2>${mj?`<p>Accès réservé à Charlotte.</p>${me&&!me.isAnonymous?'<p class="ok">Compte Google MJ connecté.</p>':'<button class="btn" data-action="google">Se connecter avec Google</button>'}${me&&!me.isAnonymous?`<button class="btn secondary" data-action="create">Créer une salle V4.4.1</button>`:''}`:`<label>Code de salle<input id="code" maxlength="8" value="${h(joinCode)}" placeholder="ABCDEFGH"></label><label>Mon personnage<select id="player">${investigators.map(p=>`<option value="${p}" ${selectedPlayer===p?'selected':''}>${P[p]}</option>`).join('')}</select></label><button class="btn" data-action="join">Rejoindre la salle</button><p class="small muted">Chaque joueur utilise son propre navigateur / téléphone, sans le compte Google MJ.</p><button class="btn secondary" data-action="host">Je suis Charlotte (MJ)</button>`}</div>`}
function menu(){return `<div class="tabs">${[['enquete','🎭 Mon tour'],['carnet','📋 Mon Cluedo'],['mj','👑 MJ']].filter(([k])=>k!=='mj'||session.role==='charlotte').map(([k,label])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${label}</button>`).join('')}<button class="btn secondary" data-action="leave">🚪 Quitter la salle</button></div>`}
function interrogation(){
 const c=ctx(),step=c.phase;
 if(step>=16)return `<div class="card"><h2>🎁 Le Trésor de la Chouquette</h2><p>Enola a innocemment déplacé le coffret près des doudous pour jouer. Les petits secrets de la famille ne prouvaient pas un vol.</p><p><strong>Charlotte peut autoriser une seule recherche du Trésor près des jouets.</strong></p><h3>Les verdicts</h3>${session.role==='charlotte'?investigators.map(p=>`<p>${P[p]} : ${h(P[c.votes[p]?.suspect]||'Indéterminé')} — ${h(c.votes[p]?.argument||'')}</p>`).join(''):`<p>Charlotte lit les verdicts à voix haute. Ton choix : ${h(P[c.votes[session.role]?.suspect]||'Indéterminé')}.</p>`}</div>`;
 if(step===15){
  const mine=c.votes[session.role];
  return `<div class="card"><div class="round">VERDICT FINAL</div><h2>Qui a déplacé le Trésor ?</h2><p>Base ton avis sur ce que tu as entendu.</p>${session.role==='charlotte'?'<p>Charlotte : attends les cinq verdicts avant de dévoiler la vérité.</p>':mine?'<div class="ok">Verdict enregistré. Il est privé jusqu’à la révélation.</div>':`<label>Mon suspect<select id="suspect"><option value="">Choisir…</option>${Object.keys(P).map(p=>`<option value="${p}" ${chosenSuspect===p?'selected':''}>${P[p]}</option>`).join('')}<option value="indetermine">Je ne sais pas</option></select></label><label>Ma raison (facultatif)<textarea id="voteReason" maxlength="220" placeholder="J’ai remarqué que…">${h(voteArgument)}</textarea></label><button class="btn" data-action="vote">Déposer mon verdict</button>`}</div>`;
 }
 const q=Q[step],answer=c.answers[q.id];
 const asker=session.role===q.asker,target=session.role===q.target,host=session.role==='charlotte';
 if(!asker&&!target&&!host)return `<div class="card"><div class="round">MANCHE ${q.round}/3 · Tour ${q.id}/15</div><h2>👂 Écoute et enquête</h2><p>La question et la réponse se donnent <strong>uniquement à voix haute</strong>. Rien à lire sur ton écran pendant cet interrogatoire.</p><p>Note tes soupçons, tes doutes et les contradictions que tu entends.</p><button class="btn secondary" data-tab="carnet">Ouvrir mon carnet Cluedo</button></div>`;
 let html=`<div class="card"><div class="round">MANCHE ${q.round}/3 · Tour ${q.id}/15</div><h2>${asker?'🎤 À toi de poser la question':target?'🎭 À toi de répondre':'👑 Charlotte — interrogation'}</h2><p>${P[q.asker]} interroge ${P[q.target]}</p><p class="quote">« ${h(q.question)} »</p>`;
 if(asker&&!target)html+='<p>Lis cette question à voix haute. Écoute la réponse sans la chercher sur ton écran.</p>';
 if(target&&!answer)html+=`<h3>Choisis ta réponse</h3><p><strong>Lis le texte sélectionné à voix haute.</strong> Les autres téléphones ne le montrent pas.</p><div class="options">${q.answers.map((text,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${selectedAnswer===i?'checked':''}>${h(text)}</label>`).join('')}</div><button class="btn" data-action="answer" ${selectedAnswer<0?'disabled':''}>Enregistrer ma réponse</button>`;
 if(target&&answer)html+=`<div class="private"><strong>Ta réponse :</strong><p>« ${h(q.answers[answer.value])} »</p><p>Dis-la à voix haute si tu ne l’as pas encore fait.</p></div>`;
 if(asker&&!target&&!answer)html+=`<p class="muted">⏳ Après la réponse orale, tu recevras une relance adaptée au choix du suspect.</p>`;
 if(asker&&!target&&answer)html+=`<div class="private"><strong>🎯 Ta question de relance :</strong><p class="quote">« ${h(q.relances[answer.value])} »</p><p>Pose-la à voix haute, puis laisse les autres réagir. Aucun texte de réponse ne s'affiche ici.</p></div>`;
 if(host&&!target&&answer)html+='<p class="ok">Réponse reçue. Laisse les échanges se poursuivre avant de passer à la question suivante.</p>';
 html+='</div>';
 if(target||host)html+=`<div class="card private"><h3>🔒 Secret du personnage</h3><p>${h(q.truth)}</p><p class="small">Ne le dévoile que si la discussion établit ce fait.</p></div>`;
 return html;
}
function carnet(){return `<div class="card"><h2>📋 Mon carnet Cluedo</h2><p class="muted">Notes privées par joueur, enregistrées dans Firebase. Une copie locale évite de perdre tes saisies en cas de coupure.</p><p class="small ok" data-note-sync>${h(noteStatus)}</p>${suspects.map(p=>{const x=notes[p]||{};return `<div class="note-row"><strong>${P[p]}</strong><label>Mon avis<select data-note="${p}" data-field="status">${[['inconnu','❔ Inconnu'],['suspect','🔴 Suspect'],['verifier','🟠 À vérifier'],['ecarte','🟢 Écarté']].map(([v,l])=>`<option value="${v}" ${(x.status||'inconnu')===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Mes observations<textarea data-note="${p}" data-field="text" maxlength="600" placeholder="Témoignage, alibi, contradiction…">${h(x.text||'')}</textarea></label></div>`}).join('')}<p class="small muted">Ce carnet n'est pas visible des autres personnages, ni de Charlotte. Il se retrouve avec la même session Firebase sur le même navigateur.</p></div>`}

function mjUI(){const c=ctx();const step=c.phase;let ready=step===15?investigators.every(p=>c.votes[p]):step<15?isComplete(step+1):false;let copy=step<15?`La question ${step+1} est ${isComplete(step+1)?'terminée':'en cours'}. ${P[Q[step].asker]} interroge ${P[Q[step].target]}.`:step===15?`${Object.keys(c.votes).length}/5 votes`:'La révélation est affichée.';return `<div class="card"><h2>👑 Charlotte — Panneau MJ V4.4.1</h2><p><strong>${step<15?'Manche '+(Math.floor(step/5)+1)+'/3 · Confrontation '+(step+1)+'/15':step===15?'Verdict':'Terminé'}</strong></p><p>${copy}</p><div class="private"><strong>Ton rôle :</strong> laisse la question, la réponse et les réactions se dérouler à l'oral. Ne révèle pas le dossier secret avant que les joueurs aient formulé leur hypothèse.</div><p>Profils connectés : ${Object.keys(c.members).length}/6. ${investigators.filter(p=>!c.members[p]).map(p=>P[p]+' absent').join(', ')}</p>${step<16?`<button class="btn" data-action="advance" ${!ready?'disabled':''}>${step===14?'Ouvrir le verdict':step===15?'Révéler le Trésor':'Question suivante →'}</button><p class="muted small">${ready?'Prêt à poursuivre.':step===15?'Il manque des verdicts.':'Attendre la réponse du suspect.'}</p>`:''}<details><summary>📜 Dossier confidentiel — vérité de l’enquête</summary><p><strong>20 h 25 :</strong> Nino prend une friandise. <strong>20 h 28 :</strong> Mathieu cache un sac de bonbons. <strong>20 h 29 :</strong> Charlotte déplace une décoration. <strong>Après 20 h 31 :</strong> James voit encore le coffret. <strong>20 h 33 :</strong> Matys et Nino sont à la cuisine ; Enola transporte le coffret vers les jouets ; Andreas entend un couvercle. <strong>20 h 35 :</strong> disparition constatée.</p><p>La lettre d'Halloween sert de distraction, sans énigme informatique ni vol historique.</p></details><div class="card"><h3>🧪 Tests : nouvelle salle</h3><p class="small muted">Créer une nouvelle salle V4.4 sans effacer l’ancienne. Ton compte Google MJ reste connecté.</p><button class="btn secondary" data-action="new-room">Créer une nouvelle salle</button></div></div>`}
function render(){showStatus();let html='';if(!session)html=loginUI();else html=menu()+(tab==='carnet'?carnet():tab==='mj'?mjUI():interrogation());if(error)html=`<div class="card error">⚠️ ${h(error)} <button class="btn secondary" data-action="dismiss">Fermer</button></div>`+html;root.innerHTML=html;}
root.addEventListener('change',e=>{
 if(e.target.name==='answer'){selectedAnswer=Number(e.target.value);render()}
 if(e.target.id==='player')selectedPlayer=e.target.value;
 if(e.target.id==='suspect')chosenSuspect=e.target.value;
 if(e.target.dataset.note)editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);
});
root.addEventListener('input',e=>{
 if(e.target.dataset.note)editNote(e.target.dataset.note,e.target.dataset.field,e.target.value);
 if(e.target.id==='voteReason')voteArgument=e.target.value;
 if(e.target.id==='code')joinCode=e.target.value;
});

root.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-tab]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render();return}const action=el.dataset.action;if(pending)return;pending=true;error='';try{if(action==='dismiss'){}else if(action==='google')await hostLogin();else if(action==='host'){location.href=location.pathname+'?mj=1';return}else if(action==='create'||action==='new-room')await createRoom();else if(action==='leave')leaveRoom();else if(action==='join')await openRoom(joinCode,selectedPlayer);else if(action==='copy'){const url=location.origin+location.pathname+'?room='+session.code;await navigator.clipboard.writeText(url)}else if(action==='advance')await changeStep();else if(action==='answer')await submitAnswer(ctx().phase,selectedAnswer);else if(action==='vote')await vote()}catch(ex){error=ex.message||String(ex)}finally{pending=false;render()}});
onAuthStateChanged(auth,async u=>{me=u;try{if(!u){await signInAnonymously(auth);return}const prior=JSON.parse(localStorage.getItem(sessionKey)||'null');if(prior&&!session){try{await openRoom(prior.code,prior.role)}catch(e){localStorage.removeItem(sessionKey);error='Ancienne session : '+e.message}}render()}catch(e){error=e.message;render()}});
</script></body></html>
