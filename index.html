<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import { getDatabase, ref, get, set, update, onValue, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

const firebaseConfig = {
  apiKey: 'AIzaSyAUA4xdHZyh17ZkmDHe0gXqIrNZgEovcrw',
  authDomain: 'roubatvot-murder-party.firebaseapp.com',
  databaseURL: 'https://roubatvot-murder-party-default-rtdb.firebaseio.com',
  projectId: 'roubatvot-murder-party',
  storageBucket: 'roubatvot-murder-party.firebasestorage.app',
  messagingSenderId: '225363228130',
  appId: '1:225363228130:web:94c1839cbe0d542f86b5bb',
  measurementId: 'G-0C0DLB8E6C'
};
const configured = ['apiKey','authDomain','databaseURL','projectId','appId'].every(k =>
  typeof firebaseConfig[k] === 'string' && firebaseConfig[k].length > 5 && !firebaseConfig[k].startsWith('REMPLACER_')
);
let app, auth, db, bootPromise, unsubscribers = [], offsetMs = 0;
const players = ['james','nino','andreas','matys','mathieu'];
function stopListening() { unsubscribers.forEach(unsub => unsub()); unsubscribers = []; }
function pathFor(code, name) { return ref(db, `rooms/${code}/${name}`); }
async function boot() {
  if (!configured) throw new Error('Complète firebaseConfig dans le HTML avant la connexion.');
  if (!bootPromise) bootPromise = (async () => {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
    const user = await new Promise((resolve, reject) => {
      let unsub = () => {};
      unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); }, reject);
    });
    if (!user) await signInAnonymously(auth);
    if (!auth.currentUser) throw new Error('Authentification anonyme indisponible. Active-la dans Firebase Authentication.');
    return auth.currentUser.uid;
  })();
  await bootPromise;
  return auth.currentUser?.uid;
}
function currentHostAccount() {
  const user = auth?.currentUser;
  return user?.providerData?.some(p => p.providerId === 'google.com') ? {uid:user.uid,email:user.email,verified:user.emailVerified} : null;
}
async function signInHost() {
  if (!auth) throw new Error('Firebase n’est pas prêt.');
  const result = await signInWithPopup(auth,new GoogleAuthProvider());
  if (!result.user.emailVerified) throw new Error('Le compte Google doit avoir une adresse e-mail vérifiée.');
  return currentHostAccount();
}
async function switchToAnonymous() {
  await boot();
  await signOut(auth);
  await signInAnonymously(auth);
}
function randomRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}
async function createRoom() {
  const uid = await boot();
  if (!currentHostAccount()?.verified) throw new Error('Connecte-toi avec ton compte Google pour créer une salle MJ.');
  for (let i=0; i<6; i++) {
    const code = randomRoomCode();
    try {
      await set(pathFor(code,''), {
        hostUid: uid,
        edition: '4.2',
        createdAt: serverTimestamp(),
        players: { charlotte: { uid } },
        progress: {
          confession: false,
          hintAll: false,
          round: 1,
          stage: 0,
          beat: 0,
          clock: { running: false, elapsedMs: 0, startedAt: 0 }
        }
      });
      return {code, playerId:'charlotte', isHost:true};
    } catch (error) {
      // Collision (extrêmement improbable) : on réessaie seulement si la salle existe.
      try { if (!(await get(pathFor(code,'hostUid'))).exists()) throw error; }
      catch (checkError) { throw error; }
    }
  }
  throw new Error('Impossible de générer un code de salle libre.');
}
async function joinRoom(roomCode, playerId) {
  const uid = await boot();
  const code = String(roomCode || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) throw new Error('Le code de salle doit contenir huit caractères.');
  if (!players.includes(playerId) && playerId !== 'charlotte') throw new Error('Choisis un personnage valide.');
  const hostSnap = await get(pathFor(code,'hostUid'));
  if (!hostSnap.exists()) throw new Error('Salle introuvable. Vérifie les huit caractères.');
  const editionSnap = await get(pathFor(code,'edition'));
  if (editionSnap.val() !== '4.2') throw new Error('Cette salle appartient à une ancienne version du jeu. Crée une nouvelle salle V4.2.');
  const isHost = hostSnap.val() === uid;
  if (playerId === 'charlotte' && !currentHostAccount()?.verified) throw new Error('La connexion Google est obligatoire pour reprendre le rôle MJ.');
  if (playerId === 'charlotte' && !isHost) throw new Error('Seul le compte Google créateur peut rejoindre le rôle MJ.');
  if (playerId !== 'charlotte' && isHost) throw new Error('Le téléphone MJ doit conserver son propre profil.');
  const playerRef = pathFor(code, `players/${playerId}`);
  const prior = await get(playerRef);
  if (prior.exists() && prior.child('uid').val() !== uid) throw new Error('Ce personnage est déjà pris sur un autre téléphone.');
  if (!prior.exists()) await set(playerRef, {uid});
  return {code, playerId, isHost};
}
function listenRoom(session, callbacks) {
  stopListening();
  const { code, playerId, isHost } = session;
  unsubscribers.push(onValue(pathFor(code,'progress'), snap => callbacks.progress(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'players'), snap => callbacks.players(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,isHost?'votes':`votes/${playerId}`), snap => callbacks.votes(snap.val() || null), callbacks.error));
  unsubscribers.push(onValue(pathFor(code,'accusations'), snap => callbacks.accusations(snap.val() || {}), callbacks.error));
  unsubscribers.push(onValue(ref(db,'.info/serverTimeOffset'), snap => {
    offsetMs = Number(snap.val()) || 0;
    callbacks.offset(offsetMs);
  }, callbacks.error));
}
async function publishSolved(code, level, playerId) {
  if (!players.includes(playerId) || players[level-1] !== playerId) throw new Error('Cette énigme ne correspond pas au joueur.');
  await set(pathFor(code,`progress/solved/${level}`),true);
}
async function forceSolve(code, id) {
  for (let i=1; i<=id; i++) await set(pathFor(code,`progress/solved/${i}`),true);
}
async function hostFlag(code,name,value) {
  if (!['confession','hintAll'].includes(name)) throw new Error('Commande MJ inconnue.');
  await set(pathFor(code,`progress/${name}`),Boolean(value));
}
async function hostClock(code, running, currentClock) {
  const now = Date.now()+offsetMs;
  const elapsed = Number(currentClock?.elapsedMs || 0);
  const started = Number(currentClock?.startedAt || 0);
  await set(pathFor(code,'progress/clock'),running
    ? {running:true,elapsedMs:elapsed,startedAt:serverTimestamp()}
    : {running:false,elapsedMs:elapsed+(currentClock?.running ? Math.max(0,now-started):0),startedAt:0});
}
async function hostStage(code, stage) {
  if (!Number.isInteger(stage) || stage < 0 || stage > 4) throw new Error('Acte invalide.');
  await update(pathFor(code,'progress'), {stage, beat:0});
}
async function hostBeat(code, beat) {
  if (!Number.isInteger(beat) || beat < 0 || beat > 9) throw new Error('Étape de scène invalide.');
  await set(pathFor(code,'progress/beat'), beat);
}
async function castAccusation(code, playerId, accusation) {
  if (!players.includes(playerId)) throw new Error('Seuls les enquêteurs peuvent accuser.');
  await set(pathFor(code,`accusations/${playerId}`), {
    suspect:accusation.suspect,
    indice:accusation.indice,
    argument:accusation.argument.trim(),
    submittedAt:serverTimestamp()
  });
}
async function castVote(code, playerId, vote) {
  await set(pathFor(code,`votes/${playerId}`), {
    tresor:vote.tresor,
    preuve:vote.preuve,
    argument:vote.argument,
    submittedAt:serverTimestamp()
  });
}
async function resetRoom(code) {
  const roundSnap = await get(pathFor(code,'progress/round'));
  const nextRound = (Number(roundSnap.val()) || 1) + 1;
  await update(pathFor(code,'progress'), {
    solved:null,
    confession:false,
    hintAll:false,
    stage:0,
    beat:0,
    round:nextRound,
    clock:{running:false,elapsedMs:0,startedAt:0}
  });
  await set(pathFor(code,'votes'),null);
  await set(pathFor(code,'accusations'),null);
}
window.RoubatvotFirebase = {configured, boot, createRoom, joinRoom, listenRoom, stopListening,
  publishSolved, forceSolve, hostFlag, hostClock, hostStage, hostBeat, castAccusation, castVote, resetRoom, currentHostAccount, signInHost, switchToAnonymous};
window.dispatchEvent(new Event('roubatvot-firebase-ready'));
</script>

 if (stage===0 && !solved.includes(1)) return ['James doit terminer sa première énigme.'];
 if (stage===1 && ![1,2,3].every(n=>solved.includes(n))) return ['Attendre les énigmes de Nino et Andreas.'];
 if (stage===2 && Object.keys(accusations).length<5) return [`Attendre les cinq premiers soupçons (${Object.keys(accusations).length}/5).`];
 if (stage===3 && ![1,2,3,4,5].every(n=>solved.includes(n))) return ['Attendre les énigmes de Matys et Mathieu.'];
 if (stage===4 && Object.keys(votes||{}).length<5) return [`Attendre les cinq verdicts (${Object.keys(votes||{}).length}/5).`];
 return [];
}

const EVIDENCE_LABELS = Object.fromEntries(EVIDENCE_V4.map(p=>[p.id,p.title]));
const SUSPECT_OPTIONS = ['James','Nino','Andreas','Matys','Mathieu','Charlotte','Enola','Indéterminé'];
const ACCUSATION_CLUES = ['S-00','J-01','J-02','N-01','A-01','Indéterminé'];
const VOTE_QUESTIONS = [{key:'tresor',title:'Qui a déplacé le Trésor ?',help:'Tu peux changer d’avis depuis ton premier soupçon.',options:SUSPECT_OPTIONS.map(v=>[v,v==='Indéterminé'?'Je ne sais pas encore':v])}];

const FINAL_VERDICT = {tresor:'Enola'};
function voteLabel(question, value) { return question.options.find(([k]) => k === value)?.[1] || value || '—'; }
function getLiveAdvice(solvedLevels,stage,beat,reveal,accusationCount,myAccusation,isMJ,voteSubmitted) {
 if(reveal) return {title:'Le Trésor vous attend',action:'Charlotte lit la vérité puis autorise une seule recherche près des doudous.',question:'Quels détails vous avaient mis sur la bonne piste ?',tab:'reveal'};
 const current=ACTS[stage]||ACTS[0];
 let action=current.public;
 if(stage===0) action=solvedLevels.includes(1)?'James a terminé. Charlotte peut ouvrir le deuxième acte.':'James commence son énigme. Les autres découvrent leur personnage.';
 if(stage===1) action=solvedLevels.includes(3)?'Nino et Andreas ont terminé. Réunissez-vous pour les questions, puis Charlotte ouvre les soupçons.':'Nino puis Andreas résolvent leur énigme, ensuite discutez ensemble.';
 if(stage===2) action=myAccusation?'Ton soupçon est enregistré. Écoute les autres.':`Dépose ton premier soupçon (${accusationCount}/5) ; Charlotte lancera ensuite les nouveaux témoignages.`;
 if(stage===3) action=solvedLevels.includes(5)?'Les cinq énigmes sont résolues : discutez du test de Mathieu et de l’alibi de Nino.':'Matys puis Mathieu résolvent leurs énigmes. Discutez de l’alibi de Nino.';
 if(stage===4) action=voteSubmitted?'Verdict enregistré. Écoute les autres sans révéler la fin.':'Écoutez James et Andreas, puis votez pour le responsable présumé.';
 return {title:`Acte ${stage+1}/5 · ${current.name}`,action,question:current.questions[0],tab:isMJ?'mj':'interro'};
}

const STORE_KEY = 'roubatvot_refonte_v42';
const defaultProgress = { solvedLevels: [], margueriteUnlocked: false, votes: {...EMPTY_VOTE}, voteSubmitted: false, timerSeconds: 0, isTimerActive: false, stage:0, beat:0, accusations:{}, puzzleStarts: {}, hintsAsked: {} };
function readGame() {
  try {
    const val = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    return val && typeof val === 'object' ? {...defaultProgress, ...val} : defaultProgress;
  } catch (_) { return defaultProgress; }
}
function safeSave(key, val) { try { localStorage.setItem(key, val); } catch (_) {} }
function normalizeCode(s) { return String(s || '').trim().toUpperCase().replace(/\s+/g,''); }

  const setMargueriteUnlocked = val => { if (sharedMode) {window.RoubatvotFirebase.hostFlag(roomSession.code,'confession',val).catch(e=>setFirebaseError(e.message)); return;} setGame(g=>({...g,margueriteUnlocked: typeof val === 'function' ? val(g.margueriteUnlocked):val})); };

                    <ol className="text-sm leading-relaxed list-decimal list-inside space-y-2">{MJ_THREE_ACTIONS[stage].map((step,i)=><li key={i}>{step}</li>)}</ol>
                  </div>
                  <div className="rounded-lg bg-slate-950 border border-rose-900/50 p-3 space-y-1"><strong className="text-rose-300">🔒 Ce que toi seule sais</strong><p>{ACTS[stage].spoiler}</p></div>
                  <p className="text-slate-400">Avancement : {solvedLevels.length}/5 énigmes · {Object.keys(accusations).length}/5 soupçons · {Object.keys(remoteVotes||{}).length}/5 verdicts</p>
                  {stage<4 ? <button disabled={hostBusy || (!testMode && gateReasons.length>0)} onClick={()=>setStage(stage+1)} className="w-full bg-emerald-700 disabled:bg-slate-700 disabled:text-slate-400 rounded-lg p-4 text-sm font-bold">➡️ {hostBusy?'Enregistrement…':`Ouvrir l’acte ${stage+2} · ${ACTS[stage+1].name}`}</button>
                    : <button disabled={hostBusy || margueriteUnlocked || (!testMode && gateReasons.length>0)} onClick={()=>{if(!testMode && gateReasons.length){setFirebaseError(gateReasons[0]);return;}setMargueriteUnlocked(true);}} className="w-full bg-purple-700 disabled:bg-slate-700 disabled:text-slate-400 rounded-lg p-4 text-sm font-bold">{margueriteUnlocked?'🎭 Révélation déjà diffusée':'🎭 Révéler la vérité à tous'}</button>}
                  {gateReasons.length>0 && !margueriteUnlocked && <p className="text-amber-200 bg-amber-950/30 border border-amber-700/40 rounded-lg p-3">⏳ {gateReasons[0]}</p>}
                  <button onClick={()=>setActiveTab('interro')} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-semibold">🗣️ Voir ce que voient les joueurs</button>
                  <details className="border border-slate-700 rounded-lg p-3"><summary className="cursor-pointer text-slate-300">🧪 Options de secours (à éviter pendant la partie)</summary>
                    <div className="space-y-2 mt-3"><label className="flex gap-2 items-center"><input type="checkbox" checked={testMode} onChange={e=>setTestMode(e.target.checked)} /> Mode test : autoriser un saut d’acte</label>
                    {testMode && stage<4 && <p className="text-amber-200">Le bouton principal ignore alors les conditions de progression. Utilise une salle de test uniquement.</p>}
                    <button onClick={()=>setIsTimerActive(!isTimerActive)} className="w-full bg-slate-800 rounded-lg p-2">{isTimerActive?'⏸ Pause chrono':'▶ Lancer chrono'}</button>
                    <button onClick={()=>sharedMode?window.RoubatvotFirebase.hostFlag(roomSession.code,'hintAll',!remoteProgress?.hintAll).catch(e=>setFirebaseError(e.message)):setMjForceHints(!mjForceHints)} className="w-full bg-slate-800 rounded-lg p-2">💡 {(sharedMode?remoteProgress?.hintAll:mjForceHints)?'Masquer':'Afficher'} tous les indices</button>
                    {PUZZLES.map(p=><div key={p.id} className="flex justify-between items-center"><span>Énigme {p.id}</span><button disabled={solvedLevels.includes(p.id)} onClick={()=>handleMJUnlock(p.id)} className="rounded bg-amber-700 disabled:bg-slate-800 px-3 py-1">{solvedLevels.includes(p.id)?'Validée':'Forcer'}</button></div>)}
                    <button onClick={()=>{if(confirm('Réinitialiser toute la partie et les votes ?')){if(sharedMode)window.RoubatvotFirebase.resetRoom(roomSession.code).catch(e=>setFirebaseError(e.message));else setGame({...defaultProgress,votes:{...EMPTY_VOTE},puzzleStarts:{},hintsAsked:{}});}}} className="w-full border border-rose-700 bg-rose-950 rounded-lg p-2 text-rose-200">↺ Nouvelle manche / réinitialiser</button>
                    </div>
                  </details>
                </div>

                {sharedMode && <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs">
                  <p className="font-bold text-amber-400">Profils attribués à la salle</p>
                  {Object.keys(PLAYERS).map(id=><p key={id} className="flex justify-between"><span>{PLAYERS[id].avatar} {PLAYERS[id].name}</span><span>{roomPlayers[id]?'Profil réservé':'En attente'}</span></p>)}
                  <p className="font-bold text-indigo-300 pt-2">Premières accusations : {Object.keys(accusations).length}/5</p>
                  {Object.entries(accusations).map(([id,a])=><p key={id}>{PLAYERS[id]?.name} → {a.suspect} ({a.indice})</p>)}
                  <p className="font-bold text-amber-400 pt-2">Votes enregistrés : {Object.keys(remoteVotes || {}).length} / 5</p>
                  {Object.entries(remoteVotes || {}).map(([id,v])=><p key={id} className="text-slate-300">{PLAYERS[id]?.name||id} : {v.tresor||'—'} · {EVIDENCE_LABELS[v.preuve]||'indice non précisé'}</p>)}

                </div>}


              </div>
            )}
          </>
        )}

      </main>

      <footer className="bg-slate-950 border-t border-slate-900 p-2 text-center text-[10px] text-slate-500">
        La Malédiction des Roubatvot &copy; 2026 - Ingré · {sharedMode ? "synchronisation Firebase" : "mode local avec codes-relais"}
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
